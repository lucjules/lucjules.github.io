<script>
/* exalgo.js */
/* ExAlgo : interpréteur pédagogique pour le cycle 1
   Sous-ensemble : Var, ←, ++/--, Si/Sinon Si/Sinon (blocs par indentation),
   Fonction ... Début ... Fin, Retourner, ecrire, ecrireLigne, lire*, afficheCar, afficheLigne. */
const Exalgo = (() => {
  'use strict';

  class ExError extends Error {
    constructor(message, line) {
      super(message);
      this.name = 'ExError';
      this.line = line || null;
    }
  }

  const strip = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  const TYPE_NAMES = { entier: 'entier', reel: 'réel', caractere: 'caractère', booleen: 'booléen' };
  function normType(word) {
    const w = strip(word);
    if (TYPE_NAMES[w]) return TYPE_NAMES[w];
    if (w.endsWith('s') && TYPE_NAMES[w.slice(0, -1)]) return TYPE_NAMES[w.slice(0, -1)];
    return null;
  }
  const tname = t => (t === 'chaîne' ? 'texte' : t);

  const BUILTIN_KEYS = new Set(['ecrire', 'ecrireligne', 'lireentier', 'lirereel', 'lirecaractere', 'affichecar', 'afficheligne']);

  /* ---------- Lexer ---------- */
  function tokenizeLine(text, lineNo, st) {
    const toks = [];
    let i = 0;
    const n = text.length;
    while (i < n) {
      if (st.inBlock) {
        const end = text.indexOf('*/', i);
        if (end === -1) { i = n; break; }
        st.inBlock = false;
        i = end + 2;
        continue;
      }
      const c = text[i];
      if (c === ' ' || c === '\t') { i++; continue; }
      if (c === '/' && text[i + 1] === '/') break;
      if (c === '/' && text[i + 1] === '*') { st.inBlock = true; i += 2; continue; }
      if (c === '"') {
        let j = i + 1, s = '';
        while (j < n && text[j] !== '"') {
          if (text[j] === '\\' && j + 1 < n) {
            const nx = text[j + 1];
            s += nx === 'n' ? '\n' : nx;
            j += 2;
          } else { s += text[j]; j++; }
        }
        if (j >= n) throw new ExError('Il manque le guillemet fermant (") de ce texte.', lineNo);
        toks.push({ k: 'str', v: s, line: lineNo });
        i = j + 1;
        continue;
      }
      if (c === "'") {
        const cp = [...text.slice(i + 1)][0];
        if (cp === undefined || cp === "'") throw new ExError("Un caractère s'écrit entre apostrophes, avec exactement un symbole : 'a'.", lineNo);
        const j = i + 1 + cp.length;
        if (text[j] !== "'") throw new ExError("Un caractère ne contient qu'un seul symbole : 'a'. Pour du texte, utilise des guillemets.", lineNo);
        toks.push({ k: 'chr', v: cp, line: lineNo });
        i = j + 1;
        continue;
      }
      if (/[0-9]/.test(c)) {
        let j = i;
        while (j < n && /[0-9]/.test(text[j])) j++;
        let real = false;
        if (text[j] === '.' && /[0-9]/.test(text[j + 1] || '')) {
          real = true;
          j++;
          while (j < n && /[0-9]/.test(text[j])) j++;
        }
        toks.push({ k: 'num', v: parseFloat(text.slice(i, j)), real, line: lineNo });
        i = j;
        continue;
      }
      if (/[A-Za-zÀ-ÿ_]/.test(c)) {
        let j = i;
        while (j < n && /[A-Za-zÀ-ÿ0-9_]/.test(text[j])) j++;
        const word = text.slice(i, j);
        toks.push({ k: 'id', v: word, kw: strip(word), line: lineNo });
        i = j;
        continue;
      }
      const two = text.slice(i, i + 2);
      if (['<-', ':=', '==', '!=', '<=', '>=', '++', '--'].includes(two)) {
        toks.push({ k: 'op', v: (two === '<-' || two === ':=') ? '←' : two, line: lineNo });
        i += 2;
        continue;
      }
      if ('←≠≤≥'.includes(c)) {
        toks.push({ k: 'op', v: c === '≠' ? '!=' : c === '≤' ? '<=' : c === '≥' ? '>=' : c, line: lineNo });
        i++;
        continue;
      }
      if ('+-*/%()<>,:='.includes(c)) {
        toks.push({ k: 'op', v: c, line: lineNo });
        i++;
        continue;
      }
      throw new ExError(`Symbole inattendu « ${c} ».`, lineNo);
    }
    return toks;
  }

  function splitLines(src) {
    const st = { inBlock: false };
    const lines = [];
    src.replace(/\r\n?/g, '\n').split('\n').forEach((raw, idx) => {
      const lineNo = idx + 1;
      let indent = 0, i = 0;
      while (i < raw.length && (raw[i] === ' ' || raw[i] === '\t')) {
        indent += raw[i] === '\t' ? 4 : 1;
        i++;
      }
      const toks = tokenizeLine(raw.slice(i), lineNo, st);
      if (toks.length) lines.push({ indent, toks, line: lineNo });
    });
    return lines;
  }

  const tokText = t => (t.k === 'str' ? `"${t.v}"` : t.k === 'chr' ? `'${t.v}'` : String(t.v));

  class Cur {
    constructor(toks, line) { this.t = toks; this.i = 0; this.line = line; }
    peek(o = 0) { return this.t[this.i + o]; }
    next() { return this.t[this.i++]; }
    eof() { return this.i >= this.t.length; }
    isKw(w, o = 0) { const t = this.peek(o); return !!t && t.k === 'id' && t.kw === w; }
    isOp(v, o = 0) { const t = this.peek(o); return !!t && t.k === 'op' && t.v === v; }
    expectOp(v, msg) {
      if (!this.isOp(v)) throw new ExError(msg || `Il manque « ${v} ».`, this.line);
      return this.next();
    }
  }

  /* ---------- Parser ---------- */
  class Parser {
    constructor(lines) {
      this.lines = lines;
      this.p = 0;
      this.fns = new Map();
      this.top = [];
    }

    parseProgram() {
      while (this.p < this.lines.length) {
        const L = this.lines[this.p];
        const t0 = L.toks[0];
        if (t0.k === 'id' && t0.kw === 'fonction') this.parseFunction();
        else this.top.push(this.parseStatement());
      }
    }

    /* --- expressions --- */
    parseExpr(c) { return this.parseOr(c); }
    parseOr(c) {
      let l = this.parseAnd(c);
      while (c.isKw('ou')) { c.next(); const r = this.parseAnd(c); l = { k: 'bin', op: 'ou', l, r, line: c.line }; }
      return l;
    }
    parseAnd(c) {
      let l = this.parseNot(c);
      while (c.isKw('et')) { c.next(); const r = this.parseNot(c); l = { k: 'bin', op: 'et', l, r, line: c.line }; }
      return l;
    }
    parseNot(c) {
      if (c.isKw('non')) { c.next(); const e = this.parseNot(c); return { k: 'un', op: 'non', e, line: c.line }; }
      return this.parseCmp(c);
    }
    parseCmp(c) {
      const l = this.parseAdd(c);
      const t = c.peek();
      if (t && t.k === 'op' && ['==', '!=', '<=', '>=', '<', '>'].includes(t.v)) {
        c.next();
        const r = this.parseAdd(c);
        return { k: 'bin', op: t.v, l, r, line: c.line };
      }
      if (t && t.k === 'op' && t.v === '=') {
        throw new ExError("Pour comparer deux valeurs, écris « == » (un seul « = » n'existe pas en ExAlgo).", c.line);
      }
      return l;
    }
    parseAdd(c) {
      let l = this.parseMul(c);
      while (c.isOp('+') || c.isOp('-')) {
        const op = c.next().v;
        const r = this.parseMul(c);
        l = { k: 'bin', op, l, r, line: c.line };
      }
      return l;
    }
    parseMul(c) {
      let l = this.parseUnary(c);
      while (c.isOp('*') || c.isOp('/') || c.isOp('%')) {
        const op = c.next().v;
        const r = this.parseUnary(c);
        l = { k: 'bin', op, l, r, line: c.line };
      }
      return l;
    }
    parseUnary(c) {
      if (c.isOp('-')) { c.next(); const e = this.parseUnary(c); return { k: 'un', op: 'neg', e, line: c.line }; }
      if (c.isOp('+')) { c.next(); return this.parseUnary(c); }
      return this.parsePrimary(c);
    }
    parsePrimary(c) {
      const t = c.peek();
      if (!t) throw new ExError("L'expression est incomplète : il manque une valeur à la fin.", c.line);
      if (t.k === 'num') { c.next(); return { k: 'num', t: t.real ? 'réel' : 'entier', v: t.v, line: c.line }; }
      if (t.k === 'str') { c.next(); return { k: 'str', v: t.v, line: c.line }; }
      if (t.k === 'chr') { c.next(); return { k: 'chr', v: t.v, line: c.line }; }
      if (t.k === 'id') {
        if (t.kw === 'vrai' || t.kw === 'faux') { c.next(); return { k: 'bool', v: t.kw === 'vrai', line: c.line }; }
        if (['alors', 'sinon', 'debut', 'fin', 'si', 'var', 'fonction', 'retourner', 'et', 'ou'].includes(t.kw)) {
          throw new ExError(`On attend une valeur ici, mais on trouve le mot-clé « ${t.v} ».`, c.line);
        }
        c.next();
        if (c.isOp('(')) {
          c.next();
          const args = [];
          if (!c.isOp(')')) {
            for (;;) {
              args.push(this.parseExpr(c));
              if (c.isOp(',')) { c.next(); continue; }
              break;
            }
          }
          c.expectOp(')', `Il manque « ) » pour fermer l'appel de ${t.v}.`);
          return { k: 'call', name: t.v, args, line: c.line };
        }
        return { k: 'id', name: t.v, line: c.line };
      }
      if (t.k === 'op' && t.v === '(') {
        const t1 = c.peek(1), t2 = c.peek(2);
        if (t1 && t1.k === 'id' && normType(t1.v) && t2 && t2.k === 'op' && t2.v === ')') {
          c.next(); c.next(); c.next();
          const e = this.parseUnary(c);
          return { k: 'cast', type: normType(t1.v), e, line: c.line };
        }
        c.next();
        const e = this.parseExpr(c);
        c.expectOp(')', 'Il manque une parenthèse fermante « ) ».');
        return e;
      }
      throw new ExError(`On attend une valeur ici, mais on trouve « ${tokText(t)} ».`, c.line);
    }

    /* --- statements --- */
    parseStatement() {
      const L = this.lines[this.p];
      this.p++;
      return this.parseStatementFrom(L);
    }

    parseStatementFrom(L) {
      const c = new Cur(L.toks, L.line);
      const first = c.peek();
      const kw = first.k === 'id' ? first.kw : null;
      let node;
      if (kw === 'var') {
        node = this.parseVarDecl(c, L);
      } else if (kw === 'si') {
        return this.parseIf(L, c);
      } else if (kw === 'retourner') {
        c.next();
        let e = null;
        if (!c.eof()) e = this.parseExpr(c);
        node = { k: 'ret', e, line: L.line };
      } else if (kw === 'sinon') {
        throw new ExError("« Sinon » doit suivre un bloc « Si … Alors » et avoir la même indentation que ce Si.", L.line);
      } else if (kw === 'alors') {
        throw new ExError("« Alors » se place à la fin de la ligne du Si, après la condition.", L.line);
      } else if (kw === 'debut' || kw === 'fin') {
        throw new ExError(`« ${first.v} » n'est pas attendu ici.`, L.line);
      } else if (kw === 'fonction') {
        throw new ExError("Une fonction se déclare au niveau principal, pas dans une autre fonction ni dans un Si.", L.line);
      } else if (first.k === 'id' && !['et', 'ou', 'non', 'vrai', 'faux'].includes(kw)) {
        const nxt = c.peek(1);
        if (nxt && nxt.k === 'op' && nxt.v === '←') {
          c.next(); c.next();
          if (c.eof()) throw new ExError("Il manque la valeur à droite de « ← ».", L.line);
          const e = this.parseExpr(c);
          node = { k: 'assign', name: first.v, e, line: L.line };
        } else if (nxt && nxt.k === 'op' && (nxt.v === '++' || nxt.v === '--')) {
          c.next(); c.next();
          node = { k: 'incr', name: first.v, d: nxt.v === '++' ? 1 : -1, line: L.line };
        } else if (nxt && nxt.k === 'op' && nxt.v === '(') {
          const e = this.parseExpr(c);
          node = { k: 'callstmt', e, line: L.line };
        } else if (nxt && nxt.k === 'op' && nxt.v === '=') {
          throw new ExError("Pour ranger une valeur dans une variable, utilise « ← » (ou « <- »). Le symbole « == » sert à comparer.", L.line);
        } else {
          throw new ExError(`Instruction non reconnue : « ${first.v} ». Une instruction est une affectation (x ← …), un appel (f(…)), un Si ou un Retourner.`, L.line);
        }
      } else {
        throw new ExError(`Instruction non reconnue : « ${tokText(first)} ».`, L.line);
      }
      if (!c.eof()) {
        throw new ExError(`Il y a quelque chose en trop à la fin de la ligne : « ${tokText(c.peek())} ».`, L.line);
      }
      return node;
    }

    parseVarDecl(c, L) {
      c.next();
      const names = [];
      for (;;) {
        const t = c.next();
        if (!t || t.k !== 'id') throw new ExError("Après « Var », écris le nom de la variable : Var nom : type", L.line);
        names.push(t.v);
        if (c.isOp(',')) { c.next(); continue; }
        break;
      }
      c.expectOp(':', 'Il manque « : » et le type : Var nom : type');
      const tt = c.next();
      const ty = tt && tt.k === 'id' ? normType(tt.v) : null;
      if (!ty) throw new ExError(`Type inconnu${tt ? ` : « ${tokText(tt)} »` : ''}. Les types sont : entier, réel, caractère, booléen.`, L.line);
      return { k: 'var', names, type: ty, line: L.line };
    }

    parseBlock(parent) {
      const out = [];
      while (this.p < this.lines.length) {
        const L = this.lines[this.p];
        if (L.indent <= parent) break;
        out.push(this.parseStatement());
      }
      return out;
    }

    parseIf(L, c) {
      c.next();
      if (c.eof() || c.isKw('alors')) throw new ExError("Il manque la condition entre « Si » et « Alors ».", L.line);
      const cond = this.parseExpr(c);
      if (!c.isKw('alors')) throw new ExError("Il manque « Alors » à la fin de la ligne du Si.", L.line);
      c.next();
      const node = { k: 'if', cond, then: [], else: null, line: L.line };
      if (!c.eof()) {
        const rest = c.t.slice(c.i);
        node.then = [this.parseStatementFrom({ indent: L.indent + 1, toks: rest, line: L.line })];
      } else {
        node.then = this.parseBlock(L.indent);
        if (!node.then.length) throw new ExError("Le bloc après « Alors » est vide : décale les instructions vers la droite (indentation) sous le Si.", L.line);
      }
      const nl = this.lines[this.p];
      if (nl && nl.indent === L.indent && nl.toks[0].k === 'id' && nl.toks[0].kw === 'sinon') {
        this.p++;
        const rest = nl.toks.slice(1);
        if (rest.length && rest[0].k === 'id' && rest[0].kw === 'si') {
          node.else = [this.parseIf({ indent: L.indent, toks: rest, line: nl.line }, new Cur(rest, nl.line))];
        } else if (rest.length) {
          node.else = [this.parseStatementFrom({ indent: L.indent + 1, toks: rest, line: nl.line })];
        } else {
          node.else = this.parseBlock(L.indent);
          if (!node.else.length) throw new ExError("Le bloc après « Sinon » est vide : décale les instructions vers la droite (indentation).", nl.line);
        }
      }
      return node;
    }

    parseFunction() {
      const L = this.lines[this.p];
      this.p++;
      const c = new Cur(L.toks, L.line);
      c.next();
      const nameTok = c.next();
      if (!nameTok || nameTok.k !== 'id') throw new ExError("Il manque le nom de la fonction après « Fonction ».", L.line);
      if (BUILTIN_KEYS.has(strip(nameTok.v))) throw new ExError(`« ${nameTok.v} » existe déjà (c'est une fonction fournie) : choisis un autre nom.`, L.line);
      if (this.fns.has(nameTok.v)) throw new ExError(`La fonction « ${nameTok.v} » est déjà définie.`, L.line);
      c.expectOp('(', "Il manque « ( » après le nom de la fonction.");
      const params = [];
      if (!c.isOp(')')) {
        for (;;) {
          let mode = 'E';
          const a = c.peek(), b = c.peek(1);
          if (a && a.k === 'id' && (a.kw === 'e' || a.kw === 'es') && b && b.k === 'id') {
            mode = a.kw === 'es' ? 'ES' : 'E';
            c.next();
          }
          const pn = c.next();
          if (!pn || pn.k !== 'id') throw new ExError("Un paramètre s'écrit : E nom : type", L.line);
          c.expectOp(':', `Il manque « : » et le type après le paramètre « ${pn.v} ».`);
          const tt = c.next();
          const ty = tt && tt.k === 'id' ? normType(tt.v) : null;
          if (!ty) throw new ExError(`Type inconnu pour le paramètre « ${pn.v} ». Types possibles : entier, réel, caractère, booléen.`, L.line);
          if (mode === 'ES') throw new ExError("Le mode de passage ES sera vu plus tard (cycle 3). Ici, utilise le mode E.", L.line);
          params.push({ name: pn.v, type: ty });
          if (c.isOp(',')) { c.next(); continue; }
          break;
        }
      }
      c.expectOp(')', "Il manque « ) » à la fin de la liste des paramètres.");
      let ret = null;
      if (c.isOp(':')) {
        c.next();
        const tt = c.next();
        ret = tt && tt.k === 'id' ? normType(tt.v) : null;
        if (!ret) throw new ExError("Type de retour inconnu. Types possibles : entier, réel, caractère, booléen.", L.line);
      }
      if (!c.eof()) throw new ExError(`Il y a quelque chose en trop dans la signature : « ${tokText(c.peek())} ».`, L.line);

      const body = [];
      for (;;) {
        const l = this.lines[this.p];
        if (!l) throw new ExError(`Il manque « Début » pour la fonction « ${nameTok.v} ».`, L.line);
        const t0 = l.toks[0];
        const k = t0.k === 'id' ? t0.kw : null;
        if (k === 'debut') {
          this.p++;
          if (l.toks.length > 1) throw new ExError("« Début » s'écrit seul sur sa ligne.", l.line);
          break;
        }
        if (k === 'var') { body.push(this.parseStatement()); continue; }
        throw new ExError(`Avant « Début », on ne trouve que des déclarations « Var ». Il manque « Début » pour la fonction « ${nameTok.v} ».`, l.line);
      }
      for (;;) {
        const l = this.lines[this.p];
        if (!l) throw new ExError(`Il manque « Fin » pour terminer la fonction « ${nameTok.v} ».`, L.line);
        const t0 = l.toks[0];
        if (t0.k === 'id' && t0.kw === 'fin') {
          this.p++;
          if (l.toks.length > 1) throw new ExError("« Fin » s'écrit seul sur sa ligne.", l.line);
          break;
        }
        if (t0.k === 'id' && t0.kw === 'fonction') {
          throw new ExError(`Il manque « Fin » pour terminer la fonction « ${nameTok.v} » avant d'en commencer une autre.`, l.line);
        }
        body.push(this.parseStatement());
      }
      this.fns.set(nameTok.v, { name: nameTok.v, params, ret, body, line: L.line });
    }
  }

  /* ---------- Valeurs ---------- */
  function fmtReal(x) {
    if (!isFinite(x)) return String(x);
    let s = String(parseFloat(x.toPrecision(12)));
    if (/^-?\d+$/.test(s)) s += '.0';
    return s;
  }
  function toText(v) {
    switch (v.t) {
      case 'entier': return String(v.v);
      case 'réel': return fmtReal(v.v);
      case 'booléen': return v.v ? 'vrai' : 'faux';
      default: return v.v;
    }
  }
  function describe(v) {
    if (v === undefined) return '(rien)';
    if (v.t === 'caractère') return `'${v.v}'`;
    return toText(v);
  }
  function fmtTrace(v) {
    if (v.t === 'booléen') return v.v ? 'Vrai' : 'Faux';
    if (v.t === 'caractère') return `'${v.v}'`;
    return toText(v);
  }
  function valuesEqual(a, b) {
    if (!a || !b) return a === b;
    const num = x => x.t === 'entier' || x.t === 'réel';
    if (num(a) && num(b)) return Math.abs(a.v - b.v) < 1e-9;
    return a.t === b.t && a.v === b.v;
  }

  /* ---------- Interpréteur ---------- */
  class Interp {
    constructor(prog, io, opts) {
      this.fns = prog.fns;
      this.io = io;
      this.steps = 0;
      this.depth = 0;
      this.traceOn = !!(opts && opts.trace);
      this.trace = null;
      this.traceVars = [];
    }

    tick(line) {
      if (this.io.aborted) throw new ExError('Exécution arrêtée.', line);
      if (++this.steps > 300000) throw new ExError("Le programme est trop long (récursion infinie ?).", line);
    }

    rec(s, fr) {
      if (!this.traceOn || fr.depth !== 0) return;
      this.trace.rows.push({
        line: s.line,
        vals: this.traceVars.map(n => {
          const b = fr.vars.get(n);
          return b && b.v !== undefined ? fmtTrace(b.v) : '/';
        })
      });
    }

    lookup(fr, name, line) {
      const b = fr.vars.get(name);
      if (!b) {
        const alt = [...fr.vars.keys()].find(k => k.toLowerCase() === name.toLowerCase());
        throw new ExError(alt
          ? `La variable « ${name} » n'existe pas. Voulais-tu écrire « ${alt} » ? (les majuscules comptent)`
          : `La variable « ${name} » n'est pas déclarée. Il faut écrire « Var ${name} : type » avant de l'utiliser.`, line);
      }
      return b;
    }

    coerce(type, val, line, ctx) {
      if (val.t === type) return val;
      if (type === 'réel' && val.t === 'entier') return { t: 'réel', v: val.v };
      if (type === 'entier' && val.t === 'réel') {
        throw new ExError(`Impossible de ranger un réel dans ${ctx} (type entier) : on perdrait la partie décimale. Utilise la conversion explicite : (entier)valeur.`, line);
      }
      throw new ExError(`${ctx[0].toUpperCase() + ctx.slice(1)} est de type ${type}, mais la valeur donnée est de type ${tname(val.t)}.`, line);
    }

    async execBlock(stmts, fr) {
      for (const s of stmts) {
        const r = await this.exec(s, fr);
        if (r) return r;
      }
      return null;
    }

    async exec(s, fr) {
      this.tick(s.line);
      switch (s.k) {
        case 'var': {
          for (const name of s.names) {
            if (fr.vars.has(name)) throw new ExError(`La variable « ${name} » est déjà déclarée.`, s.line);
            fr.vars.set(name, { type: s.type, v: undefined });
          }
          this.rec(s, fr);
          return null;
        }
        case 'assign': {
          const b = this.lookup(fr, s.name, s.line);
          if (b.param) throw new ExError(`Il est interdit de modifier un paramètre passé en entrée (E) : « ${s.name} ». Recopie-le d'abord dans une variable locale.`, s.line);
          const val = await this.val(s.e, fr);
          b.v = this.coerce(b.type, val, s.line, `la variable « ${s.name} »`);
          this.rec(s, fr);
          return null;
        }
        case 'incr': {
          const b = this.lookup(fr, s.name, s.line);
          if (b.param) throw new ExError(`Il est interdit de modifier un paramètre passé en entrée (E) : « ${s.name} ».`, s.line);
          if (b.v === undefined) throw new ExError(`La variable « ${s.name} » n'a pas encore de valeur : initialise-la avant de l'incrémenter.`, s.line);
          if (b.type !== 'entier' && b.type !== 'réel') throw new ExError(`On ne peut pas utiliser ++ ou -- sur une variable de type ${b.type}.`, s.line);
          b.v = { t: b.type, v: b.v.v + s.d };
          this.rec(s, fr);
          return null;
        }
        case 'callstmt': {
          await this.eval(s.e, fr);
          this.rec(s, fr);
          return null;
        }
        case 'ret': {
          let value;
          if (s.e) value = await this.val(s.e, fr);
          this.rec(s, fr);
          return { value };
        }
        case 'if': {
          const c = await this.val(s.cond, fr);
          if (c.t !== 'booléen') throw new ExError(`La condition d'un Si doit être un booléen (vrai ou faux), mais c'est un ${tname(c.t)}.`, s.line);
          this.rec(s, fr);
          const branch = c.v ? s.then : s.else;
          return branch ? this.execBlock(branch, fr) : null;
        }
        default:
          throw new ExError('Instruction inconnue.', s.line);
      }
    }

    async val(e, fr) {
      const v = await this.eval(e, fr);
      if (v === undefined) {
        throw new ExError(`La fonction « ${e.name} » ne retourne rien : on ne peut pas utiliser son résultat.`, e.line);
      }
      return v;
    }

    async eval(e, fr) {
      switch (e.k) {
        case 'num': return { t: e.t, v: e.v };
        case 'str': return { t: 'chaîne', v: e.v };
        case 'chr': return { t: 'caractère', v: e.v };
        case 'bool': return { t: 'booléen', v: e.v };
        case 'id': {
          const b = this.lookup(fr, e.name, e.line);
          if (b.v === undefined) throw new ExError(`La variable « ${e.name} » n'a pas encore de valeur : il faut l'initialiser (${e.name} ← …) avant de l'utiliser.`, e.line);
          return b.v;
        }
        case 'un': {
          const v = await this.val(e.e, fr);
          if (e.op === 'neg') {
            if (v.t !== 'entier' && v.t !== 'réel') throw new ExError(`Le signe « - » ne s'applique qu'à un nombre, pas à un ${tname(v.t)}.`, e.line);
            return { t: v.t, v: -v.v };
          }
          if (v.t !== 'booléen') throw new ExError(`« non » s'applique à un booléen, pas à un ${tname(v.t)}.`, e.line);
          return { t: 'booléen', v: !v.v };
        }
        case 'bin': return this.binary(e, fr);
        case 'cast': return this.cast(e, fr);
        case 'call': return this.call(e, fr);
        default: throw new ExError('Expression inconnue.', e.line);
      }
    }

    async binary(e, fr) {
      if (e.op === 'et' || e.op === 'ou') {
        const a = await this.val(e.l, fr);
        if (a.t !== 'booléen') throw new ExError(`« ${e.op} » s'applique à des booléens, pas à un ${tname(a.t)}.`, e.line);
        if (e.op === 'et' && !a.v) return { t: 'booléen', v: false };
        if (e.op === 'ou' && a.v) return { t: 'booléen', v: true };
        const b = await this.val(e.r, fr);
        if (b.t !== 'booléen') throw new ExError(`« ${e.op} » s'applique à des booléens, pas à un ${tname(b.t)}.`, e.line);
        return { t: 'booléen', v: b.v };
      }
      const a = await this.val(e.l, fr);
      const b = await this.val(e.r, fr);
      if (['==', '!=', '<', '<=', '>', '>='].includes(e.op)) return this.compare(e.op, a, b, e.line);
      return this.arith(e.op, a, b, e.line);
    }

    arith(op, a, b, line) {
      if (op === '+' && (a.t === 'chaîne' || b.t === 'chaîne')) return { t: 'chaîne', v: toText(a) + toText(b) };
      const num = x => x.t === 'entier' || x.t === 'réel';
      if (!num(a) || !num(b)) {
        throw new ExError(`L'opération « ${op} » n'est pas possible entre un ${tname(a.t)} et un ${tname(b.t)}.` +
          (op === '+' ? ' Pour assembler du texte, commence par un texte entre guillemets : "a = " + valeur.' : ''), line);
      }
      if (a.t === 'entier' && b.t === 'entier') {
        switch (op) {
          case '+': return { t: 'entier', v: a.v + b.v };
          case '-': return { t: 'entier', v: a.v - b.v };
          case '*': return { t: 'entier', v: a.v * b.v };
          case '/':
            if (b.v === 0) throw new ExError('Division par zéro.', line);
            return { t: 'entier', v: Math.trunc(a.v / b.v) };
          case '%':
            if (b.v === 0) throw new ExError('Modulo par zéro.', line);
            return { t: 'entier', v: a.v % b.v };
        }
      }
      switch (op) {
        case '+': return { t: 'réel', v: a.v + b.v };
        case '-': return { t: 'réel', v: a.v - b.v };
        case '*': return { t: 'réel', v: a.v * b.v };
        case '/':
          if (b.v === 0) throw new ExError('Division par zéro.', line);
          return { t: 'réel', v: a.v / b.v };
        case '%':
          if (b.v === 0) throw new ExError('Modulo par zéro.', line);
          return { t: 'réel', v: a.v % b.v };
      }
      throw new ExError('Opération inconnue.', line);
    }

    compare(op, a, b, line) {
      const isNum = x => x.t === 'entier' || x.t === 'réel';
      let ca, cb, tol = false;
      if (isNum(a) && isNum(b)) {
        ca = a.v; cb = b.v;
        tol = a.t === 'réel' || b.t === 'réel';
      } else if (a.t === b.t && ['caractère', 'booléen', 'chaîne'].includes(a.t)) {
        if (a.t === 'booléen' && op !== '==' && op !== '!=') throw new ExError("Les booléens se comparent seulement avec « == » et « != ».", line);
        ca = a.t === 'caractère' ? a.v.codePointAt(0) : a.t === 'booléen' ? (a.v ? 1 : 0) : a.v;
        cb = b.t === 'caractère' ? b.v.codePointAt(0) : b.t === 'booléen' ? (b.v ? 1 : 0) : b.v;
      } else {
        throw new ExError(`On ne peut pas comparer un ${tname(a.t)} avec un ${tname(b.t)}.`, line);
      }
      const eq = tol ? Math.abs(ca - cb) < 1e-9 : ca === cb;
      let r;
      switch (op) {
        case '==': r = eq; break;
        case '!=': r = !eq; break;
        case '<': r = ca < cb && !eq; break;
        case '<=': r = ca < cb || eq; break;
        case '>': r = ca > cb && !eq; break;
        case '>=': r = ca > cb || eq; break;
      }
      return { t: 'booléen', v: r };
    }

    async cast(e, fr) {
      const v = await this.val(e.e, fr);
      const num = v.t === 'entier' || v.t === 'réel';
      switch (e.type) {
        case 'entier':
          if (v.t === 'entier') return v;
          if (v.t === 'réel') return { t: 'entier', v: Math.trunc(v.v) };
          if (v.t === 'caractère') return { t: 'entier', v: v.v.codePointAt(0) };
          break;
        case 'réel':
          if (num) return { t: 'réel', v: v.v };
          break;
        case 'caractère':
          if (v.t === 'caractère') return v;
          if (v.t === 'entier') return { t: 'caractère', v: String.fromCodePoint(v.v) };
          break;
        case 'booléen':
          if (v.t === 'booléen') return v;
          break;
      }
      throw new ExError(`Impossible de convertir un ${tname(v.t)} en ${e.type}.`, e.line);
    }

    async call(e, fr) {
      const args = [];
      for (const a of e.args) args.push(await this.val(a, fr));
      const key = strip(e.name);
      if (BUILTIN_KEYS.has(key)) return this.builtin(key, args, e);
      const fn = this.fns.get(e.name);
      if (!fn) {
        const alt = [...this.fns.keys()].find(k => k.toLowerCase() === e.name.toLowerCase());
        throw new ExError(alt
          ? `La fonction « ${e.name} » n'existe pas. Voulais-tu écrire « ${alt} » ? (les majuscules comptent)`
          : `La fonction « ${e.name} » n'est pas définie.`, e.line);
      }
      return this.callUser(fn, args, e.line);
    }

    async callUser(fn, args, line) {
      if (this.depth >= 150) throw new ExError('Trop d’appels de fonctions imbriqués (récursion infinie ?).', line);
      if (args.length !== fn.params.length) {
        throw new ExError(`La fonction « ${fn.name} » attend ${fn.params.length} argument${fn.params.length > 1 ? 's' : ''}, mais en reçoit ${args.length}.`, line);
      }
      this.depth++;
      const fr = { vars: new Map(), depth: this.depth };
      try {
        fn.params.forEach((p, i) => {
          fr.vars.set(p.name, { type: p.type, v: this.coerce(p.type, args[i], line, `le paramètre « ${p.name} » de ${fn.name}`), param: true });
        });
        const r = await this.execBlock(fn.body, fr);
        if (r && r.value !== undefined) {
          if (!fn.ret) throw new ExError(`La fonction « ${fn.name} » ne retourne rien (pas de type de retour dans sa signature), mais elle exécute « Retourner valeur ».`, line);
          return this.coerce(fn.ret, r.value, line, `le résultat de ${fn.name}`);
        }
        if (fn.ret) {
          throw new ExError(`La fonction « ${fn.name} » doit retourner un ${fn.ret}, mais aucun « Retourner valeur » n'a été exécuté.`, line);
        }
        return undefined;
      } finally {
        this.depth--;
      }
    }

    need(name, args, types, line) {
      if (args.length !== types.length) {
        throw new ExError(`${name} attend ${types.length} argument${types.length > 1 ? 's' : ''}, mais en reçoit ${args.length}.`, line);
      }
      args.forEach((a, i) => {
        const ok = a.t === types[i] || (types[i] === 'réel' && a.t === 'entier');
        if (!ok) throw new ExError(`${name} : l'argument ${i + 1} doit être de type ${types[i]}, pas ${tname(a.t)}.`, line);
      });
    }

    async builtin(key, args, e) {
      const line = e.line;
      switch (key) {
        case 'ecrire':
          if (args.length !== 1) throw new ExError('ecrire attend exactement 1 argument : ecrire("a = " + a).', line);
          this.io.write(toText(args[0]));
          return undefined;
        case 'ecrireligne':
          if (args.length > 1) throw new ExError('ecrireLigne attend 0 ou 1 argument.', line);
          this.io.write((args.length ? toText(args[0]) : '') + '\n');
          return undefined;
        case 'lireentier':
        case 'lirereel':
        case 'lirecaractere': {
          if (args.length) throw new ExError(`${e.name} n'a pas d'argument : ${e.name}().`, line);
          for (;;) {
            const raw = String(await this.io.read(key === 'lireentier' ? 'entier' : key === 'lirereel' ? 'réel' : 'caractère')).trim();
            if (key === 'lireentier') {
              if (/^[+-]?\d+$/.test(raw)) return { t: 'entier', v: parseInt(raw, 10) };
              this.io.write('(saisie invalide : un entier est attendu)\n');
            } else if (key === 'lirereel') {
              const s = raw.replace(',', '.');
              if (/^[+-]?\d+(\.\d+)?$/.test(s)) return { t: 'réel', v: parseFloat(s) };
              this.io.write('(saisie invalide : un réel est attendu)\n');
            } else {
              const ch = [...raw][0];
              if (ch !== undefined) return { t: 'caractère', v: ch };
              this.io.write('(saisie invalide : tape un caractère)\n');
            }
          }
        }
        case 'affichecar': {
          this.need('afficheCar', args, ['caractère', 'entier'], line);
          if (args[1].v < 0) throw new ExError('afficheCar : le nombre de répétitions ne peut pas être négatif.', line);
          this.io.write(args[0].v.repeat(args[1].v));
          return undefined;
        }
        case 'afficheligne': {
          this.need('afficheLigne', args, ['caractère', 'entier', 'entier'], line);
          if (args[1].v < 1) throw new ExError('afficheLigne : la position de départ (min) commence à 1.', line);
          if (args[2].v < 0) throw new ExError('afficheLigne : la taille ne peut pas être négative.', line);
          this.io.write(' '.repeat(args[1].v - 1) + args[0].v.repeat(args[2].v) + '\n');
          return undefined;
        }
      }
      throw new ExError('Fonction fournie inconnue.', line);
    }
  }

  /* ---------- API ---------- */
  function compile(src) {
    const p = new Parser(splitLines(src));
    p.parseProgram();
    return { fns: p.fns, top: p.top, src };
  }

  function topVars(top) {
    const out = [];
    top.forEach(s => { if (s.k === 'var') s.names.forEach(n => out.push(n)); });
    return out;
  }

  async function run(prog, io, opts) {
    const it = new Interp(prog, io, opts || {});
    if (it.traceOn) {
      it.traceVars = topVars(prog.top);
      it.trace = { vars: it.traceVars, rows: [] };
    }
    await it.execBlock(prog.top, { vars: new Map(), depth: 0 });
    return { trace: it.trace };
  }

  const NO_IO = {
    write() {},
    read() { return Promise.reject(new ExError("Cette expression ne peut pas lire au clavier.")); }
  };

  async function evalExpression(text) {
    const lines = splitLines(text);
    const toks = lines.flatMap(l => l.toks);
    const parser = new Parser([]);
    const cur = new Cur(toks, 1);
    const expr = parser.parseExpr(cur);
    if (!cur.eof()) throw new ExError(`Il y a quelque chose en trop : « ${tokText(cur.peek())} ».`, 1);
    const it = new Interp({ fns: new Map() }, NO_IO, {});
    return it.val(expr, { vars: new Map(), depth: 0 });
  }

  async function call(prog, name, argLiterals, io) {
    const fn = prog.fns.get(name);
    if (!fn) throw new ExError(`La fonction « ${name} » n'est pas définie dans ton code.`);
    const args = [];
    for (const lit of argLiterals) args.push(await evalExpression(lit));
    const it = new Interp(prog, io, {});
    return it.callUser(fn, args, fn.line);
  }

  function queueIO(lines) {
    const q = (lines || []).slice();
    return {
      out: '',
      aborted: false,
      write(s) { this.out += s; },
      read() {
        if (!q.length) return Promise.reject(new ExError("Le programme attend une saisie au clavier, mais aucune n'est prévue ici."));
        return Promise.resolve(q.shift());
      }
    };
  }

  async function traceProgram(src, stdin) {
    const prog = compile(src);
    const io = queueIO(stdin);
    const r = await run(prog, io, { trace: true });
    return r.trace;
  }

  return { compile, run, call, evalExpression, queueIO, traceProgram, ExError, toText, describe, valuesEqual, fmtTrace, strip };
})();

/* Générateur JS de la maison (aperçu interactif), avec les extensions */
function houseLines(o) {
  const n = o.n, k = Math.min(Math.max(o.k, 1), n);
  const W = 5 * n + 1;
  const floors = o.floors || 1;
  const toit = o.toit, mur = o.mur, volet = o.volet;
  const rep = (c, m) => c.repeat(Math.max(0, m));
  const roof = [
    ' '.repeat(2) + rep(toit, W - 4),
    ' '.repeat(1) + rep(toit, W - 2),
    rep(toit, W)
  ];
  const wall = rep(mur, W);
  const win = mur + rep(volet + '  ' + volet + mur, n);
  const left = 5 * (k - 1) + 1;
  const door = rep(mur, left) + '    ' + rep(mur, W - left - 4);
  let rows = [];
  rows.push(...roof);
  for (let f = 0; f < floors; f++) rows.push(wall, win, win);
  rows.push(wall);
  if (floors > 1) { /* le rez-de-chaussée garde la porte */ }
  rows.push(door, door);
  if (o.chimney) {
    const r = Math.min(Math.max(o.chimney.row, 1), 3) - 1; // 0 = sommet du toit
    const lo = 3 - r, hi = W - 2 + r; // étendue du toit sur cette rangée (colonnes à partir de 1)
    const col = Math.min(Math.max(o.chimney.col, lo + 1), hi - 1) - 1;
    const pad = (t, len) => t + ' '.repeat(Math.max(0, len - t.length));
    const setc = (t, i, c) => t.slice(0, i) + c + t.slice(i + 1);
    const all = [' '.repeat(W), ' '.repeat(W)].concat(rows.map(t => pad(t, W)));
    all[2 + r] = setc(all[2 + r], col, 'M');
    all[r] = setc(all[r], col, '~');
    all[r + 1] = setc(all[r + 1], col, '~');
    rows = all;
  }
  return rows.map(s => s.replace(/\s+$/, ''));
}

/* runner.js */
/* Exécution des exercices : tests de code, questions « que vaut ? », traces */
function createRunner(Exalgo, REF, REF_ORDER) {
  const normOut = s => String(s).split('\n').map(l => l.replace(/\s+$/, '')).join('\n').replace(/\n+$/, '');

  async function buildProgram(def, userCode) {
    const user = Exalgo.compile(userCode);
    if (!def.env) return user;
    const missing = REF_ORDER.filter(n => !user.fns.has(n)).map(n => REF[n]).join('\n\n');
    return missing ? Exalgo.compile(userCode + '\n\n' + missing) : user;
  }

  function labelOf(t) {
    const base = t.script ? 'Programme complet' : `${t.call}(${(t.args || []).join(', ')})`;
    return t.stdin && t.stdin.length ? `${base}, saisie : ${t.stdin.join(' puis ')}` : base;
  }

  async function runOne(prog, t) {
    const io = Exalgo.queueIO(t.stdin || []);
    const label = labelOf(t);
    let value, error;
    try {
      if (t.script) await Exalgo.run(prog, io);
      else value = await Exalgo.call(prog, t.call, t.args || [], io);
    } catch (e) {
      error = e;
    }
    if (error) {
      const where = error.line ? `ligne ${error.line} : ` : '';
      return { ok: false, label, detail: where + error.message };
    }
    const problems = [];
    if ('expect' in t) {
      const exp = await Exalgo.evalExpression(t.expect);
      if (!Exalgo.valuesEqual(value, exp)) problems.push(`résultat attendu : ${Exalgo.describe(exp)}, obtenu : ${Exalgo.describe(value)}`);
    }
    if ('out' in t && normOut(io.out) !== normOut(t.out)) {
      problems.push(`affichage attendu :\n${t.out || '(rien)'}\naffichage obtenu :\n${io.out || '(rien)'}`);
    }
    (t.outHas || []).forEach(s => {
      if (!io.out.toLowerCase().includes(s.toLowerCase())) problems.push(`l'affichage devrait contenir « ${s} »`);
    });
    (t.outNot || []).forEach(s => {
      if (io.out.toLowerCase().includes(s.toLowerCase())) problems.push(`l'affichage ne devrait pas contenir « ${s} »`);
    });
    if (t.outNonEmpty && !io.out.trim()) problems.push("rien n'est affiché : la fonction doit afficher un message");
    return { ok: problems.length === 0, label, detail: problems.join(' ; ') };
  }

  async function runCodeExercise(def, userCode) {
    let prog;
    try {
      prog = await buildProgram(def, userCode);
    } catch (e) {
      return { fatal: e };
    }
    const results = [];
    for (const t of def.tests) results.push(await runOne(prog, t));
    return { results };
  }

  /* --- « Que vaut ? » --- */
  async function checkValue(def, answer) {
    const exp = await Exalgo.evalExpression(def.expr);
    const a = String(answer).trim().toLowerCase();
    const shown = Exalgo.describe(exp);
    if (def.kind === 'booléen') {
      return { ok: (a === 'vrai') === exp.v && (a === 'vrai' || a === 'faux'), expected: shown };
    }
    if (def.kind === 'caractère') {
      const ch = a.replace(/^'(.*)'$/, '$1');
      return { ok: ch === String(exp.v).toLowerCase(), expected: shown };
    }
    const n = parseFloat(a.replace(',', '.'));
    if (!/^[+-]?\d+([.,]\d+)?$/.test(a)) return { ok: false, expected: shown, format: true };
    if (def.kind === 'entier' && /[.,]/.test(a)) return { ok: false, expected: shown, format: 'entier' };
    return { ok: Math.abs(n - exp.v) < 1e-9, expected: shown };
  }

  /* --- Traces --- */
  const normCell = s => {
    let x = String(s).trim().toLowerCase();
    if (x === '' ) return '';
    x = x.replace(/^'(.*)'$/, '$1');
    if (/^[+-]?\d+([.,]\d+)?$/.test(x)) return String(parseFloat(x.replace(',', '.')));
    return x;
  };
  async function expectedTrace(program) {
    return Exalgo.traceProgram(program, []);
  }
  function checkTrace(expected, rows) {
    const out = [];
    const n = Math.max(expected.rows.length, rows.length);
    let allOk = rows.length === expected.rows.length;
    for (let i = 0; i < n; i++) {
      const e = expected.rows[i], u = rows[i];
      if (!e) { out.push({ extra: true }); allOk = false; continue; }
      if (!u) { out.push({ missing: true }); allOk = false; continue; }
      const lineOk = String(u.line).trim() === String(e.line);
      const cells = e.vals.map((v, j) => {
        const ue = normCell(u.vals[j] === undefined ? '' : u.vals[j]);
        const ee = normCell(v);
        return ue !== '' && ue === ee;
      });
      if (!lineOk || cells.some(c => !c)) allOk = false;
      out.push({ lineOk, cells });
    }
    return { rows: out, ok: allOk };
  }

  return { runCodeExercise, checkValue, expectedTrace, checkTrace, normOut };
}
if (typeof module !== 'undefined' && module.exports) module.exports = createRunner;

/* ===== Coloration syntaxique ===== */
const EX_KW = new Set(['var', 'fonction', 'debut', 'fin', 'si', 'alors', 'sinon', 'retourner', 'et', 'ou', 'non', 'vrai', 'faux']);
const EX_TYPES = new Set(['entier', 'entiers', 'reel', 'reels', 'caractere', 'caracteres', 'booleen', 'booleens']);
const EX_BI = new Set(['ecrire', 'ecrireligne', 'lireentier', 'lirereel', 'lirecaractere', 'affichecar', 'afficheligne']);
function highlight(code, kw, types, builtins, opRe) {
  const re = new RegExp('(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)|("(?:[^"\\\\\\n]|\\\\.)*")|(\'(?:\\\\.|[^\'\\\\\\n])\')|(\\b\\d+(?:\\.\\d+)?\\b)|([A-Za-zÀ-ÿ_][A-Za-zÀ-ÿ0-9_]*)|(' + opRe + ')', 'g');
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const t = m[0];
    let cls = '';
    if (m[1]) cls = 'c-com';
    else if (m[2] || m[3]) cls = 'c-str';
    else if (m[4]) cls = 'c-num';
    else if (m[5]) {
      const k = Exalgo.strip(t);
      const call = code[m.index + t.length] === '(';
      if (kw.has(k) || ((t === 'E' || t === 'ES') && kw === EX_KW)) cls = 'c-kw';
      else if (types.has(k)) cls = 'c-type';
      else if (builtins.has(k)) cls = 'c-bi';
      else if (call) cls = 'c-fn';
    } else cls = 'c-op';
    out += cls ? `<span class="${cls}">${esc(t)}</span>` : esc(t);
    last = m.index + t.length;
  }
  return out + esc(code.slice(last));
}
const hlEx = code => highlight(code, EX_KW, EX_TYPES, EX_BI, '←|<-|!=|==|<=|>=|\\+\\+|--');
const JV_KW = new Set(['public', 'class', 'static', 'void', 'if', 'else', 'return', 'new', 'true', 'false', 'for', 'import', 'final']);
const JV_TYPES = new Set(['int', 'double', 'char', 'boolean', 'string', 'scanner']);

function termHTML() {

  <div class="term-out" role="log" aria-live="polite" tabindex="0"></div>

class Term {
  constructor(root) {
    this.root = root;
    this.out = $('.term-out', root);
    this.form = $('.term-in', root);
    this.input = $('.term-input', root);
    this.status = $('.term-status', root);
    this.stopBtn = $('[data-act="term-stop"]', root);
    this.pending = null;
    this.aborted = false;
    this.form.addEventListener('submit', e => { e.preventDefault(); this.submit(); });
  }
  clear() { this.out.textContent = ''; this.setStatus('', ''); }
  setStatus(text, cls) { this.status.textContent = text; this.status.className = 'term-status ' + (cls || ''); }
  write(text, cls) {
    const s = document.createElement('span');
    if (cls) s.className = cls;
    s.textContent = text;
    this.out.appendChild(s);
    this.out.scrollTop = this.out.scrollHeight;
  }
  read(kind) {
    return new Promise((res, rej) => {
      this.pending = { res, rej };
      this.form.hidden = false;
      this.input.value = '';
      this.input.inputMode = kind === 'entier' ? 'numeric' : kind === 'réel' ? 'decimal' : 'text';
      this.input.placeholder = ({ entier: 'un entier', 'réel': 'un nombre réel', 'caractère': 'un caractère' })[kind] || '';
      this.setStatus('En attente de ta saisie…', 'wait');
      this.input.focus();
    });
  }
  submit() {
    if (!this.pending) return;
    const v = this.input.value;
    this.write(v + '\n', 't-echo');
    this.form.hidden = true;
    const p = this.pending;
    this.pending = null;
    this.setStatus('Exécution…', 'run');
    p.res(v);
  }
  abort() {
    this.aborted = true;
    if (this.pending) {
      this.form.hidden = true;
      const p = this.pending;
      this.pending = null;
      p.rej(new Exalgo.ExError('Exécution arrêtée.'));
    }
  }
  io() {
    const self = this;
    return { write: s => self.write(s), read: k => self.read(k), get aborted() { return self.aborted; } };
  }
  async run(code, opts) {
    opts = opts || {};
    this.aborted = false;
    this.clear();
    this.stopBtn.hidden = false;
    this.setStatus('Exécution…', 'run');
    let result = null;
    try {
      const prog = Exalgo.compile(code);
      result = await Exalgo.run(prog, this.io(), { trace: opts.trace });
      this.setStatus('Terminé.', 'ok');
    } catch (e) {
      if (e instanceof Exalgo.ExError) {
        const where = e.line ? `Erreur ligne ${e.line} : ` : 'Erreur : ';
        this.write((this.out.textContent && !this.out.textContent.endsWith('\n') ? '\n' : '') + where + e.message + '\n', 't-err');
        this.setStatus(e.message === 'Exécution arrêtée.' ? 'Arrêté.' : 'Erreur.', 'err');
        if (opts.onError) opts.onError(e);
      } else {
        this.write('Erreur interne : ' + e.message + '\n', 't-err');
        this.setStatus('Erreur.', 'err');
      }
    }
    this.form.hidden = true;
    this.stopBtn.hidden = true;
    return result;
  }
}

</section>`;
    }
    case 'trace': {
      const vars = [];
      def.program.split('\n').forEach(l => {
        const m = l.match(/^\s*Var\s+([^:]+):/i);
        if (m) m[1].split(',').forEach(v => vars.push(v.trim()));
      });
      return `<section class="ex ex-trace${done ? ' is-done' : ''}" data-ex="${id}" data-vars="${esc(vars.join(','))}">
  ${head('Trace à remplir')}
  <h4 class="ex-title">${esc(def.title)}</h4>
  <p class="ex-q">${esc(def.prompt)}</p>
  <div class="trace-layout">
    <pre class="numbered prog"><code>${numberLines(hlEx(def.program))}</code></pre>
    <div class="trace-wrap"><table class="trace in"><thead><tr><th scope="col">Ligne</th>${vars.map(v => `<th scope="col"><code>${esc(v)}</code></th>`).join('')}</tr></thead><tbody></tbody></table></div>
  </div>
  <div class="ex-actions">
    <button type="button" class="btn ghost" data-act="trace-add">+ Ajouter une ligne</button>
    <button type="button" class="btn ghost" data-act="trace-del">− Retirer</button>
    <button type="button" class="btn" data-act="trace-check">Vérifier</button>
    <button type="button" class="btn ghost" data-act="trace-show">Voir la trace corrigée</button>
  </div>
  <p class="ex-fb" role="status"></p>
  <div class="trace-sol" hidden></div>
</section>`;
    }
    case 'testtable':
      return `<section class="ex ex-tt${done ? ' is-done' : ''}" data-ex="${id}">
  ${head('Proposer des tests')}
  <p class="ex-q">Pour chaque valeur de <code>${esc(def.param)}</code>, écris le résultat que doit retourner <code>${esc(def.fn)}()</code>.</p>
  <div class="trace-wrap"><table class="trace in">
    <thead><tr><th scope="col"><code>${esc(def.param)}</code></th><th scope="col">Résultat attendu</th></tr></thead>
    <tbody>${def.inputs.map((v, i) => `<tr><td><code>${esc(v)}</code></td><td><input class="t-val" data-i="${i}" inputmode="numeric" autocomplete="off" aria-label="Résultat pour ${esc(def.param)} = ${esc(v)}"></td></tr>`).join('')}</tbody>
  </table></div>
  <div class="ex-actions"><button type="button" class="btn" data-act="tt-check">Vérifier</button></div>
  <p class="ex-fb" role="status"></p>
</section>`;
  }
  return '';
}

function markDone(id) {
  if (!Store.data.done[id]) {
    Store.data.done[id] = 1;
    Store.save();
  }
  const sec = $(`[data-ex="${id}"]`);
  if (sec) { sec.classList.add('is-done'); const b = $('.ex-badge', sec); if (b) b.hidden = false; }
  if (window.updateProgress) window.updateProgress();
}

function setFb(sec, text, cls) {
  const fb = $('.ex-fb', sec);

}

const handlers = {
  'cb-tab'(b) {
    setBlockLang(b.closest('.cb'), b.dataset.lang);
  },
  async 'cb-run'(b) {
    const fig = b.closest('.cb');
    const o = CODEREG[fig.dataset.cb];
    const term = mountTerm($('.cb-term', fig));
    await term.run(o.ex + (o.runExtra || ''));
  },
  'cb-open'(b) {
    const o = CODEREG[b.closest('.cb').dataset.cb];
    window.pendingAtelier = o.ex + (o.runExtra || '');
    location.hash = '#atelier';
  },
  async 'cb-copy'(b) {
    const fig = b.closest('.cb');
    const o = CODEREG[fig.dataset.cb];
    const visible = $('.cb-code:not([hidden])', fig);
    const text = visible && visible.dataset.lang === 'java' ? o.java : o.ex;
    const old = b.textContent;
    try {
      await navigator.clipboard.writeText(text);
      b.textContent = 'Copié ✓';
    } catch (e) {
      const r = document.createRange();
      r.selectNodeContents(visible);
      const sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
      b.textContent = 'Sélectionné';
    }
    setTimeout(() => { b.textContent = old; }, 1600);
  },
  'term-stop'() { /* géré par le terminal */ },
  'ed-ins'(b) {
    const ed = b.closest('.ex, .atelier') ? $('.ta', b.closest('.ex, .atelier')) : null;
    if (ed) editorInsert(ed, b.dataset.ins);
  },
  'qcm'(b) {
    const sec = b.closest('.ex');
    if (sec.classList.contains('is-done') && $('.choice.ok', sec)) return;
    const def = EXERCISES[sec.dataset.ex];
    const i = +b.dataset.i;
    if (i === def.answer) {
      b.classList.add('ok');
      $$('.choice', sec).forEach(c => { c.disabled = true; });
      setFb(sec, 'Exact. ' + def.why, 'ok');
      markDone(sec.dataset.ex);
    } else {
      b.classList.add('ko');
      b.disabled = true;
      setFb(sec, "Ce n'est pas celle-là. Relis le cours et essaie une autre réponse.", 'ko');
    }
  },
  async 'val-bool'(b) {
    const sec = b.closest('.ex');
    const id = sec.dataset.ex, def = EXERCISES[id];
    const r = await Runner.checkValue(def, b.dataset.v);
    if (r.ok) {
      b.classList.add('ok');
      $$('.choice', sec).forEach(c => { c.disabled = true; });
      setFb(sec, 'Exact. ' + def.why, 'ok');
      markDone(id);
    } else {
      b.classList.add('ko');
      b.disabled = true;
      setFb(sec, 'Pas tout à fait. Réfléchis encore, ou refais la table de vérité.', 'ko');
    }
  },
  'code-hint'(b) {
    const h = $('.hint', b.closest('.ex'));
    h.hidden = !h.hidden;
  },
  'code-sol'(b) {
    const s = $('.sol', b.closest('.ex'));
    s.hidden = !s.hidden;
    b.textContent = s.hidden ? 'Solution' : 'Masquer la solution';
    if (!s.hidden) applyGlobalLang(s);
  },
  'code-reset'(b) {
    const sec = b.closest('.ex');
    const def = EXERCISES[sec.dataset.ex];
    const ta = $('.ta', sec);
    ta.value = def.starter;
    ta.dispatchEvent(new Event('input', { bubbles: true }));
    delete Store.data.code[sec.dataset.ex];
    Store.save();
    $('.tests-out', sec).innerHTML = '';
  },
  async 'code-run'(b) {
    const sec = b.closest('.ex');
    const id = sec.dataset.ex, def = EXERCISES[id];
    const ed = $('.editor', sec);
    const out = $('.tests-out', sec);
    out.innerHTML = '<p class="muted">Vérification…</p>';
    const r = await Runner.runCodeExercise(def, $('.ta', ed).value);
    if (r.fatal) {
      editorMark(ed, r.fatal.line);
      out.innerHTML = `<p class="res-err"><strong>${r.fatal.line ? 'Erreur ligne ' + r.fatal.line : 'Erreur'}</strong> : ${esc(r.fatal.message)}</p>`;
      return;
    }
    const okCount = r.results.filter(x => x.ok).length;
    const all = okCount === r.results.length;
    out.innerHTML = `<p class="res-sum ${all ? 'ok' : 'ko'}">${all ? 'Bravo : ' : ''}${okCount} test${okCount > 1 ? 's' : ''} réussi${okCount > 1 ? 's' : ''} sur ${r.results.length}</p>
<ul class="res-list">${r.results.map(x => `<li class="${x.ok ? 'ok' : 'ko'}"><span class="res-mark" aria-hidden="true">${x.ok ? '✓' : '✗'}</span><div><code>${esc(x.label)}</code>${x.detail ? `<pre class="res-detail">${esc(x.detail)}</pre>` : ''}</div></li>`).join('')}</ul>`;
    if (all) markDone(id);
  },
  'trace-add'(b) { traceAddRow(b.closest('.ex')); },
  'trace-del'(b) {
    const tb = $('tbody', b.closest('.ex'));
    if (tb.rows.length > 1) tb.deleteRow(-1);
  },
  async 'trace-check'(b) {
    const sec = b.closest('.ex');
    const id = sec.dataset.ex, def = EXERCISES[id];
    const exp = await Runner.expectedTrace(def.program);
    const rows = $$('tbody tr', sec).map(tr => ({ line: $('.t-line', tr).value, vals: $$('.t-val', tr).map(i => i.value) }));
    const filled = rows.filter(r => r.line.trim() || r.vals.some(v => v.trim()));
    const res = Runner.checkTrace(exp, filled);
    $$('tbody tr', sec).forEach(tr => tr.classList.remove('row-extra'));
    const trs = $$('tbody tr', sec).filter(tr => $('.t-line', tr).value.trim() || $$('.t-val', tr).some(i => i.value.trim()));
    trs.forEach((tr, i) => {
      const r = res.rows[i];
      const inputs = [$('.t-line', tr), ...$$('.t-val', tr)];
      inputs.forEach(x => x.classList.remove('ok', 'ko'));
      if (!r || r.extra) { inputs.forEach(x => x.classList.add('ko')); return; }
      inputs[0].classList.add(r.lineOk ? 'ok' : 'ko');
      r.cells.forEach((c, j) => inputs[j + 1].classList.add(c ? 'ok' : 'ko'));
    });
    if (res.ok) {
      setFb(sec, 'Trace exacte. Une ligne par instruction exécutée, avec les bonnes valeurs.', 'ok');
      markDone(id);
    } else if (filled.length < exp.rows.length) {
      setFb(sec, `Il manque des lignes : une instruction exécutée n'est pas encore notée (vérifie aussi les lignes marquées en rouge).`, 'ko');
    } else if (filled.length > exp.rows.length) {
      setFb(sec, 'Il y a trop de lignes : seules les lignes réellement exécutées se notent.', 'ko');
    } else {
      setFb(sec, "Certaines cases sont fausses (en rouge). Pour une variable sans valeur, écris /.", 'ko');
    }
  },
  async 'trace-show'(b) {
    const sec = b.closest('.ex');
    const def = EXERCISES[sec.dataset.ex];
    const exp = await Runner.expectedTrace(def.program);
    const box = $('.trace-sol', sec);
    box.hidden = !box.hidden;
    if (!box.hidden) box.innerHTML = traceTableHTML(exp, exp.rows.length);
  },
  async 'tt-check'(b) {
    const sec = b.closest('.ex');
    const id = sec.dataset.ex, def = EXERCISES[id];
    const prog = Exalgo.compile(REF[def.fn]);
    let all = true;
    for (const inp of $$('.t-val', sec)) {
      const arg = def.inputs[+inp.dataset.i];
      const exp = await Exalgo.call(prog, def.fn, [arg], Exalgo.queueIO());
      const good = inp.value.trim() !== '' && Math.abs(parseFloat(inp.value.replace(',', '.')) - exp.v) < 1e-9;
      inp.classList.remove('ok', 'ko');
      inp.classList.add(good ? 'ok' : 'ko');
      if (!good) all = false;
    }
    if (all) {
      setFb(sec, "Tous les cas sont justes, y compris les valeurs hors des niveaux 1 à 4 (0, 5 et -1) qui doivent donner -1.", 'ok');
      markDone(id);
    } else {
      setFb(sec, "Certains résultats sont faux. Pense aux niveaux qui n'existent pas : que doit retourner la fonction ?", 'ko');
    }
  }
};

function mountWidgets(root) {
  $$('[data-widget]', root).forEach(w => {
    if (w._mounted) return;
    w._mounted = true;
    const kind = w.dataset.widget;
    if (kind === 'evaluator') {
      const input = $('.ev-input', w), out = $('.ev-out', w);
      const go = async () => {
        const text = input.value.trim();
        if (!text) return;
        try {
          const v = await Exalgo.evalExpression(text);
          out.className = 'ev-out ok';
          out.innerHTML = `<code>${esc(text)}</code> vaut <strong>${esc(Exalgo.describe(v))}</strong> <span class="ty">(${v.t === 'chaîne' ? 'texte' : v.t})</span>`;
        } catch (e) {
          out.className = 'ev-out ko';
          out.textContent = e.message;
        }
      };
      $('.ev-form', w).addEventListener('submit', e => { e.preventDefault(); go(); });
      $$('.chip', w).forEach(c => c.addEventListener('click', () => { input.value = c.dataset.chip; go(); }));
    } else if (kind === 'traceplayer') {
      const prog = TRACE_PROGS[w.dataset.key];
      const code = $('.prog code', w), table = $('.tp-table', w), pos = $('.tp-pos', w);
      code.innerHTML = numberLines(hlEx(prog));
      let tr = null, step = 0;
      const draw = () => {
        const lines = $$('.ln', code);
        lines.forEach(l => l.classList.remove('active'));
        if (step > 0) {
          const ln = tr.rows[step - 1].line;
          if (lines[ln - 1]) lines[ln - 1].classList.add('active');
        }
        table.innerHTML = step === 0 ? '<p class="muted">Appuie sur « Pas suivant » pour exécuter la première ligne.</p>' : traceTableHTML(tr, step);
        pos.textContent = `${step} / ${tr.rows.length}`;
        $('[data-tp="next"]', w).disabled = step >= tr.rows.length;
        $('[data-tp="prev"]', w).disabled = step <= 0;
        $('[data-tp="first"]', w).disabled = step <= 0;
        $('[data-tp="last"]', w).disabled = step >= tr.rows.length;
      };
      Exalgo.traceProgram(prog, []).then(t => { tr = t; draw(); });
      w.addEventListener('click', e => {
        const b = e.target.closest('[data-tp]');
        if (!b || !tr) return;
        const k = b.dataset.tp;
        if (k === 'next') step = Math.min(step + 1, tr.rows.length);
        else if (k === 'prev') step = Math.max(step - 1, 0);
        else if (k === 'first') step = 0;
        else step = tr.rows.length;
        draw();
      });
    } else if (kind === 'afficheligne') {
      const car = $('.afl-car', w), min = $('.afl-min', w), size = $('.afl-size', w), out = $('.afl-out', w);
      const draw = () => {
        const c = car.value || '#';
        const m = Math.max(1, parseInt(min.value, 10) || 1);
        const s = Math.max(0, parseInt(size.value, 10) || 0);
        out.innerHTML = esc(`afficheLigne('${c}', ${m}, ${s})`) + '\n<span class="sp">' + '·'.repeat(m - 1) + '</span>' + esc(c.repeat(s)) + '\n<span class="muted">(les · représentent des espaces)</span>';
      };
      [car, min, size].forEach(i => i.addEventListener('input', draw));
      draw();
    } else if (kind === 'house') {
      const q = s => $(s, w);
      const draw = () => {
        const n = +q('.h-n').value;
        const kEl = q('.h-k');
        kEl.max = n;
        if (+kEl.value > n) kEl.value = n;
        const W = 5 * n + 1;
        q('.h-cc').max = W - 4;
        if (+q('.h-cc').value > W - 4) q('.h-cc').value = W - 4;
        q('.h-n-o').textContent = n;
        q('.h-k-o').textContent = kEl.value;
        q('.h-f-o').textContent = q('.h-f').value;
        q('.h-cr-o').textContent = q('.h-cr').value;
        q('.h-cc-o').textContent = q('.h-cc').value;
        const lines = houseLines({
          n, k: +kEl.value,
          toit: q('.h-toit').value || '^', mur: q('.h-mur').value || '#', volet: q('.h-volet').value || 'Z',
          floors: +q('.h-f').value,
          chimney: q('.h-ch').checked ? { row: +q('.h-cr').value, col: +q('.h-cc').value } : null
        });
        q('.house-out').textContent = lines.join('\n');
      };
      $$('input', w).forEach(i => i.addEventListener('input', draw));
      draw();
    }
  });
}

const PROG7 = `Var n, p : entier

<h2>Les fonctions</h2>
<p>L'intérêt d'une fonction est de diviser un gros problème en une succession de sous-problèmes simples à résoudre.</p>
<h3>Signature</h3>
<ul>
  <li>Les fonctions peuvent (ou pas) avoir des <strong>paramètres</strong>.</li>
  <li>Ces paramètres ont des « modes de passage » : <strong>E</strong> (entrée) ou <strong>ES</strong> (entrée/sortie). Cette notion sera vue plus tard (cycle 3). Pour le moment, on utilisera toujours le mode E.</li>
  <li>Les fonctions peuvent <strong>retourner une valeur, et une seule, ou ne rien retourner</strong>.</li>
</ul>
<p>Une fonction a une <strong>signature</strong> (parfois appelée <strong>prototype</strong>) qu'il faut savoir reconnaître :</p>
${cb({ ex: `Fonction nom(E paramètre1 : type, E paramètre2 : type, ..., E paramètreN : type) : type de retour éventuel`, java: `static typeRetour nom(type paramètre1, type paramètre2, ..., type paramètreN)`, noAtelier: true })}
<p>Voici quelques exemples possibles :</p>
<div class="triple-cards">
  <div class="mini-card"><h4>Pas de paramètre, un retour</h4>${cb({ ex: 'Fonction fct1() : entier', java: 'static int fct1()', noAtelier: true })}<p>${c('fct1')} a 0 paramètre et retourne un entier.</p></div>
  <div class="mini-card"><h4>Un paramètre, pas de retour</h4>${cb({ ex: 'Fonction fct2(E a : entier)', java: 'static void fct2(int a)', noAtelier: true })}<p>${c('fct2')} a 1 paramètre entier et ne retourne rien. Dans son corps, on accède à la valeur passée via la variable ${c('a')}.</p></div>
  <div class="mini-card"><h4>Des paramètres et un retour</h4>${cb({ ex: 'Fonction fct3(E a : entier, E b : booléen) : caractère', java: 'static char fct3(int a, boolean b)', noAtelier: true })}<p>${c('fct3')} a 2 paramètres (un entier et un booléen) et retourne un caractère.</p></div>
</div>

<h3>Corps</h3>
<p>Après la signature, le corps de la fonction se découpe en deux parties :</p>
<ul>
  <li>la déclaration des variables, signalée par le mot-clé ${c('Var')} ;</li>
  <li>le code délimité par les mots-clés ${c('Début')} et ${c('Fin')}, comprenant au moins une instruction ${c('Retourner')} pour les fonctions qui retournent une valeur.</li>
</ul>
${note('convention', 'Convention : retour de fonction', `<p>Au premier semestre, pas de ${c('Retourner')} dans une boucle.</p>`)}
<h4>Exemple</h4>
${cb({ ex: `Fonction somme(E n1 : entier, E n2 : entier) : entier
Var s : entier
Début
    s ← n1 + n2
    Retourner s
Fin`, java: `static int somme(int n1, int n2) {
    int s;
    s = n1 + n2;
    return s;
}` })}
<p>La déclaration des variables n'est pas toujours nécessaire. On aurait ainsi pu écrire :</p>
${cb({ ex: `Fonction somme(E n1 : entier, E n2 : entier) : entier
Début
    Retourner n1 + n2
Fin`, java: `static int somme(int n1, int n2) {
    return n1 + n2;
}` })}
${note('attention', 'Attention : modification des paramètres', `<p>Il est interdit de modifier un paramètre passé en entrée (E) : c'est une erreur de syntaxe.</p>`)}
${cb({ ex: `Fonction somme(E n1 : entier, E n2 : entier) : entier
Début
    n1 ← n1 + n2 // erreur de syntaxe
    Retourner n1
Fin

Var r : entier
r ← somme(1, 2)`, run: true })}

<h3>Appel</h3>
<p>Bien sûr, une fonction n'a d'intérêt que lorsqu'elle est <strong>appelée</strong>, c'est-à-dire lorsque l'on demande l'exécution de son code :</p>
<ul>
  <li>avec certaines valeurs pour ses paramètres (que l'on appelle <strong>arguments</strong>), et</li>
  <li>en récupérant (le cas échéant) sa <strong>valeur de retour</strong>.</li>
</ul>
<p>Tout ceci en respectant les types : si la fonction attend un réel comme argument, on ne peut pas lui envoyer un caractère.</p>
<h4>Exemple</h4>
<p>On part des variables suivantes, puis on appelle les fonctions ${c('fct1')}, ${c('fct2')} et ${c('fct3')} :</p>
${cb({ ex: `Var res1 : entier
Var val2 : booléen
Var res3 : caractère`, noAtelier: true })}
<p><strong>Récupérer une valeur de retour</strong> :</p>
${cb({ ex: `res1 ← fct1()
ecrire(res1)`, noAtelier: true })}
<p><strong>Passer des valeurs en arguments</strong> :</p>
${cb({ ex: `fct2(2)
fct2(-12)
fct2(res1)`, noAtelier: true })}
<p><strong>Combiner les deux</strong> :</p>
${cb({ ex: `res3 ← fct3(-2, vrai)
ecrire(res3)
res3 ← fct3(0, faux)
ecrire(res3)
val2 ← faux
res3 ← fct3(4, val2)`, noAtelier: true })}
<p><strong>Composer les appels de fonction</strong> :</p>
${cb({ ex: `res3 ← fct3(fct1(), faux)`, noAtelier: true })}
<p>Ces fonctions n'ont pas de corps ici. Voici un programme complet qui les utilise, avec des corps inventés pour l'exemple. Exécute-le et observe qui appelle qui.</p>
${cb({
      ex: `Fonction fct1() : entier
Début

Fin

Fonction fct2(E a : entier)
Début
    ecrireLigne("fct2 reçoit " + a)
Fin

Fonction fct3(E a : entier, E b : booléen) : caractère
Var res : caractère
Début

    Si a > 0 et b Alors
        res ← 'O'

  <figure class="anatomy hero-fig" aria-label="Anatomie d'une variable">
    <div class="an-code"><span class="c-kw">Var</span> <span class="an-nom">saisie</span> : <span class="an-type">caractère</span><br><span class="an-nom">saisie</span> ← <span class="an-val">'r'</span></div>
    <ul class="an-legend"><li><span class="dot nom"></span>un nom</li><li><span class="dot type"></span>un type</li><li><span class="dot val"></span>une valeur</li></ul>
  </figure>
  <h2>Ce que tu sauras faire</h2>
  <p>Chaque compétence du cours est une case : elle se coche quand tu termines la leçon.</p>
  <ul class="skills">
    ${LESSONS.map((l, i) => `<li class="skill${Store.data.lessons[l.id] ? ' is-done' : ''}" data-l="${l.id}"><a href="#${l.id}"><span class="sk-n">${i + 1}</span><span class="sk-t">${esc(l.skill)}</span><span class="sk-l">${esc(l.title)}</span></a></li>`).join('')}
  </ul>
  <h2>Le projet</h2>
  <p>Cinq étapes, du descriptif au niveau 5 « maison ». Tu écris chacune des 11 fonctions du jeu ; celles que tu n'as pas encore écrites sont complétées automatiquement pour que tes tests tournent quand même.</p>
  <p><a class="btn ghost" href="#p1">Voir le projet</a> <a class="btn ghost" href="#atelier">Ouvrir l'atelier</a></p>
</div>`;
}

function pageLesson(l, idx) {
  const exs = (l.ex || []).map(exercise).join('');
  const done = !!Store.data.lessons[l.id];
  const pos = ORDER.indexOf(l.id);
  const prev = pos > 0 ? ORDER[pos - 1] : null, next = pos < ORDER.length - 1 ? ORDER[pos + 1] : null;
  const find = id => [...LESSONS, ...PROJECT].find(x => x.id === id);
  const isLesson = idx !== undefined;
  return `<article class="page">
  <p class="kicker">${isLesson ? `Leçon ${idx + 1} sur ${LESSONS.length}` : `Projet · ${esc(l.title.split(' : ')[0])}`}</p>
  <h1>${esc(isLesson ? l.title : l.title.replace(/^Étape \d+ : /, ''))}</h1>
  <p class="lead">${esc(l.lead)}</p>
  <div class="body">${l.body()}</div>
  ${exs ? `<section class="practice"><h2>S'entraîner</h2>${exs}</section>` : ''}
  ${isLesson ? `<div class="finish"><button type="button" class="btn${done ? ' ghost' : ''}" data-app="finish" data-l="${l.id}" aria-pressed="${done}">${done ? '✓ Leçon terminée' : 'Marquer la leçon comme terminée'}</button></div>` : ''}
  <nav class="pager" aria-label="Navigation">
    ${prev ? `<a href="#${prev}"><span>Précédent</span>${esc(find(prev).title)}</a>` : '<span></span>'}
    ${next ? `<a class="next" href="#${next}"><span>Suivant</span>${esc(find(next).title)}</a>` : '<a class="next" href="#memo"><span>Pour finir</span>Mémo ExAlgo ↔ Java</a>'}
  </nav>
</article>`;
}

function pageMemo() {
  return `<article class="page">
  <p class="kicker">Aide-mémoire</p>
  <h1>Mémo ExAlgo ↔ Java</h1>
  <p class="lead">Tout le cycle 1 sur une page, avec les deux langages côte à côte.</p>
  <div class="tbl-wrap"><table class="memo"><thead><tr><th scope="col">Pour…</th><th scope="col">ExAlgo</th><th scope="col">Java</th></tr></thead><tbody>
  ${MEMO_ROWS.map(r => `<tr><th scope="row">${esc(r[0])}</th><td><pre>${hlEx(r[1])}</pre></td><td><pre>${hlJava(r[2])}</pre></td></tr>`).join('')}
  </tbody></table></div>
  <h2>Les pièges classiques</h2>
  <ul class="pieges">${PIEGES.map(p => `<li><strong>${p[0]}</strong><span>${p[1]}</span></li>`).join('')}</ul>
  <h2>Le programme Java complet du jeu</h2>
  <p>Voici le jeu assemblé en Java, à partir des fonctions du projet. Ton TP a peut-être son propre code de base (afficheCar, afficheLigne) : garde le tien s'il diffère.</p>
  ${cb({ ex: fullExalgoProgram(), java: fullJavaProgram(), noAtelier: false, run: true, runExtra: GAME_RUN })}
</article>`;
}

const atelierState = { term: null };
function pageAtelier() {
  const names = Object.keys(SNIPPETS);
  return `<article class="page wide">
  <p class="kicker">Outil</p>
  <h1>Atelier ExAlgo</h1>
  <p class="lead">Écris du ExAlgo, exécute-le, réponds aux saisies dans le terminal, ou regarde la trace ligne par ligne. Ctrl + Entrée exécute.</p>
  <div class="at-bar"><label>Exemple <select id="at-sel">${names.map(n => `<option>${esc(n)}</option>`).join('')}</select></label>
    <button type="button" class="btn" data-app="at-run">▶ Exécuter</button>
    <button type="button" class="btn ghost" data-app="at-trace">Trace</button>
    <button type="button" class="btn ghost" data-app="at-reset">Exemple d'origine</button></div>
  ${editorHTML('atelier', '')}
  <div id="at-term" class="cb-term"></div>
  <div id="at-trace" class="at-trace" hidden></div>
</article>`;
}
function mountAtelier() {
  const ed = $('[data-editor="atelier"]'), ta = $('.ta', ed), sel = $('#at-sel');
  const pending = window.pendingAtelier;
  window.pendingAtelier = null;
  ta.value = pending != null ? pending : (Store.data.atelier || SNIPPETS[sel.value]);
  const host = $('#at-term');
  atelierState.term = mountTerm(host);
  const trBox = $('#at-trace');
  const run = async trace => {
    Store.data.atelier = ta.value; Store.save();
    trBox.hidden = true;
    const t = atelierState.term;
    if (t.pending) t.abort();
    const r = await t.run(ta.value, { trace, onError: e => editorMark(ed, e.line) });
    if (trace && r && r.trace) {
      trBox.hidden = false;
      trBox.innerHTML = `<h3>Trace</h3>` + (r.trace.rows.length ? traceTableHTML(r.trace, r.trace.rows.length) : '<p class="muted">Aucune ligne tracée au niveau principal.</p>');
    }
  };
  initEditor(ed, { onChange: v => { Store.data.atelier = v; Store.save(); }, onRun: () => run(false) });
  editorUpdate(ed);
  sel.addEventListener('change', () => { ta.value = SNIPPETS[sel.value]; ta.dispatchEvent(new Event('input')); });
  $('[data-app="at-run"]').addEventListener('click', () => run(false));
  $('[data-app="at-trace"]').addEventListener('click', () => run(true));
  $('[data-app="at-reset"]').addEventListener('click', () => { ta.value = SNIPPETS[sel.value]; ta.dispatchEvent(new Event('input')); });
}

/* ---------- Routeur ---------- */
function route() {
  let id = (location.hash || '').replace('#', '');
  if (!ALL_IDS.includes(id)) id = 'accueil';
  const m = main();
  let html;
  const li = LESSONS.findIndex(l => l.id === id);
  if (id === 'accueil') html = pageAccueil();
  else if (li >= 0) html = pageLesson(LESSONS[li], li);
  else if (id === 'atelier') html = pageAtelier();
  else if (id === 'memo') html = pageMemo();
  else html = pageLesson(PROJECT.find(p => p.id === id));
  m.innerHTML = html;
  $$('.nav a').forEach(a => a.setAttribute('aria-current', a.dataset.id === id ? 'page' : 'false'));
  document.title = (id === 'accueil' ? 'ExAlgo Cycle 1' : ((LESSONS.find(l => l.id === id) || PROJECT.find(p => p.id === id) || { title: id === 'atelier' ? 'Atelier' : 'Mémo' }).title + ' · ExAlgo Cycle 1'));
  mountExercises(m);
  if (id === 'atelier') mountAtelier();
  window.updateProgress();
  closeDrawer();
  window.scrollTo(0, 0);
  m.focus({ preventScroll: true });
}

function closeDrawer() { document.body.classList.remove('drawer-open'); const b = $('#menu-btn'); if (b) b.setAttribute('aria-expanded', 'false'); }

function setTheme(t) { try { localStorage.setItem('cours-theme', t || ''); } catch (e) { /* indisponible */ }
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}
function init() {
  document.getElementById('app').innerHTML = `
<a class="skip" href="#main">Aller au contenu</a>
<header class="top">
  <button type="button" id="menu-btn" class="icon-btn" aria-label="Menu" aria-expanded="false" aria-controls="side">☰</button>
  <a class="back" href="index.html" title="Retour à la matière" aria-label="Retour à la matière">⌂</a><a class="brand" href="#accueil"><span class="brand-mark">Ex</span>Algo <small>cycle 1</small></a>
  <div class="meter" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="prog-bar"></i></div>
  <span id="prog-txt" class="prog-txt"></span>
  <div class="tools">
    <div class="seg" role="group" aria-label="Langage des exemples"><button type="button" data-app="lang" data-v="ex" aria-pressed="true">ExAlgo</button><button type="button" data-app="lang" data-v="java" aria-pressed="false">Java</button></div>
    <button type="button" id="theme-btn" class="icon-btn" aria-label="Changer le thème" title="Thème clair / sombre">◐</button>
  </div>
</header>
<div class="shell">
  <nav id="side" class="side nav" aria-label="Sommaire">${navHTML()}</nav>
  <div class="scrim" data-app="scrim"></div>
  <main id="main" tabindex="-1"></main>
</div>`;
  const syncLang = () => $$('[data-app="lang"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === Store.data.lang)));
  syncLang();
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-app]');
    if (!b) return;
    const k = b.dataset.app;
    if (k === 'lang') { Store.data.lang = b.dataset.v; Store.save(); syncLang(); applyGlobalLang(document); }
    else if (k === 'finish') {
      const id = b.dataset.l;
      Store.data.lessons[id] = !Store.data.lessons[id]; Store.save();
      const on = !!Store.data.lessons[id];
      b.textContent = on ? '✓ Leçon terminée' : 'Marquer la leçon comme terminée';
      b.classList.toggle('ghost', on); b.setAttribute('aria-pressed', String(on));
      window.updateProgress();
    } else if (k === 'scrim') closeDrawer();
  });
  $('#menu-btn').addEventListener('click', () => {
    const o = document.body.classList.toggle('drawer-open');
    $('#menu-btn').setAttribute('aria-expanded', String(o));
  });
  $('#theme-btn').addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    setTheme(dark ? 'light' : 'dark');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
  window.addEventListener('hashchange', route);
  route();
}
init();

;(function(){var o=window.updateProgress;window.updateProgress=function(){if(o)o.apply(this,arguments);try{var ids=typeof EX_IDS!=='undefined'?EX_IDS:Object.keys(EXERCISES);var d=Store.data.done||{},l=Store.data.lessons||{};localStorage.setItem('hub:algo/cycle1',JSON.stringify({done:ids.filter(function(k){return d[k]}).length,total:ids.length,lessons:LESSONS.filter(function(x){return l[x.id]}).length,nl:LESSONS.length}))}catch(e){}};window.updateProgress()})();

</script>
