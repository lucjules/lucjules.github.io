<script>
/* exalgo.js */
/* ExAlgo : interpréteur pédagogique, version du cycle 3
   Sous-ensemble : Var, Const, ←, ++/--, Si/Sinon Si/Sinon, Selon Que, Pour, Tant Que, Faire Tant Que
   (blocs par indentation), Fonction ... Début ... Fin (paramètres E et ES), Retourner, Affirmer,
   tableaux à 1 et 2 dimensions (t[i], t[i][j], t.taille, [1, 2, 3]), appels Classe.fonction(),
   ecrire, ecrireLigne, lire*, entierAléatoire, valeurAléatoire, formaterReel, afficheCar. */
const Exalgo = (() => {
  'use strict';

  class ExError extends Error {
    constructor(message, line) {
      super(message);
      this.name = 'ExError';
      this.line = line || null;
    }
  }

  const strip = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  const TYPE_NAMES = { entier: 'entier', reel: 'réel', caractere: 'caractère', booleen: 'booléen' };
  function normType(word) {
    const w = strip(word);
    if (TYPE_NAMES[w]) return TYPE_NAMES[w];
    if (w.endsWith('s') && TYPE_NAMES[w.slice(0, -1)]) return TYPE_NAMES[w.slice(0, -1)];
    return null;
  }
  /* Types : 'entier', 'réel', 'caractère', 'booléen', ou { k: 'tab', of: type } pour un tableau
     (un tableau à 2 dimensions est un tableau de tableaux). */
  const isTab = t => !!t && typeof t === 'object' && t.k === 'tab';
  const PLURIEL = { entier: 'entiers', 'réel': 'réels', 'caractère': 'caractères', 'booléen': 'booléens' };
  function typeName(t) {
    if (!isTab(t)) return t === 'chaîne' ? 'texte' : String(t);
    let dims = 0, base = t;
    while (isTab(base)) { dims++; base = base.of; }
    if (base === null) return 'tableau';
    const de = base === 'entier' ? "tableau d'entiers" : `tableau de ${PLURIEL[base] || base}`;
    return dims > 1 ? `${de} à ${dims} dimensions` : de;
  }
  const tname = t => typeName(t);
  function typeEq(a, b) {
    if (isTab(a) || isTab(b)) return isTab(a) && isTab(b) && typeEq(a.of, b.of);
    return a === b;
  }

  const BUILTIN_KEYS = new Set(['ecrire', 'ecrireligne', 'lireentier', 'lirereel', 'lirecaractere', 'affichecar', 'afficheligne', 'entieraleatoire', 'valeuraleatoire', 'formaterreel']);

  /* ---------- Lexer ---------- */
  function tokenizeLine(text, lineNo, st) {
    const toks = [];
    let i = 0;
    const n = text.length;
    while (i < n) {
      if (st.inBlock) {
        const end = text.indexOf('*/', i);
        if (end === -1) { i = n; break; }
        st.inBlock = false;
        i = end + 2;
        continue;
      }
      const c = text[i];
      if (c === ' ' || c === '\t') { i++; continue; }
      if (c === '/' && text[i + 1] === '/') break;
      if (c === '/' && text[i + 1] === '*') { st.inBlock = true; i += 2; continue; }
      if (c === '"') {
        let j = i + 1, s = '';
        while (j < n && text[j] !== '"') {
          if (text[j] === '\\' && j + 1 < n) {
            const nx = text[j + 1];
            s += nx === 'n' ? '\n' : nx === 't' ? '\t' : nx;
            j += 2;
          } else { s += text[j]; j++; }
        }
        if (j >= n) throw new ExError('Il manque le guillemet fermant (") de ce texte.', lineNo);
        toks.push({ k: 'str', v: s, line: lineNo });
        i = j + 1;
        continue;
      }
      // « tableau d'entiers » : l'apostrophe après « d » n'ouvre pas un caractère
      const prev = toks[toks.length - 1];
      if ((c === "'" || c === '’') && prev && prev.k === 'id' && prev.kw === 'd' && /d/i.test(text[i - 1] || '') &&
          /[A-Za-zÀ-ÿ]/.test(text[i + 1] || '') && text[i + 2] !== "'") {
        i++;
        continue;
      }
      if (c === "'") {
        const cp = [...text.slice(i + 1)][0];
        if (cp === undefined || cp === "'") throw new ExError("Un caractère s'écrit entre apostrophes, avec exactement un symbole : 'a'.", lineNo);
        const j = i + 1 + cp.length;
        if (text[j] !== "'") throw new ExError("Un caractère ne contient qu'un seul symbole : 'a'. Pour du texte, utilise des guillemets.", lineNo);
        toks.push({ k: 'chr', v: cp, line: lineNo });
        i = j + 1;
        continue;
      }
      if (/[0-9]/.test(c)) {
        let j = i;
        while (j < n && /[0-9]/.test(text[j])) j++;
        let real = false;
        if (text[j] === '.' && /[0-9]/.test(text[j + 1] || '')) {
          real = true;
          j++;
          while (j < n && /[0-9]/.test(text[j])) j++;
        }
        toks.push({ k: 'num', v: parseFloat(text.slice(i, j)), real, line: lineNo });
        i = j;
        continue;
      }
      if (/[A-Za-zÀ-ÿ_]/.test(c)) {
        let j = i;
        while (j < n && /[A-Za-zÀ-ÿ0-9_]/.test(text[j])) j++;
        const word = text.slice(i, j);
        toks.push({ k: 'id', v: word, kw: strip(word), line: lineNo });
        i = j;
        continue;
      }
      const two = text.slice(i, i + 2);
      if (['<-', ':=', '==', '!=', '<=', '>=', '++', '--'].includes(two)) {
        toks.push({ k: 'op', v: (two === '<-' || two === ':=') ? '←' : two, line: lineNo });
        i += 2;
        continue;
      }
      if ('←≠≤≥'.includes(c)) {
        toks.push({ k: 'op', v: c === '≠' ? '!=' : c === '≤' ? '<=' : c === '≥' ? '>=' : c, line: lineNo });
        i++;
        continue;
      }
      if ('+-*/%()<>,:=[].'.includes(c)) {
        toks.push({ k: 'op', v: c, line: lineNo });
        i++;
        continue;
      }
      throw new ExError(`Symbole inattendu « ${c} ».`, lineNo);
    }
    return toks;
  }

  // Une ligne dont les parenthèses ou crochets ne sont pas refermés continue sur les suivantes
  // (signature de fonction écrite sur plusieurs lignes, long appel…).
  const openDepth = toks => toks.reduce((d, t) => d + (t.k === 'op' ? (t.v === '(' || t.v === '[' ? 1 : t.v === ')' || t.v === ']' ? -1 : 0) : 0), 0);
  function splitLines(src) {
    const st = { inBlock: false };
    const lines = [];
    let pending = null;
    src.replace(/\r\n?/g, '\n').split('\n').forEach((raw, idx) => {
      const lineNo = idx + 1;
      let indent = 0, i = 0;
      while (i < raw.length && (raw[i] === ' ' || raw[i] === '\t')) {
        indent += raw[i] === '\t' ? 4 : 1;
        i++;
      }
      const toks = tokenizeLine(raw.slice(i), lineNo, st);
      if (!toks.length) return;
      if (pending) pending.toks.push(...toks);
      else pending = { indent, toks, line: lineNo };
      if (openDepth(pending.toks) > 0) return;
      lines.push(pending);
      pending = null;
    });
    if (pending) lines.push(pending);
    return lines;
  }

  const tokText = t => (t.k === 'str' ? `"${t.v}"` : t.k === 'chr' ? `'${t.v}'` : String(t.v));

  function toksToText(ts) {
    let out = '';
    ts.forEach((t, i) => {
      const p = ts[i - 1];
      const tight = !p || (p.k === 'op' && (p.v === '(' || p.v === '[' || p.v === '.')) || (t.k === 'op' && (t.v === ']' || t.v === '.')) || (t.k === 'op' && t.v === '[' && (p.k === 'id' || (p.k === 'op' && p.v === ']'))) ||(t.k === 'op' && (t.v === ')' || t.v === ',')) || (t.k === 'op' && t.v === '(' && p.k === 'id' && !['et', 'ou', 'non'].includes(p.kw)) || (p.k === 'op' && p.v === '-' && (i < 2 || (ts[i - 2].k === 'op' && ts[i - 2].v !== ')')));
      out += (tight ? '' : ' ') + tokText(t);
    });
    return out;
  }

  class Cur {
    constructor(toks, line) { this.t = toks; this.i = 0; this.line = line; }
    peek(o = 0) { return this.t[this.i + o]; }
    next() { return this.t[this.i++]; }
    eof() { return this.i >= this.t.length; }
    isKw(w, o = 0) { const t = this.peek(o); return !!t && t.k === 'id' && t.kw === w; }
    isOp(v, o = 0) { const t = this.peek(o); return !!t && t.k === 'op' && t.v === v; }
    expectOp(v, msg) {
      if (!this.isOp(v)) throw new ExError(msg || `Il manque « ${v} ».`, this.line);
      return this.next();
    }
  }

  /* ---------- Parser ---------- */
  class Parser {
    constructor(lines) {
      this.lines = lines;
      this.p = 0;
      this.fns = new Map();
      this.top = [];
      this.consts = [];
    }

    parseProgram() {
      while (this.p < this.lines.length) {
        const L = this.lines[this.p];
        const t0 = L.toks[0];
        if (t0.k === 'id' && t0.kw === 'fonction') this.parseFunction();
        else {
          const st = this.parseStatement();
          if (st.k === 'const') this.consts.push(st); else this.top.push(st);
        }
      }
    }

    /* --- expressions --- */
    parseExpr(c) { return this.parseOr(c); }
    parseOr(c) {
      let l = this.parseAnd(c);
      while (c.isKw('ou')) { c.next(); const r = this.parseAnd(c); l = { k: 'bin', op: 'ou', l, r, line: c.line }; }
      return l;
    }
    parseAnd(c) {
      let l = this.parseNot(c);
      while (c.isKw('et')) { c.next(); const r = this.parseNot(c); l = { k: 'bin', op: 'et', l, r, line: c.line }; }
      return l;
    }
    parseNot(c) {
      if (c.isKw('non')) { c.next(); const e = this.parseNot(c); return { k: 'un', op: 'non', e, line: c.line }; }
      return this.parseCmp(c);
    }
    parseCmp(c) {
      const l = this.parseAdd(c);
      const t = c.peek();
      if (t && t.k === 'op' && ['==', '!=', '<=', '>=', '<', '>'].includes(t.v)) {
        c.next();
        const r = this.parseAdd(c);
        return { k: 'bin', op: t.v, l, r, line: c.line };
      }
      if (t && t.k === 'op' && t.v === '=') {
        throw new ExError("Pour comparer deux valeurs, écris « == » (un seul « = » n'existe pas en ExAlgo).", c.line);
      }
      return l;
    }
    parseAdd(c) {
      let l = this.parseMul(c);
      while (c.isOp('+') || c.isOp('-')) {
        const op = c.next().v;
        const r = this.parseMul(c);
        l = { k: 'bin', op, l, r, line: c.line };
      }
      return l;
    }
    parseMul(c) {
      let l = this.parseUnary(c);
      while (c.isOp('*') || c.isOp('/') || c.isOp('%')) {
        const op = c.next().v;
        const r = this.parseUnary(c);
        l = { k: 'bin', op, l, r, line: c.line };
      }
      return l;
    }
    parseUnary(c) {
      if (c.isOp('-')) { c.next(); const e = this.parseUnary(c); return { k: 'un', op: 'neg', e, line: c.line }; }
      if (c.isOp('+')) { c.next(); return this.parseUnary(c); }
      return this.parsePrimary(c);
    }
    parsePrimary(c) {
      const t = c.peek();
      if (!t) throw new ExError("L'expression est incomplète : il manque une valeur à la fin.", c.line);
      if (t.k === 'num') { c.next(); return { k: 'num', t: t.real ? 'réel' : 'entier', v: t.v, line: c.line }; }
      if (t.k === 'str') { c.next(); return { k: 'str', v: t.v, line: c.line }; }
      if (t.k === 'chr') { c.next(); return { k: 'chr', v: t.v, line: c.line }; }
      if (t.k === 'id') {
        if (t.kw === 'vrai' || t.kw === 'faux') { c.next(); return { k: 'bool', v: t.kw === 'vrai', line: c.line }; }
        if (['alors', 'sinon', 'debut', 'fin', 'si', 'var', 'fonction', 'retourner', 'et', 'ou', 'pour', 'faire', 'const', 'affirmer', 'selon', 'tableau'].includes(t.kw)) {
          throw new ExError(`On attend une valeur ici, mais on trouve le mot-clé « ${t.v} ».`, c.line);
        }
        c.next();
        let name = t.v;
        // Classe.fonction(…) ou Classe.CONSTANTE : le nom de la classe (avec une majuscule) précède un point
        while (c.isOp('.') && /^[A-Z]/.test(name) && c.peek(1) && c.peek(1).k === 'id' && c.peek(1).kw !== 'taille') {
          c.next();
          name = c.next().v;
        }
        let e;
        if (c.isOp('(')) {
          c.next();
          const args = [];
          if (!c.isOp(')')) {
            for (;;) {
              args.push(this.parseExpr(c));
              if (c.isOp(',')) { c.next(); continue; }
              break;
            }
          }
          c.expectOp(')', `Il manque « ) » pour fermer l'appel de ${name}.`);
          e = { k: 'call', name, args, line: c.line };
        } else {
          e = { k: 'id', name, line: c.line };
        }
        return this.parsePostfix(c, e);
      }
      if (t.k === 'op' && t.v === '[') {
        c.next();
        const items = [];
        if (!c.isOp(']')) {
          for (;;) {
            items.push(this.parseExpr(c));
            if (c.isOp(',')) { c.next(); continue; }
            break;
          }
        }
        c.expectOp(']', 'Il manque « ] » pour fermer le tableau : [1, 2, 3]');
        return this.parsePostfix(c, { k: 'arr', items, line: c.line });
      }
      if (t.k === 'op' && t.v === '(') {
        const t1 = c.peek(1), t2 = c.peek(2);
        if (t1 && t1.k === 'id' && normType(t1.v) && t2 && t2.k === 'op' && t2.v === ')') {
          c.next(); c.next(); c.next();
          const e = this.parseUnary(c);
          return { k: 'cast', type: normType(t1.v), e, line: c.line };
        }
        c.next();
        const e = this.parseExpr(c);
        c.expectOp(')', 'Il manque une parenthèse fermante « ) ».');
        return e;
      }
      throw new ExError(`On attend une valeur ici, mais on trouve « ${tokText(t)} ».`, c.line);
    }

    // t[i], t[i][j], t.taille, t[i].taille
    parsePostfix(c, e) {
      for (;;) {
        if (c.isOp('[')) {
          c.next();
          if (c.isOp(']')) throw new ExError("Il manque l'indice entre les crochets : t[i].", c.line);
          const i = this.parseExpr(c);
          c.expectOp(']', "Il manque « ] » pour fermer l'indice : t[i].");
          e = { k: 'idx', e, i, line: c.line };
          continue;
        }
        if (c.isOp('.')) {
          const nx = c.peek(1);
          if (nx && nx.k === 'id' && nx.kw === 'taille') { c.next(); c.next(); e = { k: 'len', e, line: c.line }; continue; }
          if (nx && nx.k === 'id' && nx.kw === 'length') throw new ExError("En ExAlgo, la taille d'un tableau s'écrit t.taille (t.length, c'est du Java).", c.line);
          throw new ExError("Après le point, on attend « taille » (t.taille). Pour appeler une fonction d'une autre classe, le nom de la classe commence par une majuscule : GestionNotes.somme(t).", c.line);
        }
        return e;
      }
    }

    /* --- types --- */
    // entier, réel…, tableau d'entiers, tableau de 10 entiers, tableau de 2 x 3 réels,
    // tableau de booléens à 2 dimensions. Rend { type, sizes } (sizes : expressions des tailles, ou null).
    parseType(c, line, what) {
      const t = c.peek();
      const unknown = () => new ExError(`Type inconnu${what ? ` pour ${what}` : ''}${t ? ` : « ${tokText(t)} »` : ''}. Les types sont : entier, réel, caractère, booléen, et les tableaux (tableau d'entiers, tableau de 10 entiers…).`, line);
      if (!t || t.k !== 'id') throw unknown();
      if (t.kw !== 'tableau') {
        const ty = normType(t.v);
        if (!ty) throw unknown();
        c.next();
        return { type: ty, sizes: null };
      }
      c.next();
      if (c.isKw('de') || c.isKw('d')) c.next();
      let sizes = null;
      const bt = c.peek();
      if (!(bt && bt.k === 'id' && normType(bt.v))) {
        if (!bt) throw new ExError("Type de tableau incomplet : écris par exemple « tableau d'entiers », « tableau de 10 entiers » ou « tableau de 2 x 3 réels ».", line);
        sizes = [this.parseAdd(c)];
        if (c.isKw('x')) { c.next(); sizes.push(this.parseAdd(c)); }
      }
      const et = c.next();
      const base = et && et.k === 'id' ? normType(et.v) : null;
      if (!base) throw new ExError("Type de tableau incomplet : après la taille, écris le type des cases, par exemple « tableau de 10 entiers » ou « tableau de 2 x 3 réels ».", line);
      let dims = sizes ? sizes.length : 1;
      if (c.isKw('a')) {
        c.next();
        const n = c.next();
        if (!n || n.k !== 'num' || n.real || !c.isKw('dimensions')) throw new ExError("Pour un tableau à deux dimensions, écris « tableau d'entiers à 2 dimensions ».", line);
        c.next();
        if (n.v !== 2) throw new ExError('Au S1, on se limite aux tableaux à 1 ou 2 dimensions.', line);
        if (sizes && sizes.length === 1) throw new ExError("Avec des tailles, un tableau à 2 dimensions s'écrit « tableau de 2 x 3 entiers » (lignes x colonnes).", line);
        dims = 2;
      }
      let type = base;
      for (let d = 0; d < dims; d++) type = { k: 'tab', of: type };
      return { type, sizes };
    }

    /* --- statements --- */
    parseStatement() {
      const L = this.lines[this.p];
      this.p++;
      return this.parseStatementFrom(L);
    }

    parseStatementFrom(L) {
      const c = new Cur(L.toks, L.line);
      const first = c.peek();
      const kw = first.k === 'id' ? first.kw : null;
      let node;
      if (kw === 'var') {
        node = this.parseVarDecl(c, L);
      } else if (kw === 'si') {
        return this.parseIf(L, c);
      } else if (kw === 'pour') {
        return this.parseFor(L, c);
      } else if (kw === 'tant' && c.isKw('que', 1)) {
        return this.parseWhile(L, c);
      } else if (kw === 'faire' && c.t.length === 1) {
        return this.parseDoWhile(L);
      } else if (kw === 'selon' && c.isKw('que', 1)) {
        return this.parseSwitch(L, c);
      } else if (kw === 'const') {
        node = this.parseConst(c, L);
      } else if (kw === 'affirmer') {
        c.next();
        if (c.eof()) throw new ExError("Après « Affirmer », écris la condition qui doit être vraie : Affirmer somme(1, 1) == 2", L.line);
        const from = c.i;
        const e = this.parseExpr(c);
        node = { k: 'affirmer', e, text: toksToText(c.t.slice(from, c.i)), line: L.line };
      } else if (kw === 'retourner') {
        c.next();
        let e = null;
        if (!c.eof()) e = this.parseExpr(c);
        node = { k: 'ret', e, line: L.line };
      } else if (kw === 'sinon') {
        throw new ExError("« Sinon » doit suivre un bloc « Si … Alors » et avoir la même indentation que ce Si.", L.line);
      } else if (kw === 'alors') {
        throw new ExError("« Alors » se place à la fin de la ligne du Si, après la condition.", L.line);
      } else if (kw === 'debut' || kw === 'fin') {
        throw new ExError(`« ${first.v} » n'est pas attendu ici.`, L.line);
      } else if (kw === 'fonction') {
        throw new ExError("Une fonction se déclare au niveau principal, pas dans une autre fonction ni dans un Si.", L.line);
      } else if (first.k === 'id' && !['et', 'ou', 'non', 'vrai', 'faux'].includes(kw)) {
        const nxt = c.peek(1);
        if (nxt && nxt.k === 'op' && nxt.v === '[') {
          // t[i] ← valeur, t[i][j] ← valeur, t[i]++
          c.next();
          const idx = [];
          while (c.isOp('[')) {
            c.next();
            if (c.isOp(']')) throw new ExError("Il manque l'indice entre les crochets : t[i].", L.line);
            idx.push(this.parseExpr(c));
            c.expectOp(']', "Il manque « ] » pour fermer l'indice : t[i].");
          }
          const text = first.v + idx.map(() => '[…]').join('');
          if (c.isOp('←')) {
            c.next();
            if (c.eof()) throw new ExError("Il manque la valeur à droite de « ← ».", L.line);
            node = { k: 'assignIdx', name: first.v, idx, e: this.parseExpr(c), line: L.line };
          } else if (c.isOp('++') || c.isOp('--')) {
            node = { k: 'incrIdx', name: first.v, idx, d: c.next().v === '++' ? 1 : -1, line: L.line };
          } else if (c.isOp('=')) {
            throw new ExError("Pour ranger une valeur dans une case, utilise « ← » (ou « <- ») : t[i] ← valeur.", L.line);
          } else {
            throw new ExError(`Après ${text}, on attend « ← » pour ranger une valeur dans la case.`, L.line);
          }
        } else if (nxt && nxt.k === 'op' && nxt.v === '.') {
          // Classe.fonction(…) appelée comme une instruction
          const e = this.parseExpr(c);
          if (e.k !== 'call') throw new ExError("Cette ligne ne fait rien : une instruction est une affectation (x ← …) ou un appel de fonction (f(…)).", L.line);
          node = { k: 'callstmt', e, line: L.line };
        } else if (nxt && nxt.k === 'op' && nxt.v === '←') {
          c.next(); c.next();
          if (c.eof()) throw new ExError("Il manque la valeur à droite de « ← ».", L.line);
          const e = this.parseExpr(c);
          node = { k: 'assign', name: first.v, e, line: L.line };
        } else if (nxt && nxt.k === 'op' && (nxt.v === '++' || nxt.v === '--')) {
          c.next(); c.next();
          node = { k: 'incr', name: first.v, d: nxt.v === '++' ? 1 : -1, line: L.line };
        } else if (nxt && nxt.k === 'op' && nxt.v === '(') {
          const e = this.parseExpr(c);
          node = { k: 'callstmt', e, line: L.line };
        } else if (nxt && nxt.k === 'op' && nxt.v === '=') {
          throw new ExError("Pour ranger une valeur dans une variable, utilise « ← » (ou « <- »). Le symbole « == » sert à comparer.", L.line);
        } else {
          throw new ExError(`Instruction non reconnue : « ${first.v} ». Une instruction est une affectation (x ← …), un appel (f(…)), un Si ou un Retourner.`, L.line);
        }
      } else {
        throw new ExError(`Instruction non reconnue : « ${tokText(first)} ».`, L.line);
      }
      if (!c.eof()) {
        throw new ExError(`Il y a quelque chose en trop à la fin de la ligne : « ${tokText(c.peek())} ».`, L.line);
      }
      return node;
    }

    parseConst(c, L) {
      c.next();
      const nt = c.next();
      if (!nt || nt.k !== 'id') throw new ExError("Après « Const », écris le nom de la constante : Const NOM ← valeur : type", L.line);
      if (!c.isOp('←')) throw new ExError("Il manque « ← » : Const NOM ← valeur : type", L.line);
      c.next();
      const e = this.parseExpr(c);
      c.expectOp(':', 'Il manque « : » et le type : Const NOM ← valeur : type');
      const tt = c.next();
      const ty = tt && tt.k === 'id' ? normType(tt.v) : null;
      if (!ty) throw new ExError(`Type inconnu${tt ? ` : « ${tokText(tt)} »` : ''}. Les types sont : entier, réel, caractère, booléen.`, L.line);
      return { k: 'const', name: nt.v, type: ty, e, line: L.line };
    }

    parseBody(L, c, what) {
      if (!c.eof()) {
        const rest = c.t.slice(c.i);
        return [this.parseStatementFrom({ indent: L.indent + 1, toks: rest, line: L.line })];
      }
      const b = this.parseBlock(L.indent);
      if (!b.length) throw new ExError(`Le bloc après « ${what} » est vide : décale les instructions vers la droite (indentation) sous cette ligne.`, L.line);
      return b;
    }

    parseFor(L, c) {
      c.next();
      const v = c.next();
      if (!v || v.k !== 'id') throw new ExError("Après « Pour », écris le nom de la variable de boucle : Pour i de 0 à 5 par pas de 1 Faire", L.line);
      if (!c.isKw('de')) throw new ExError("Il manque « de » : Pour i de 0 à 5 par pas de 1 Faire", L.line);
      c.next();
      const from = this.parseExpr(c);
      if (!(c.isKw('a'))) throw new ExError("Il manque « à » entre la valeur de début et la valeur de fin : Pour i de 0 à 5 Faire", L.line);
      c.next();
      const to = this.parseExpr(c);
      let step = null;
      if (c.isKw('par')) {
        c.next();
        if (!c.isKw('pas')) throw new ExError("Il manque « pas » : par pas de 2", L.line);
        c.next();
        if (!c.isKw('de')) throw new ExError("Il manque « de » : par pas de 2", L.line);
        c.next();
        step = this.parseExpr(c);
      }
      if (!c.isKw('faire')) throw new ExError("Il manque « Faire » à la fin de la ligne du Pour.", L.line);
      c.next();
      return { k: 'for', v: v.v, from, to, step, body: this.parseBody(L, c, 'Faire'), line: L.line };
    }

    parseWhile(L, c) {
      c.next(); c.next();
      if (c.eof() || c.isKw('faire')) throw new ExError("Il manque la condition entre « Tant Que » et « Faire ».", L.line);
      const cond = this.parseExpr(c);
      if (!c.isKw('faire')) throw new ExError("Il manque « Faire » à la fin de la ligne du Tant Que.", L.line);
      c.next();
      return { k: 'while', cond, body: this.parseBody(L, c, 'Faire'), line: L.line };
    }

    parseDoWhile(L) {
      const body = this.parseBlock(L.indent);
      if (!body.length) throw new ExError("Le bloc après « Faire » est vide : décale les instructions vers la droite (indentation).", L.line);
      const nl = this.lines[this.p];
      if (!nl || nl.indent !== L.indent || !(nl.toks[0].k === 'id' && nl.toks[0].kw === 'tant' && nl.toks[1] && nl.toks[1].k === 'id' && nl.toks[1].kw === 'que')) {
        throw new ExError("Une boucle « Faire » se termine par une ligne « Tant Que condition », alignée avec le « Faire ».", nl ? nl.line : L.line);
      }
      this.p++;
      const c = new Cur(nl.toks, nl.line);
      c.next(); c.next();
      if (c.eof()) throw new ExError("Il manque la condition après « Tant Que ».", nl.line);
      const cond = this.parseExpr(c);
      if (!c.eof()) throw new ExError(`Il y a quelque chose en trop à la fin de la ligne : « ${tokText(c.peek())} ». (Pas de « Faire » après le Tant Que final.)`, nl.line);
      return { k: 'dowhile', cond, body, line: L.line, condLine: nl.line };
    }

    parseSwitch(L, c) {
      c.next(); c.next();
      if (!c.eof()) throw new ExError("« Selon Que » s'écrit seul sur sa ligne ; les cas sont écrits dessous, décalés vers la droite.", L.line);
      const cases = [];
      let other = null;
      while (this.p < this.lines.length && this.lines[this.p].indent > L.indent) {
        const CL = this.lines[this.p];
        this.p++;
        const cc = new Cur(CL.toks, CL.line);
        let cond = null;
        if (cc.isKw('sinon') && cc.isOp(':', 1)) {
          cc.next();
          if (other) throw new ExError("Il ne peut y avoir qu'un seul « Sinon : » dans un Selon Que.", CL.line);
        } else {
          if (other) throw new ExError("Le « Sinon : » doit être le dernier cas du Selon Que.", CL.line);
          cond = this.parseExpr(cc);
        }
        if (!cc.isOp(':')) throw new ExError("Chaque cas s'écrit : condition : action. Il manque « : ».", CL.line);
        cc.next();
        const body = this.parseBody(CL, cc, ':');
        if (cond) cases.push({ cond, body, line: CL.line }); else other = body;
      }
      if (!cases.length && !other) throw new ExError("Le « Selon Que » est vide : écris les cas dessous, décalés vers la droite.", L.line);
      return { k: 'switch', cases, other, line: L.line };
    }

    parseVarDecl(c, L, cont) {
      if (!cont) c.next();
      const names = [];
      for (;;) {
        const t = c.next();
        if (!t || t.k !== 'id') throw new ExError("Après « Var », écris le nom de la variable : Var nom : type", L.line);
        names.push(t.v);
        if (c.isOp(',')) { c.next(); continue; }
        break;
      }
      c.expectOp(':', 'Il manque « : » et le type : Var nom : type');
      const { type, sizes } = this.parseType(c, L.line);
      return { k: 'var', names, type, sizes, line: L.line };
    }

    parseBlock(parent) {
      const out = [];
      while (this.p < this.lines.length) {
        const L = this.lines[this.p];
        if (L.indent <= parent) break;
        out.push(this.parseStatement());
      }
      return out;
    }

    parseIf(L, c) {
      c.next();
      if (c.eof() || c.isKw('alors')) throw new ExError("Il manque la condition entre « Si » et « Alors ».", L.line);
      const cond = this.parseExpr(c);
      if (!c.isKw('alors')) throw new ExError("Il manque « Alors » à la fin de la ligne du Si.", L.line);
      c.next();
      const node = { k: 'if', cond, then: [], else: null, line: L.line };
      if (!c.eof()) {
        const rest = c.t.slice(c.i);
        node.then = [this.parseStatementFrom({ indent: L.indent + 1, toks: rest, line: L.line })];
      } else {
        node.then = this.parseBlock(L.indent);
        if (!node.then.length) throw new ExError("Le bloc après « Alors » est vide : décale les instructions vers la droite (indentation) sous le Si.", L.line);
      }
      const nl = this.lines[this.p];
      if (nl && nl.indent === L.indent && nl.toks[0].k === 'id' && nl.toks[0].kw === 'sinon') {
        this.p++;
        const rest = nl.toks.slice(1);
        if (rest.length && rest[0].k === 'id' && rest[0].kw === 'si') {
          node.else = [this.parseIf({ indent: L.indent, toks: rest, line: nl.line }, new Cur(rest, nl.line))];
        } else if (rest.length) {
          node.else = [this.parseStatementFrom({ indent: L.indent + 1, toks: rest, line: nl.line })];
        } else {
          node.else = this.parseBlock(L.indent);
          if (!node.else.length) throw new ExError("Le bloc après « Sinon » est vide : décale les instructions vers la droite (indentation).", nl.line);
        }
      }
      return node;
    }

    parseFunction() {
      const L = this.lines[this.p];
      this.p++;
      const c = new Cur(L.toks, L.line);
      c.next();
      const nameTok = c.next();
      if (!nameTok || nameTok.k !== 'id') throw new ExError("Il manque le nom de la fonction après « Fonction ».", L.line);
      if (BUILTIN_KEYS.has(strip(nameTok.v))) throw new ExError(`« ${nameTok.v} » existe déjà (c'est une fonction fournie) : choisis un autre nom.`, L.line);
      if (this.fns.has(nameTok.v)) throw new ExError(`La fonction « ${nameTok.v} » est déjà définie.`, L.line);
      c.expectOp('(', "Il manque « ( » après le nom de la fonction.");
      const params = [];
      if (!c.isOp(')')) {
        for (;;) {
          let mode = 'E';
          const a = c.peek(), b = c.peek(1);
          if (a && a.k === 'id' && (a.kw === 'e' || a.kw === 'es') && b && b.k === 'id') {
            mode = a.kw === 'es' ? 'ES' : 'E';
            c.next();
          }
          const pn = c.next();
          if (!pn || pn.k !== 'id') throw new ExError("Un paramètre s'écrit : E nom : type", L.line);
          c.expectOp(':', `Il manque « : » et le type après le paramètre « ${pn.v} ».`);
          const ty = this.parseType(c, L.line, `le paramètre « ${pn.v} »`).type;
          params.push({ name: pn.v, type: ty, mode });
          if (c.isOp(',')) { c.next(); continue; }
          break;
        }
      }
      c.expectOp(')', "Il manque « ) » à la fin de la liste des paramètres.");
      let ret = null;
      if (c.isOp(':')) {
        c.next();
        if (c.eof()) throw new ExError("Il manque le type de retour après « : ».", L.line);
        ret = this.parseType(c, L.line, 'le résultat').type;
      }
      if (!c.eof()) throw new ExError(`Il y a quelque chose en trop dans la signature : « ${tokText(c.peek())} ».`, L.line);

      const body = [];
      for (;;) {
        const l = this.lines[this.p];
        if (!l) throw new ExError(`Il manque « Début » pour la fonction « ${nameTok.v} ».`, L.line);
        const t0 = l.toks[0];
        const k = t0.k === 'id' ? t0.kw : null;
        if (k === 'debut') {
          this.p++;
          if (l.toks.length > 1) throw new ExError("« Début » s'écrit seul sur sa ligne.", l.line);
          break;
        }
        if (k === 'var') { body.push(this.parseStatement()); continue; }
        if (body.length && body[body.length - 1].k === 'var' && t0.k === 'id' && l.toks[1] && l.toks[1].k === 'op' && (l.toks[1].v === ':' || l.toks[1].v === ',')) {
          this.p++;
          const cc = new Cur(l.toks, l.line);
          const d = this.parseVarDecl(cc, l, true);
          if (!cc.eof()) throw new ExError(`Il y a quelque chose en trop à la fin de la ligne : « ${tokText(cc.peek())} ».`, l.line);
          body.push(d);
          continue;
        }
        throw new ExError(`Avant « Début », on ne trouve que des déclarations « Var ». Il manque « Début » pour la fonction « ${nameTok.v} ».`, l.line);
      }
      for (;;) {
        const l = this.lines[this.p];
        if (!l) throw new ExError(`Il manque « Fin » pour terminer la fonction « ${nameTok.v} ».`, L.line);
        const t0 = l.toks[0];
        if (t0.k === 'id' && t0.kw === 'fin') {
          this.p++;
          if (l.toks.length > 1) throw new ExError("« Fin » s'écrit seul sur sa ligne.", l.line);
          break;
        }
        if (t0.k === 'id' && t0.kw === 'fonction') {
          throw new ExError(`Il manque « Fin » pour terminer la fonction « ${nameTok.v} » avant d'en commencer une autre.`, l.line);
        }
        body.push(this.parseStatement());
      }
      this.fns.set(nameTok.v, { name: nameTok.v, params, ret, body, line: L.line });
    }
  }

  /* ---------- Valeurs ---------- */
  function fmtReal(x) {
    if (!isFinite(x)) return String(x);
    let s = String(parseFloat(x.toPrecision(12)));
    if (/^-?\d+$/.test(s)) s += '.0';
    return s;
  }
  // Un tableau est une valeur { t: 'tableau', of: type des cases, a: [cases] } ; une case jamais remplie vaut undefined.
  const fmtArr = (v, f) => '[' + v.a.map(x => (x === undefined ? '/' : f(x))).join(', ') + ']';
  function toText(v) {
    switch (v.t) {
      case 'entier': return String(v.v);
      case 'réel': return fmtReal(v.v);
      case 'booléen': return v.v ? 'vrai' : 'faux';
      case 'tableau': return fmtArr(v, toText);
      default: return v.v;
    }
  }
  function describe(v) {
    if (v === undefined) return '(rien)';
    if (v.t === 'caractère') return `'${v.v}'`;
    if (v.t === 'tableau') return fmtArr(v, describe);
    return toText(v);
  }
  function fmtTrace(v) {
    if (v.t === 'booléen') return v.v ? 'Vrai' : 'Faux';
    if (v.t === 'caractère') return `'${v.v}'`;
    if (v.t === 'tableau') return fmtArr(v, fmtTrace);
    return toText(v);
  }
  function valuesEqual(a, b) {
    if (!a || !b) return a === b;
    if (a.t === 'tableau' || b.t === 'tableau') {
      if (a.t !== b.t || a.a.length !== b.a.length) return false;
      return a.a.every((x, i) => (x === undefined || b.a[i] === undefined ? x === b.a[i] : valuesEqual(x, b.a[i])));
    }
    const num = x => x.t === 'entier' || x.t === 'réel';
    if (num(a) && num(b)) return Math.abs(a.v - b.v) < 1e-9;
    return a.t === b.t && a.v === b.v;
  }
  const valType = v => (v.t === 'tableau' ? { k: 'tab', of: v.of } : v.t);
  // Adapte un tableau à un type attendu. Un tableau écrit directement ([1, 2], marqué lit) peut changer
  // de type de cases (entiers vers réels, tableau vide). Rend null si c'est impossible.
  function adaptArr(type, v) {
    if (!v || v.t !== 'tableau') return null;
    if (v.of !== null && typeEq(type.of, v.of)) return v;
    if (!v.lit) return null;
    const a = [];
    for (const x of v.a) {
      let y;
      if (x === undefined) y = undefined;
      else if (isTab(type.of)) y = adaptArr(type.of, x);
      else y = x.t === type.of ? x : (type.of === 'réel' && x.t === 'entier' ? { t: 'réel', v: x.v } : null);
      if (y === null) return null;
      a.push(y);
    }
    return { t: 'tableau', of: type.of, a, lit: true };
  }

  // Texte d'une expression pour les messages d'erreur : tab, tab[2], notes.taille…
  function exprText(e) {
    switch (e.k) {
      case 'id': return e.name;
      case 'idx': return `${exprText(e.e)}[${e.i.k === 'num' ? e.i.v : e.i.k === 'id' ? e.i.name : '…'}]`;
      case 'call': return `${e.name}(…)`;
      case 'len': return `${exprText(e.e)}.taille`;
      default: return 'cette valeur';
    }
  }

  // Tableau écrit directement : [3, 1, 4], ['a', 'b'], [[1, 2], [3, 4]], []
  function arrayLiteral(items, line) {
    if (!items.length) return { t: 'tableau', of: null, a: [], lit: true };
    const arrs = items.filter(x => x.t === 'tableau').length;
    if (arrs && arrs !== items.length) throw new ExError('Un tableau ne peut pas mélanger des cases simples et des tableaux.', line);
    if (!arrs) {
      const types = new Set(items.map(x => x.t));
      if (types.has('chaîne')) throw new ExError("Un tableau de textes n'existe pas en ExAlgo au S1 : utilise un tableau de caractères ['a', 'b'].", line);
      if (types.size === 1) return { t: 'tableau', of: items[0].t, a: items, lit: true };
      if ([...types].every(t => t === 'entier' || t === 'réel')) return { t: 'tableau', of: 'réel', a: items.map(x => ({ t: 'réel', v: x.v })), lit: true };
      throw new ExError(`Toutes les cases d'un tableau ont le même type (ici : ${[...types].map(tname).join(' et ')}).`, line);
    }
    const known = items.filter(x => x.of !== null).map(valType);
    if (!known.length) return { t: 'tableau', of: { k: 'tab', of: null }, a: items, lit: true };
    const toReal = t => (isTab(t) ? { k: 'tab', of: toReal(t.of) } : t === 'entier' ? 'réel' : t);
    for (const target of [known[0], toReal(known[0])]) {
      const rows = items.map(x => adaptArr(target, x));
      if (rows.every(Boolean)) return { t: 'tableau', of: target, a: rows, lit: true };
    }
    throw new ExError("Toutes les lignes d'un tableau à 2 dimensions ont le même type de cases.", line);
  }

  /* ---------- Interpréteur ---------- */
  class Interp {
    constructor(prog, io, opts) {
      this.fns = prog.fns;
      this.consts = prog.consts || [];
      this.globals = new Map();
      this.io = io;
      this.steps = 0;
      this.depth = 0;
      this.traceOn = !!(opts && opts.trace);
      this.trace = null;
      this.traceVars = [];
    }

    tick(line) {
      if (this.io.aborted) throw new ExError('Exécution arrêtée.', line);
      if (++this.steps > 300000) throw new ExError("Le programme tourne depuis trop longtemps : boucle infinie ? Vérifie que la condition d'arrêt finit par devenir fausse (la variable testée change-t-elle dans la boucle ?).", line);
    }

    rec(s, fr) {
      if (!this.traceOn || fr.depth !== 0) return;
      this.trace.rows.push({
        line: s.line,
        vals: this.traceVars.map(n => {
          const b = fr.vars.get(n);
          return b && b.v !== undefined ? fmtTrace(b.v) : '/';
        })
      });
    }

    async initConsts() {
      for (const s of this.consts) {
        if (this.globals.has(s.name)) throw new ExError(`La constante « ${s.name} » est déjà déclarée.`, s.line);
        const val = await this.val(s.e, { vars: new Map(), depth: 0 });
        this.globals.set(s.name, { type: s.type, v: this.coerce(s.type, val, s.line, `la constante « ${s.name} »`), isConst: true });
      }
    }

    lookup(fr, name, line) {
      const b = fr.vars.get(name) || this.globals.get(name);
      if (!b) {
        const alt = [...fr.vars.keys()].find(k => k.toLowerCase() === name.toLowerCase());
        throw new ExError(alt
          ? `La variable « ${name} » n'existe pas. Voulais-tu écrire « ${alt} » ? (les majuscules comptent)`
          : `La variable « ${name} » n'est pas déclarée. Il faut écrire « Var ${name} : type » avant de l'utiliser.`, line);
      }
      return b;
    }

    coerce(type, val, line, ctx) {
      const Ctx = ctx[0].toUpperCase() + ctx.slice(1);
      if (isTab(type)) {
        const r = adaptArr(type, val);
        if (r) return r;
        throw new ExError(`${Ctx} est de type ${tname(type)}, mais la valeur donnée est ${val.t === 'tableau' ? `un ${tname(valType(val))}` : `de type ${tname(val.t)}`}.`, line);
      }
      if (val.t === type) return val;
      if (type === 'réel' && val.t === 'entier') return { t: 'réel', v: val.v };
      if (type === 'entier' && val.t === 'réel') {
        throw new ExError(`Impossible de ranger un réel dans ${ctx} (type entier) : on perdrait la partie décimale. Utilise la conversion explicite : (entier)valeur.`, line);
      }
      if (val.t === 'tableau') throw new ExError(`${Ctx} est de type ${tname(type)}, mais la valeur donnée est un tableau. Pour une case, écris t[i].`, line);
      throw new ExError(`${Ctx} est de type ${tname(type)}, mais la valeur donnée est de type ${tname(val.t)}.`, line);
    }

    // Crée un tableau aux cases vides à partir des tailles déclarées (une ou deux dimensions)
    async makeArray(type, sizes, fr, name, line) {
      const ns = [];
      for (const e of sizes) {
        let v;
        try {
          v = await this.val(e, fr);
        } catch (err) {
          if (err instanceof ExError) throw new ExError(`Taille du tableau « ${name} » : ${err.message} Déclare le tableau une fois sa taille connue.`, line);
          throw err;
        }
        if (v.t !== 'entier') throw new ExError(`La taille du tableau « ${name} » doit être un entier (c'est un ${tname(v.t)}).`, line);
        if (v.v < 0) throw new ExError(`La taille du tableau « ${name} » ne peut pas être négative (${v.v}).`, line);
        if (v.v > 100000) throw new ExError(`Le tableau « ${name} » est trop grand pour ce site (${v.v} cases).`, line);
        ns.push(v.v);
      }
      const build = (t, k) => ({ t: 'tableau', of: t.of, a: k < ns.length - 1 ? Array.from({ length: ns[k] }, () => build(t.of, k + 1)) : new Array(ns[k]).fill(undefined) });
      return build(type, 0);
    }

    // Suit les indices d'une case (t[i][j]) : rend le tableau qui la contient et son indice
    async locate(s, fr) {
      const b = this.lookup(fr, s.name, s.line);
      if (b.isConst) throw new ExError(`« ${s.name} » est une constante : ses cases ne peuvent pas changer.`, s.line);
      if (b.param) throw new ExError(`Le tableau « ${s.name} » est passé en mode E (entrée) : on peut lire ses cases mais pas les modifier. Pour le modifier, passe-le en mode ES.`, s.line);
      if (!isTab(b.type)) throw new ExError(`« ${s.name} » n'est pas un tableau (type ${tname(b.type)}) : on ne peut pas écrire ${s.name}[…].`, s.line);
      if (b.v === undefined) throw new ExError(`Le tableau « ${s.name} » n'existe pas encore : donne-lui une taille à sa déclaration (Var ${s.name} : tableau de 10 entiers) ou range-lui un tableau (${s.name} ← …).`, s.line);
      let arr = b.v, text = s.name;
      for (let k = 0; k < s.idx.length; k++) {
        const iv = await this.val(s.idx[k], fr);
        const i = this.checkIndex(arr, iv, text, s.line);
        if (k === s.idx.length - 1) return { arr, i, text: `${text}[${i}]` };
        const next = arr.a[i];
        text += `[${i}]`;
        if (next === undefined) throw new ExError(`La case ${text} n'a pas encore de valeur.`, s.line);
        if (next.t !== 'tableau') throw new ExError(`${text} est une case, pas un tableau : un indice de trop.`, s.line);
        arr = next;
      }
      return null;
    }

    checkIndex(arr, iv, text, line) {
      if (iv.t !== 'entier') throw new ExError(`L'indice d'un tableau est un entier, pas un ${tname(iv.t)} (dans ${text}[…]).`, line);
      const n = arr.a.length;
      if (iv.v < 0 || iv.v >= n) {
        throw new ExError(n === 0
          ? `Indice ${iv.v} impossible : le tableau ${text} est vide (taille 0).`
          : `Indice ${iv.v} hors du tableau ${text} : ses indices vont de 0 à ${n - 1} (taille ${n}).`, line);
      }
      return iv.v;
    }

    async execBlock(stmts, fr) {
      for (const s of stmts) {
        const r = await this.exec(s, fr);
        if (r) return r;
      }
      return null;
    }

    async exec(s, fr) {
      this.tick(s.line);
      switch (s.k) {
        case 'var': {
          for (const name of s.names) {
            if (fr.vars.has(name)) throw new ExError(`La variable « ${name} » est déjà déclarée.`, s.line);
            const v = s.sizes ? await this.makeArray(s.type, s.sizes, fr, name, s.line) : undefined;
            fr.vars.set(name, { type: s.type, v });
          }
          this.rec(s, fr);
          return null;
        }
        case 'const': {
          if (fr.vars.has(s.name)) throw new ExError(`« ${s.name} » est déjà déclaré.`, s.line);
          const val = await this.val(s.e, fr);
          fr.vars.set(s.name, { type: s.type, v: this.coerce(s.type, val, s.line, `la constante « ${s.name} »`), isConst: true });
          this.rec(s, fr);
          return null;
        }
        case 'affirmer': {
          const v = await this.val(s.e, fr);
          if (v.t !== 'booléen') throw new ExError(`Affirmer attend une condition (vrai ou faux), mais « ${s.text} » est un ${tname(v.t)}.`, s.line);
          this.rec(s, fr);
          if (!v.v) throw new ExError(`Affirmation fausse : « ${s.text} » devrait valoir vrai.`, s.line);
          return null;
        }
        case 'for': {
          const b = this.lookup(fr, s.v, s.line);
          if (b.isConst) throw new ExError(`« ${s.v} » est une constante : elle ne peut pas servir de variable de boucle.`, s.line);
          if (b.param) throw new ExError(`Le paramètre « ${s.v} » (mode E) ne peut pas servir de variable de boucle : utilise une variable locale.`, s.line);
          if (b.type !== 'entier') throw new ExError(`La variable de boucle « ${s.v} » doit être un entier (elle est de type ${tname(b.type)}).`, s.line);
          const a = await this.val(s.from, fr), z = await this.val(s.to, fr);
          const st = s.step ? await this.val(s.step, fr) : { t: 'entier', v: 1 };
          for (const [x, nm] of [[a, 'début'], [z, 'fin'], [st, 'pas']]) {
            if (x.t !== 'entier') throw new ExError(`La valeur de ${nm} d'un Pour doit être un entier (c'est un ${tname(x.t)}).`, s.line);
          }
          if (st.v === 0) throw new ExError('Le pas d\'un Pour ne peut pas être 0 : la boucle ne finirait jamais.', s.line);
          b.v = { t: 'entier', v: a.v };
          for (;;) {
            this.tick(s.line);
            this.rec(s, fr);
            const cur = b.v.v;
            if (st.v > 0 ? cur > z.v : cur < z.v) break;
            const r = await this.execBlock(s.body, fr);
            if (r) return r;
            b.v = { t: 'entier', v: b.v.v + st.v };
          }
          return null;
        }
        case 'while': {
          for (;;) {
            this.tick(s.line);
            const c = await this.val(s.cond, fr);
            if (c.t !== 'booléen') throw new ExError(`La condition d'un Tant Que doit être un booléen (vrai ou faux), mais c'est un ${tname(c.t)}.`, s.line);
            this.rec(s, fr);
            if (!c.v) return null;
            const r = await this.execBlock(s.body, fr);
            if (r) return r;
          }
        }
        case 'dowhile': {
          for (;;) {
            this.tick(s.line);
            const r = await this.execBlock(s.body, fr);
            if (r) return r;
            const c = await this.val(s.cond, fr);
            if (c.t !== 'booléen') throw new ExError(`La condition d'un Tant Que doit être un booléen (vrai ou faux), mais c'est un ${tname(c.t)}.`, s.condLine);
            this.rec({ line: s.condLine }, fr);
            if (!c.v) return null;
          }
        }
        case 'switch': {
          this.rec(s, fr);
          for (const cs of s.cases) {
            const c = await this.val(cs.cond, fr);
            if (c.t !== 'booléen') throw new ExError(`Chaque cas d'un Selon Que est une condition (vrai ou faux), mais celle-ci est un ${tname(c.t)}.`, cs.line);
            this.rec(cs, fr);
            if (c.v) return this.execBlock(cs.body, fr);
          }
          return s.other ? this.execBlock(s.other, fr) : null;
        }
        case 'assign': {
          const b = this.lookup(fr, s.name, s.line);
          if (b.isConst) throw new ExError(`« ${s.name} » est une constante : sa valeur ne peut plus changer après sa déclaration.`, s.line);
          if (b.param) throw new ExError(`Il est interdit de modifier un paramètre passé en entrée (E) : « ${s.name} ». Recopie-le d'abord dans une variable locale.`, s.line);
          const val = await this.val(s.e, fr);
          b.v = this.coerce(b.type, val, s.line, `la variable « ${s.name} »`);
          this.rec(s, fr);
          return null;
        }
        case 'incr': {
          const b = this.lookup(fr, s.name, s.line);
          if (b.isConst) throw new ExError(`« ${s.name} » est une constante : sa valeur ne peut plus changer.`, s.line);
          if (b.param) throw new ExError(`Il est interdit de modifier un paramètre passé en entrée (E) : « ${s.name} ».`, s.line);
          if (b.v === undefined) throw new ExError(`La variable « ${s.name} » n'a pas encore de valeur : initialise-la avant de l'incrémenter.`, s.line);
          if (b.type !== 'entier' && b.type !== 'réel') throw new ExError(`On ne peut pas utiliser ++ ou -- sur une variable de type ${tname(b.type)}.`, s.line);
          b.v = { t: b.type, v: b.v.v + s.d };
          this.rec(s, fr);
          return null;
        }
        case 'assignIdx': {
          const loc = await this.locate(s, fr);
          const val = await this.val(s.e, fr);
          loc.arr.a[loc.i] = this.coerce(loc.arr.of, val, s.line, `la case ${loc.text}`);
          this.rec(s, fr);
          return null;
        }
        case 'incrIdx': {
          const loc = await this.locate(s, fr);
          const cur = loc.arr.a[loc.i];
          if (cur === undefined) throw new ExError(`La case ${loc.text} n'a pas encore de valeur : initialise-la avant de l'incrémenter.`, s.line);
          if (cur.t !== 'entier' && cur.t !== 'réel') throw new ExError(`On ne peut pas utiliser ++ ou -- sur une case de type ${tname(valType(cur))}.`, s.line);
          loc.arr.a[loc.i] = { t: cur.t, v: cur.v + s.d };
          this.rec(s, fr);
          return null;
        }
        case 'callstmt': {
          await this.eval(s.e, fr);
          this.rec(s, fr);
          return null;
        }
        case 'ret': {
          let value;
          if (s.e) value = await this.val(s.e, fr);
          this.rec(s, fr);
          return { value };
        }
        case 'if': {
          const c = await this.val(s.cond, fr);
          if (c.t !== 'booléen') throw new ExError(`La condition d'un Si doit être un booléen (vrai ou faux), mais c'est un ${tname(c.t)}.`, s.line);
          this.rec(s, fr);
          const branch = c.v ? s.then : s.else;
          return branch ? this.execBlock(branch, fr) : null;
        }
        default:
          throw new ExError('Instruction inconnue.', s.line);
      }
    }

    async val(e, fr) {
      const v = await this.eval(e, fr);
      if (v === undefined) {
        throw new ExError(`La fonction « ${e.name} » ne retourne rien : on ne peut pas utiliser son résultat.`, e.line);
      }
      return v;
    }

    async eval(e, fr) {
      switch (e.k) {
        case 'num': return { t: e.t, v: e.v };
        case 'str': return { t: 'chaîne', v: e.v };
        case 'chr': return { t: 'caractère', v: e.v };
        case 'bool': return { t: 'booléen', v: e.v };
        case 'id': {
          const b = this.lookup(fr, e.name, e.line);
          if (b.v === undefined) throw new ExError(`La variable « ${e.name} » n'a pas encore de valeur : il faut l'initialiser (${e.name} ← …) avant de l'utiliser.`, e.line);
          return b.v;
        }
        case 'un': {
          const v = await this.val(e.e, fr);
          if (e.op === 'neg') {
            if (v.t !== 'entier' && v.t !== 'réel') throw new ExError(`Le signe « - » ne s'applique qu'à un nombre, pas à un ${tname(v.t)}.`, e.line);
            return { t: v.t, v: -v.v };
          }
          if (v.t !== 'booléen') throw new ExError(`« non » s'applique à un booléen, pas à un ${tname(v.t)}.`, e.line);
          return { t: 'booléen', v: !v.v };
        }
        case 'bin': return this.binary(e, fr);
        case 'cast': return this.cast(e, fr);
        case 'call': return this.call(e, fr);
        case 'idx': {
          const arr = await this.val(e.e, fr);
          const text = exprText(e.e);
          if (arr.t !== 'tableau') throw new ExError(`« ${text} » n'est pas un tableau (c'est un ${tname(arr.t)}) : on ne peut pas écrire ${text}[…].`, e.line);
          const i = this.checkIndex(arr, await this.val(e.i, fr), text, e.line);
          const v = arr.a[i];
          if (v === undefined) throw new ExError(`La case ${text}[${i}] n'a pas encore de valeur : il faut la remplir avant de la lire.`, e.line);
          return v;
        }
        case 'len': {
          const arr = await this.val(e.e, fr);
          if (arr.t !== 'tableau') throw new ExError(`« .taille » s'applique à un tableau, mais « ${exprText(e.e)} » est un ${tname(arr.t)}.`, e.line);
          return { t: 'entier', v: arr.a.length };
        }
        case 'arr': {
          const a = [];
          for (const it of e.items) a.push(await this.val(it, fr));
          return arrayLiteral(a, e.line);
        }
        default: throw new ExError('Expression inconnue.', e.line);
      }
    }

    async binary(e, fr) {
      if (e.op === 'et' || e.op === 'ou') {
        const a = await this.val(e.l, fr);
        if (a.t !== 'booléen') throw new ExError(`« ${e.op} » s'applique à des booléens, pas à un ${tname(a.t)}.`, e.line);
        if (e.op === 'et' && !a.v) return { t: 'booléen', v: false };
        if (e.op === 'ou' && a.v) return { t: 'booléen', v: true };
        const b = await this.val(e.r, fr);
        if (b.t !== 'booléen') throw new ExError(`« ${e.op} » s'applique à des booléens, pas à un ${tname(b.t)}.`, e.line);
        return { t: 'booléen', v: b.v };
      }
      const a = await this.val(e.l, fr);
      const b = await this.val(e.r, fr);
      if (['==', '!=', '<', '<=', '>', '>='].includes(e.op)) return this.compare(e.op, a, b, e.line);
      return this.arith(e.op, a, b, e.line);
    }

    arith(op, a, b, line) {
      if (op === '+' && (a.t === 'chaîne' || b.t === 'chaîne')) return { t: 'chaîne', v: toText(a) + toText(b) };
      const num = x => x.t === 'entier' || x.t === 'réel';
      if (!num(a) || !num(b)) {
        throw new ExError(`L'opération « ${op} » n'est pas possible entre un ${tname(a.t)} et un ${tname(b.t)}.` +
          (op === '+' ? ' Pour assembler du texte, commence par un texte entre guillemets : "a = " + valeur.' : ''), line);
      }
      if (a.t === 'entier' && b.t === 'entier') {
        switch (op) {
          case '+': return { t: 'entier', v: a.v + b.v };
          case '-': return { t: 'entier', v: a.v - b.v };
          case '*': return { t: 'entier', v: a.v * b.v };
          case '/':
            if (b.v === 0) throw new ExError('Division par zéro.', line);
            return { t: 'entier', v: Math.trunc(a.v / b.v) };
          case '%':
            if (b.v === 0) throw new ExError('Modulo par zéro.', line);
            return { t: 'entier', v: a.v % b.v };
        }
      }
      switch (op) {
        case '+': return { t: 'réel', v: a.v + b.v };
        case '-': return { t: 'réel', v: a.v - b.v };
        case '*': return { t: 'réel', v: a.v * b.v };
        case '/':
          if (b.v === 0) throw new ExError('Division par zéro.', line);
          return { t: 'réel', v: a.v / b.v };
        case '%':
          if (b.v === 0) throw new ExError('Modulo par zéro.', line);
          return { t: 'réel', v: a.v % b.v };
      }
      throw new ExError('Opération inconnue.', line);
    }

    compare(op, a, b, line) {
      if (a.t === 'tableau' || b.t === 'tableau') {
        throw new ExError(a.t === b.t
          ? `On ne peut pas comparer deux tableaux avec « ${op} » : il faut comparer leurs cases une par une.`
          : `On ne peut pas comparer un tableau avec une valeur seule : pour une case, écris t[i].`, line);
      }
      const isNum = x => x.t === 'entier' || x.t === 'réel';
      let ca, cb, tol = false;
      if (isNum(a) && isNum(b)) {
        ca = a.v; cb = b.v;
        tol = a.t === 'réel' || b.t === 'réel';
      } else if (a.t === b.t && ['caractère', 'booléen', 'chaîne'].includes(a.t)) {
        if (a.t === 'booléen' && op !== '==' && op !== '!=') throw new ExError("Les booléens se comparent seulement avec « == » et « != ».", line);
        ca = a.t === 'caractère' ? a.v.codePointAt(0) : a.t === 'booléen' ? (a.v ? 1 : 0) : a.v;
        cb = b.t === 'caractère' ? b.v.codePointAt(0) : b.t === 'booléen' ? (b.v ? 1 : 0) : b.v;
      } else {
        throw new ExError(`On ne peut pas comparer un ${tname(a.t)} avec un ${tname(b.t)}.`, line);
      }
      const eq = tol ? Math.abs(ca - cb) < 1e-9 : ca === cb;
      let r;
      switch (op) {
        case '==': r = eq; break;
        case '!=': r = !eq; break;
        case '<': r = ca < cb && !eq; break;
        case '<=': r = ca < cb || eq; break;
        case '>': r = ca > cb && !eq; break;
        case '>=': r = ca > cb || eq; break;
      }
      return { t: 'booléen', v: r };
    }

    async cast(e, fr) {
      const v = await this.val(e.e, fr);
      const num = v.t === 'entier' || v.t === 'réel';
      switch (e.type) {
        case 'entier':
          if (v.t === 'entier') return v;
          if (v.t === 'réel') return { t: 'entier', v: Math.trunc(v.v) };
          if (v.t === 'caractère') return { t: 'entier', v: v.v.codePointAt(0) };
          break;
        case 'réel':
          if (num) return { t: 'réel', v: v.v };
          break;
        case 'caractère':
          if (v.t === 'caractère') return v;
          if (v.t === 'entier') return { t: 'caractère', v: String.fromCodePoint(v.v) };
          break;
        case 'booléen':
          if (v.t === 'booléen') return v;
          break;
      }
      throw new ExError(`Impossible de convertir un ${tname(v.t)} en ${e.type}.`, e.line);
    }

    async call(e, fr) {
      const args = [];
      for (const a of e.args) args.push(await this.val(a, fr));
      const key = strip(e.name);
      if (BUILTIN_KEYS.has(key)) return this.builtin(key, args, e);
      const fn = this.fns.get(e.name);
      let refs = null;
      if (fn && args.length === fn.params.length) {
        fn.params.forEach((p, i) => {
          if (p.mode !== 'ES') return;
          const a = e.args[i];
          if (a.k !== 'id') throw new ExError(`Le paramètre « ${p.name} » de ${fn.name} est en mode ES : l'argument doit être une variable (pas une valeur ou un calcul).`, e.line);
          const b = this.lookup(fr, a.name, e.line);
          if (b.isConst) throw new ExError(`« ${a.name} » est une constante : on ne peut pas la passer en mode ES.`, e.line);
          if (b.param) throw new ExError(`« ${a.name} » est un paramètre en mode E : on ne peut pas le passer en mode ES à ${fn.name} (il serait modifié).`, e.line);
          if (!typeEq(b.type, p.type)) throw new ExError(`Le paramètre « ${p.name} » est de type ${tname(p.type)}, mais la variable « ${a.name} » est de type ${tname(b.type)}.`, e.line);
          if (b.v === undefined && isTab(p.type)) throw new ExError(`Le tableau « ${a.name} » n'existe pas encore : donne-lui une taille à sa déclaration avant de le passer à ${fn.name}.`, e.line);
          (refs = refs || [])[i] = b;
        });
      }
      if (!fn) {
        const alt = [...this.fns.keys()].find(k => k.toLowerCase() === e.name.toLowerCase());
        throw new ExError(alt
          ? `La fonction « ${e.name} » n'existe pas. Voulais-tu écrire « ${alt} » ? (les majuscules comptent)`
          : `La fonction « ${e.name} » n'est pas définie.`, e.line);
      }
      return this.callUser(fn, args, e.line, refs);
    }

    async callUser(fn, args, line, refs) {
      if (this.depth >= 150) throw new ExError('Trop d’appels de fonctions imbriqués (récursion infinie ?).', line);
      if (args.length !== fn.params.length) {
        throw new ExError(`La fonction « ${fn.name} » attend ${fn.params.length} argument${fn.params.length > 1 ? 's' : ''}, mais en reçoit ${args.length}.`, line);
      }
      this.depth++;
      const fr = { vars: new Map(), depth: this.depth };
      try {
        fn.params.forEach((p, i) => {
          if (refs && refs[i]) { fr.vars.set(p.name, refs[i]); return; }
          if (p.mode === 'ES') throw new ExError(`Le paramètre « ${p.name} » est en mode ES : il faut lui passer une variable.`, line);
          fr.vars.set(p.name, { type: p.type, v: this.coerce(p.type, args[i], line, `le paramètre « ${p.name} » de ${fn.name}`), param: true });
        });
        const r = await this.execBlock(fn.body, fr);
        if (r && r.value !== undefined) {
          if (!fn.ret) throw new ExError(`La fonction « ${fn.name} » ne retourne rien (pas de type de retour dans sa signature), mais elle exécute « Retourner valeur ».`, line);
          return this.coerce(fn.ret, r.value, line, `le résultat de ${fn.name}`);
        }
        if (fn.ret) {
          throw new ExError(`La fonction « ${fn.name} » doit retourner un ${tname(fn.ret)}, mais aucun « Retourner valeur » n'a été exécuté.`, line);
        }
        return undefined;
      } finally {
        this.depth--;
      }
    }

    need(name, args, types, line) {
      if (args.length !== types.length) {
        throw new ExError(`${name} attend ${types.length} argument${types.length > 1 ? 's' : ''}, mais en reçoit ${args.length}.`, line);
      }
      args.forEach((a, i) => {
        const ok = a.t === types[i] || (types[i] === 'réel' && a.t === 'entier');
        if (!ok) throw new ExError(`${name} : l'argument ${i + 1} doit être de type ${types[i]}, pas ${tname(a.t)}.`, line);
      });
    }

    async builtin(key, args, e) {
      const line = e.line;
      switch (key) {
        case 'ecrire':
          if (args.length !== 1) throw new ExError('ecrire attend exactement 1 argument : ecrire("a = " + a).', line);
          this.io.write(toText(args[0]));
          return undefined;
        case 'ecrireligne':
          if (args.length > 1) throw new ExError('ecrireLigne attend 0 ou 1 argument.', line);
          this.io.write((args.length ? toText(args[0]) : '') + '\n');
          return undefined;
        case 'lireentier':
        case 'lirereel':
        case 'lirecaractere': {
          if (args.length) throw new ExError(`${e.name} n'a pas d'argument : ${e.name}().`, line);
          for (;;) {
            const raw = String(await this.io.read(key === 'lireentier' ? 'entier' : key === 'lirereel' ? 'réel' : 'caractère')).trim();
            if (key === 'lireentier') {
              if (/^[+-]?\d+$/.test(raw)) return { t: 'entier', v: parseInt(raw, 10) };
              this.io.write('(saisie invalide : un entier est attendu)\n');
            } else if (key === 'lirereel') {
              const s = raw.replace(',', '.');
              if (/^[+-]?\d+(\.\d+)?$/.test(s)) return { t: 'réel', v: parseFloat(s) };
              this.io.write('(saisie invalide : un réel est attendu)\n');
            } else {
              const ch = [...raw][0];
              if (ch !== undefined) return { t: 'caractère', v: ch };
              this.io.write('(saisie invalide : tape un caractère)\n');
            }
          }
        }
        case 'entieraleatoire': {
          this.need('entierAléatoire', args, ['entier', 'entier'], line);
          if (args[1].v <= args[0].v) throw new ExError('entierAléatoire(min, max) : max (exclu) doit être strictement supérieur à min.', line);
          const r = this.io.rand ? this.io.rand(args[0].v, args[1].v) : args[0].v + Math.floor(Math.random() * (args[1].v - args[0].v));
          return { t: 'entier', v: r };
        }
        case 'valeuraleatoire': {
          if (args.length) throw new ExError("valeurAléatoire n'a pas d'argument : valeurAléatoire().", line);
          const r = this.io.rand ? this.io.rand(-1000, 1000) : -1000 + Math.floor(Math.random() * 2000);
          return { t: 'entier', v: r };
        }
        case 'formaterreel': {
          this.need('formaterReel', args, ['réel', 'entier'], line);
          const n = args[1].v;
          if (n < 0 || n > 10) throw new ExError('formaterReel(x, n) : n (le nombre de chiffres après la virgule) va de 0 à 10.', line);
          const p = Math.pow(10, n), x = args[0].v;
          const r = Math.round(Math.abs(x) * p + 1e-7) / p * (x < 0 ? -1 : 1);
          return { t: 'chaîne', v: r.toFixed(n).replace('.', ',') };
        }
        case 'affichecar': {
          this.need('afficheCar', args, ['caractère', 'entier'], line);
          if (args[1].v < 0) throw new ExError('afficheCar : le nombre de répétitions ne peut pas être négatif.', line);
          this.io.write(args[0].v.repeat(args[1].v));
          return undefined;
        }
        case 'afficheligne': {
          this.need('afficheLigne', args, ['caractère', 'entier', 'entier'], line);
          if (args[1].v < 1) throw new ExError('afficheLigne : la position de départ (min) commence à 1.', line);
          if (args[2].v < 0) throw new ExError('afficheLigne : la taille ne peut pas être négative.', line);
          this.io.write(' '.repeat(args[1].v - 1) + args[0].v.repeat(args[2].v) + '\n');
          return undefined;
        }
      }
      throw new ExError('Fonction fournie inconnue.', line);
    }
  }

  /* ---------- API ---------- */
  function compile(src) {
    const p = new Parser(splitLines(src));
    p.parseProgram();
    return { fns: p.fns, top: p.top, consts: p.consts, src };
  }

  function topVars(top) {
    const out = [];
    top.forEach(s => { if (s.k === 'var') s.names.forEach(n => out.push(n)); });
    return out;
  }

  async function run(prog, io, opts) {
    const it = new Interp(prog, io, opts || {});
    if (it.traceOn) {
      it.traceVars = topVars(prog.top);
      it.trace = { vars: it.traceVars, rows: [] };
    }
    await it.initConsts();
    await it.execBlock(prog.top, { vars: new Map(), depth: 0 });
    return { trace: it.trace };
  }

  const NO_IO = {
    write() {},
    read() { return Promise.reject(new ExError("Cette expression ne peut pas lire au clavier.")); }
  };

  async function evalExpression(text) {
    const lines = splitLines(text);
    const toks = lines.flatMap(l => l.toks);
    const parser = new Parser([]);
    const cur = new Cur(toks, 1);
    const expr = parser.parseExpr(cur);
    if (!cur.eof()) throw new ExError(`Il y a quelque chose en trop : « ${tokText(cur.peek())} ».`, 1);
    const it = new Interp({ fns: new Map() }, NO_IO, {});
    return it.val(expr, { vars: new Map(), depth: 0 });
  }

  // Appelle une fonction avec des arguments écrits en texte ("3", "[1, 2]"…). Un paramètre ES reçoit
  // une variable neuve ; outRefs (facultatif) récupère ces variables pour lire leur valeur après l'appel.
  async function call(prog, name, argLiterals, io, outRefs) {
    const fn = prog.fns.get(name);
    if (!fn) throw new ExError(`La fonction « ${name} » n'est pas définie dans ton code.`);
    const args = [];
    for (const lit of argLiterals) args.push(await evalExpression(lit));
    const it = new Interp(prog, io, {});
    await it.initConsts();
    let refs = null;
    if (args.length === fn.params.length) {
      fn.params.forEach((p, i) => {
        if (p.mode !== 'ES') return;
        (refs = refs || [])[i] = { type: p.type, v: it.coerce(p.type, args[i], fn.line, `le paramètre « ${p.name} » de ${fn.name}`) };
        if (outRefs) outRefs[i] = refs[i];
      });
    }
    return it.callUser(fn, args, fn.line, refs);
  }

  function queueIO(lines, rands) {
    const q = (lines || []).slice();
    const rq = rands ? rands.slice() : null;
    return {
      out: '',
      aborted: false,
      randCalls: [],
      rand: rq ? function (min, max) { this.randCalls.push([min, max]); return rq.length ? rq.shift() : min; } : null,
      write(s) { this.out += s; },
      read() {
        if (!q.length) return Promise.reject(new ExError("Le programme attend une saisie au clavier, mais aucune n'est prévue ici."));
        return Promise.resolve(q.shift());
      }
    };
  }

  async function traceProgram(src, stdin, rands) {
    const prog = compile(src);
    const io = queueIO(stdin, rands);
    const r = await run(prog, io, { trace: true });
    return r.trace;
  }

  return { compile, run, call, evalExpression, queueIO, traceProgram, ExError, toText, describe, valuesEqual, fmtTrace, strip, typeName };
})();

def('GestionNotesDDE', 'ddeAAbsence', `Fonction ddeAAbsence(E absences : ${B2}, E etudiant : entier) : booléen

    solution: { ex: `Fonction auMoinsUneAbsence(E absences : tableau de booléens à 2 dimensions) : booléen
Var trouve : booléen
    i, j : entier
Début
    trouve ← faux
    i ← 0
    Tant Que non trouve et i < absences.taille Faire
        j ← 0
        Tant Que non trouve et j < absences[i].taille Faire
            Si absences[i][j] Alors
                trouve ← vrai
            Sinon
                j ← j + 1
        i ← i + 1
    Retourner trouve

    boolean trouve = false;
    int i = 0;
    while (!trouve && i < absences.length) {
        int j = 0;
        while (!trouve && j < absences[i].length) {
            if (absences[i][j]) {
                trouve = true;

            }
        }
        i = i + 1;
    }

Fin

Fonction afficherMemesMoyennes(E moyennes : tableau de réels à 2 dimensions)
Var i, j, nb : entier
Début
    nb ← 0
    Pour i de 0 à moyennes.taille - 1 Faire
        Pour j de i + 1 à moyennes.taille - 1 Faire
            Si moyenneEtudiant(moyennes, i) == moyenneEtudiant(moyennes, j) Alors
                ecrireLigne("Les étudiants numéro " + (i + 1) + " et " + (j + 1) + " ont la même moyenne : " + formaterReel(moyenneEtudiant(moyennes, i), 2))

    }
    return somme / moyennes[e].length;
}

static void afficherMemesMoyennes(double[][] moyennes) {
    int nb = 0;
    for (int i = 0; i < moyennes.length; i++) {
        for (int j = i + 1; j < moyennes.length; j++) {

                        + " ont la même moyenne : " + String.format("%.2f", moyenneEtudiant(moyennes, i)));
                nb++;
            }
        }

/* runner.js */
/* Exécution des exercices : tests de code, questions « que vaut ? », traces */
function createRunner(Exalgo, REF, REF_ORDER, REF_CONSTS) {
  const normOut = s => String(s).split('\n').map(l => l.replace(/\s+$/, '')).join('\n').replace(/\n+$/, '');

  async function buildProgram(def, userCode) {
    const user = Exalgo.compile(userCode);
    if (!def.env) return user;
    const have = new Set((user.consts || []).map(k => k.name));
    const consts = (REF_CONSTS || []).filter(l => !have.has(l.split(/\s+/)[1])).join('\n');
    const missing = REF_ORDER.filter(n => !user.fns.has(n)).map(n => REF[n]).join('\n\n');
    return (missing || consts) ? Exalgo.compile(userCode + '\n\n' + consts + '\n\n' + missing) : user;
  }

  function labelOf(t) {
    const base = t.script ? 'Programme complet' : `${t.call}(${(t.args || []).join(', ')})`;
    return t.stdin && t.stdin.length ? `${base}, saisie : ${t.stdin.join(' puis ')}` : base;
  }

  async function runOne(prog, t) {
    const io = Exalgo.queueIO(t.stdin || [], t.rand);
    const label = labelOf(t);
    let value, error;
    const refs = [];
    try {
      if (t.script) await Exalgo.run(prog, io);
      else value = await Exalgo.call(prog, t.call, t.args || [], io, refs);
    } catch (e) {
      error = e;
    }
    if (error) {
      const where = error.line ? `ligne ${error.line} : ` : '';
      return { ok: false, label, detail: where + error.message };
    }
    const problems = [];
    if ('expect' in t) {
      const exp = await Exalgo.evalExpression(t.expect);
      if (!Exalgo.valuesEqual(value, exp)) problems.push(`résultat attendu : ${Exalgo.describe(exp)}, obtenu : ${Exalgo.describe(value)}`);
    }
    if ('out' in t && normOut(io.out) !== normOut(t.out)) {
      problems.push(`affichage attendu :\n${t.out || '(rien)'}\naffichage obtenu :\n${io.out || '(rien)'}`);
    }
    (t.outHas || []).forEach(s => {
      if (!io.out.toLowerCase().includes(s.toLowerCase())) problems.push(`l'affichage devrait contenir « ${s} »`);
    });
    (t.outNot || []).forEach(s => {
      if (io.out.toLowerCase().includes(s.toLowerCase())) problems.push(`l'affichage ne devrait pas contenir « ${s} »`);
    });
    if (t.outNonEmpty && !io.out.trim()) problems.push("rien n'est affiché : la fonction doit afficher un message");
    // Tableau passé en mode ES : son contenu après l'appel (prefix : seules les premières cases comptent)
    for (const x of t.esAfter || []) {
      const exp = await Exalgo.evalExpression(x.expect);
      const b = refs[x.i];
      let got = b ? b.v : undefined;
      if (got && x.prefix && got.t === 'tableau') got = { t: 'tableau', of: got.of, a: got.a.slice(0, exp.a.length) };
      if (!Exalgo.valuesEqual(got, exp)) {
        const nom = (prog.fns.get(t.call) || { params: [] }).params[x.i];
        problems.push(`après l'appel, ${nom ? `« ${nom.name} »` : `l'argument ${x.i + 1}`} devrait ${x.prefix ? 'commencer par' : 'valoir'} ${Exalgo.describe(exp)}, obtenu : ${got ? Exalgo.describe(got) : '(rien)'}`);
      }
    }
    // Bornes des tirages aléatoires (min inclus, max exclu)
    (t.randCalls || []).forEach((r, k) => {
      const g = io.randCalls[k];
      if (!g) problems.push(`il manque un tirage aléatoire : entierAléatoire(${r[0]}, ${r[1]}) attendu`);
      else if (g[0] !== r[0] || g[1] !== r[1]) problems.push(`tirage n°${k + 1} : entierAléatoire(${r[0]}, ${r[1]}) attendu, obtenu entierAléatoire(${g[0]}, ${g[1]}) (rappel : la borne max est exclue)`);
    });
    return { ok: problems.length === 0, label, detail: problems.join(' ; ') };
  }

  async function runCodeExercise(def, userCode) {
    let prog;
    try {
      prog = await buildProgram(def, userCode);
    } catch (e) {
      return { fatal: e };
    }
    const results = [];
    (def.srcChecks || []).forEach(ch => {
      const n = (userCode.match(new RegExp(ch.re, 'gim')) || []).length;
      results.push({ ok: n >= (ch.min || 1), label: ch.label || 'Contenu du code', detail: n >= (ch.min || 1) ? '' : ch.msg });
    });
    for (const t of def.tests) results.push(await runOne(prog, t));
    return { results };
  }

  /* --- « Que vaut ? » --- */
  async function checkValue(def, answer) {
    const exp = await Exalgo.evalExpression(def.expr);
    const a = String(answer).trim().toLowerCase();
    const shown = Exalgo.describe(exp);
    if (def.kind === 'booléen') {
      return { ok: (a === 'vrai') === exp.v && (a === 'vrai' || a === 'faux'), expected: shown };
    }
    if (def.kind === 'caractère') {
      const ch = a.replace(/^'(.*)'$/, '$1');
      return { ok: ch === String(exp.v).toLowerCase(), expected: shown };
    }
    const n = parseFloat(a.replace(',', '.'));
    if (!/^[+-]?\d+([.,]\d+)?$/.test(a)) return { ok: false, expected: shown, format: true };
    if (def.kind === 'entier' && /[.,]/.test(a)) return { ok: false, expected: shown, format: 'entier' };
    return { ok: Math.abs(n - exp.v) < 1e-9, expected: shown };
  }

  /* --- Traces --- */
  const normCell = s => {
    let x = String(s).trim().toLowerCase();
    if (x === '' ) return '';
    x = x.replace(/^'(.*)'$/, '$1');
    if (x[0] === '[') return x.replace(/[\s']/g, ''); // tableau : sans espaces ni apostrophes
    if (/^[+-]?\d+([.,]\d+)?$/.test(x)) return String(parseFloat(x.replace(',', '.')));
    return x;
  };
  // Trace attendue d'un exercice ; def.vars choisit les colonnes, def.rand fixe les tirages aléatoires
  async function expectedTrace(def) {
    const tr = await Exalgo.traceProgram(def.program, [], def.rand);
    if (!def.vars) return tr;
    const idx = def.vars.map(v => tr.vars.indexOf(v));
    return { vars: def.vars, rows: tr.rows.map(r => ({ line: r.line, vals: idx.map(i => r.vals[i]) })) };
  }
  function checkTrace(expected, rows) {
    const out = [];
    const n = Math.max(expected.rows.length, rows.length);
    let allOk = rows.length === expected.rows.length;
    for (let i = 0; i < n; i++) {
      const e = expected.rows[i], u = rows[i];
      if (!e) { out.push({ extra: true }); allOk = false; continue; }
      if (!u) { out.push({ missing: true }); allOk = false; continue; }
      const lineOk = String(u.line).trim() === String(e.line);
      const cells = e.vals.map((v, j) => {
        const ue = normCell(u.vals[j] === undefined ? '' : u.vals[j]);
        const ee = normCell(v);
        return ue !== '' && ue === ee;
      });
      if (!lineOk || cells.some(c => !c)) allOk = false;
      out.push({ lineOk, cells });
    }
    return { rows: out, ok: allOk };
  }

  return { runCodeExercise, checkValue, expectedTrace, checkTrace, normOut };
}
if (typeof module !== 'undefined' && module.exports) module.exports = createRunner;

/* ===== Coloration syntaxique ===== */
const EX_KW = new Set(['var', 'const', 'fonction', 'debut', 'fin', 'si', 'alors', 'sinon', 'retourner', 'et', 'ou', 'non', 'vrai', 'faux', 'pour', 'de', 'par', 'pas', 'faire', 'tant', 'que', 'selon', 'affirmer', 'tableau', 'dimensions']);
const EX_TYPES = new Set(['entier', 'entiers', 'reel', 'reels', 'caractere', 'caracteres', 'booleen', 'booleens']);
const EX_BI = new Set(['ecrire', 'ecrireligne', 'lireentier', 'lirereel', 'lirecaractere', 'affichecar', 'afficheligne', 'entieraleatoire', 'valeuraleatoire', 'formaterreel']);
function highlight(code, kw, types, builtins, opRe) {
  const re = new RegExp('(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)|("(?:[^"\\\\\\n]|\\\\.)*")|(\'(?:\\\\.|[^\'\\\\\\n])\')|(\\b\\d+(?:\\.\\d+)?\\b)|([A-Za-zÀ-ÿ_][A-Za-zÀ-ÿ0-9_]*)|(' + opRe + ')', 'g');
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const t = m[0];
    let cls = '';
    if (m[1]) cls = 'c-com';
    else if (m[2] || m[3]) cls = 'c-str';
    else if (m[4]) cls = 'c-num';
    else if (m[5]) {
      const k = Exalgo.strip(t);
      const call = code[m.index + t.length] === '(';
      if (kw.has(k) || (t === 'à' && kw === EX_KW) || ((t === 'E' || t === 'ES') && kw === EX_KW)) cls = 'c-kw';
      else if (types.has(k)) cls = 'c-type';
      else if (builtins.has(k)) cls = 'c-bi';
      else if (call) cls = 'c-fn';
    } else cls = 'c-op';
    out += cls ? `<span class="${cls}">${esc(t)}</span>` : esc(t);
    last = m.index + t.length;
  }
  return out + esc(code.slice(last));
}
const hlEx = code => highlight(code, EX_KW, EX_TYPES, EX_BI, '←|≥|≤|≠|<-|!=|==|<=|>=|\\+\\+|--');

function termHTML() {

class Term {
  constructor(root) {
    this.root = root;
    this.out = $('.term-out', root);
    this.form = $('.term-in', root);
    this.input = $('.term-input', root);
    this.status = $('.term-status', root);
    this.stopBtn = $('[data-act="term-stop"]', root);
    this.pending = null;
    this.aborted = false;
    this.form.addEventListener('submit', e => { e.preventDefault(); this.submit(); });
  }
  clear() { this.out.textContent = ''; this.setStatus('', ''); }
  setStatus(text, cls) { this.status.textContent = text; this.status.className = 'term-status ' + (cls || ''); }
  write(text, cls) {
    const s = document.createElement('span');
    if (cls) s.className = cls;
    s.textContent = text;
    this.out.appendChild(s);
    this.out.scrollTop = this.out.scrollHeight;
  }
  read(kind) {
    return new Promise((res, rej) => {
      this.pending = { res, rej };
      this.form.hidden = false;
      this.input.value = '';
      this.input.inputMode = kind === 'entier' ? 'numeric' : kind === 'réel' ? 'decimal' : 'text';
      this.input.placeholder = ({ entier: 'un entier', 'réel': 'un nombre réel', 'caractère': 'un caractère' })[kind] || '';
      this.setStatus('En attente de ta saisie…', 'wait');
      this.input.focus();
    });
  }
  submit() {
    if (!this.pending) return;
    const v = this.input.value;
    this.write(v + '\n', 't-echo');
    this.form.hidden = true;
    const p = this.pending;
    this.pending = null;
    this.setStatus('Exécution…', 'run');
    p.res(v);
  }
  abort() {
    this.aborted = true;
    if (this.pending) {

  }
  async run(code, opts) {
    opts = opts || {};
    this.aborted = false;
    this.clear();
    this.stopBtn.hidden = false;
    this.setStatus('Exécution…', 'run');
    let result = null;
    try {
      const prog = Exalgo.compile(code);
      result = await Exalgo.run(prog, this.io(), { trace: opts.trace });
      this.setStatus('Terminé.', 'ok');
    } catch (e) {
      if (e instanceof Exalgo.ExError) {
        const where = e.line ? `Erreur ligne ${e.line} : ` : 'Erreur : ';
        this.write((this.out.textContent && !this.out.textContent.endsWith('\n') ? '\n' : '') + where + e.message + '\n', 't-err');
        this.setStatus(e.message === 'Exécution arrêtée.' ? 'Arrêté.' : 'Erreur.', 'err');
        if (opts.onError) opts.onError(e);
      } else {
        this.write('Erreur interne : ' + e.message + '\n', 't-err');
        this.setStatus('Erreur.', 'err');
      }
    }
    this.form.hidden = true;
    this.stopBtn.hidden = true;

  }
}
