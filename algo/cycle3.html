    case 'val': {
      const isBool = def.kind === 'booléen';
      return `<section class="ex ex-val${done ? ' is-done' : ''}" data-ex="${id}">

  <p class="ex-fb" role="status"></p>
</section>`;
    }
    case 'code': {
      const saved = Store.data.code[id];
      return `<section class="ex ex-code-ex${done ? ' is-done' : ''}" data-ex="${id}">
  ${head('Exercice de code')}
  <h4 class="ex-title">${esc(def.title)}</h4>
  <p class="ex-q">${esc(def.prompt)}</p>
  ${editorHTML(id, saved !== undefined ? saved : def.starter)}
  <div class="ex-actions">
    <button type="button" class="btn" data-act="code-run">Vérifier mon code</button>
    <button type="button" class="btn ghost" data-act="code-hint">Indice</button>
    <button type="button" class="btn ghost" data-act="code-sol">Solution</button>

  <div class="sol" hidden>${cb({ ex: def.solution.ex, java: def.solution.java, noAtelier: false })}</div>
</section>`;
    }
    case 'trace': {
      const vars = def.vars ? def.vars.slice() : [];
      if (!def.vars) def.program.split('\n').forEach(l => {
        const m = l.match(/^\s*Var\s+([^:]+):/i);
        if (m) m[1].split(',').forEach(v => vars.push(v.trim()));
      });
      return `<section class="ex ex-trace${done ? ' is-done' : ''}" data-ex="${id}" data-vars="${esc(vars.join(','))}">
  ${head('Trace à remplir')}

  <p class="ex-q">${esc(def.prompt)}</p>

  </div>
  <div class="ex-actions">
    <button type="button" class="btn ghost" data-act="trace-add">+ Ajouter une ligne</button>
    <button type="button" class="btn ghost" data-act="trace-del">− Retirer</button>

  <p class="ex-fb" role="status"></p>
  <div class="trace-sol" hidden></div>
</section>`;
    }
  }
  return '';

function markDone(id) {
  if (!Store.data.done[id]) {
    Store.data.done[id] = 1;
    Store.save();
  }
  const sec = $(`[data-ex="${id}"]`);
  if (sec) { sec.classList.add('is-done'); const b = $('.ex-badge', sec); if (b) b.hidden = false; }
  if (window.updateProgress) window.updateProgress();
}

/* --- Délégation des clics --- */
function setFb(sec, text, cls) {
  const fb = $('.ex-fb', sec);
  if (fb) { fb.textContent = text; fb.className = 'ex-fb ' + (cls || ''); }
}

const handlers = {
  'cb-tab'(b) {
    setBlockLang(b.closest('.cb'), b.dataset.lang);
  },
  async 'cb-run'(b) {
    const fig = b.closest('.cb');
    const o = CODEREG[fig.dataset.cb];
    const term = mountTerm($('.cb-term', fig));
    await term.run(o.ex + (o.runExtra || ''));
  },
  'cb-open'(b) {
    const o = CODEREG[b.closest('.cb').dataset.cb];
    window.pendingAtelier = o.ex + (o.runExtra || '');
    location.hash = '#atelier';
  },
  async 'cb-copy'(b) {
    const fig = b.closest('.cb');
    const o = CODEREG[fig.dataset.cb];
    const visible = $('.cb-code:not([hidden])', fig);
    const text = visible && visible.dataset.lang === 'java' ? o.java : o.ex;
    const old = b.textContent;
    try {
      await navigator.clipboard.writeText(text);
      b.textContent = 'Copié ✓';
    } catch (e) {
      const r = document.createRange();
      r.selectNodeContents(visible);
      const sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
      b.textContent = 'Sélectionné';
    }
    setTimeout(() => { b.textContent = old; }, 1600);
  },
  'term-stop'() { /* géré par le terminal */ },
  'ed-ins'(b) {
    const ed = b.closest('.ex, .atelier') ? $('.ta', b.closest('.ex, .atelier')) : null;
    if (ed) editorInsert(ed, b.dataset.ins);
  },
  'qcm'(b) {
    const sec = b.closest('.ex');
    if (sec.classList.contains('is-done') && $('.choice.ok', sec)) return;
    const def = EXERCISES[sec.dataset.ex];
    const i = +b.dataset.i;
    if (i === def.answer) {
      b.classList.add('ok');
      $$('.choice', sec).forEach(c => { c.disabled = true; });
      setFb(sec, 'Exact. ' + def.why, 'ok');
      markDone(sec.dataset.ex);
    } else {
      b.classList.add('ko');
      b.disabled = true;
      setFb(sec, "Ce n'est pas celle-là. Relis le cours et essaie une autre réponse.", 'ko');
    }
  },
  async 'val-bool'(b) {
    const sec = b.closest('.ex');
    const id = sec.dataset.ex, def = EXERCISES[id];
    const r = await Runner.checkValue(def, b.dataset.v);
    if (r.ok) {
      b.classList.add('ok');
      $$('.choice', sec).forEach(c => { c.disabled = true; });
      setFb(sec, 'Exact. ' + def.why, 'ok');
      markDone(id);
    } else {
      b.classList.add('ko');
      b.disabled = true;
      setFb(sec, 'Pas tout à fait. Réfléchis encore, ou refais la table de vérité.', 'ko');
    }
  },
  'code-hint'(b) {
    const h = $('.hint', b.closest('.ex'));
    h.hidden = !h.hidden;
  },
  'code-sol'(b) {
    const s = $('.sol', b.closest('.ex'));
    s.hidden = !s.hidden;
    b.textContent = s.hidden ? 'Solution' : 'Masquer la solution';
    if (!s.hidden) applyGlobalLang(s);
  },
  'code-reset'(b) {
    const sec = b.closest('.ex');
    const def = EXERCISES[sec.dataset.ex];
    const ta = $('.ta', sec);
    ta.value = def.starter;
    ta.dispatchEvent(new Event('input', { bubbles: true }));
    delete Store.data.code[sec.dataset.ex];
    Store.save();
    $('.tests-out', sec).innerHTML = '';
  },
  async 'code-run'(b) {
    const sec = b.closest('.ex');
    const id = sec.dataset.ex, def = EXERCISES[id];
    const ed = $('.editor', sec);
    const out = $('.tests-out', sec);
    out.innerHTML = '<p class="muted">Vérification…</p>';
    const r = await Runner.runCodeExercise(def, $('.ta', ed).value);
    if (r.fatal) {
      editorMark(ed, r.fatal.line);
      out.innerHTML = `<p class="res-err"><strong>${r.fatal.line ? 'Erreur ligne ' + r.fatal.line : 'Erreur'}</strong> : ${esc(r.fatal.message)}</p>`;
      return;
    }
    const okCount = r.results.filter(x => x.ok).length;
    const all = okCount === r.results.length;
    out.innerHTML = `<p class="res-sum ${all ? 'ok' : 'ko'}">${all ? 'Bravo : ' : ''}${okCount} test${okCount > 1 ? 's' : ''} réussi${okCount > 1 ? 's' : ''} sur ${r.results.length}</p>
<ul class="res-list">${r.results.map(x => `<li class="${x.ok ? 'ok' : 'ko'}"><span class="res-mark" aria-hidden="true">${x.ok ? '✓' : '✗'}</span><div><code>${esc(x.label)}</code>${x.detail ? `<pre class="res-detail">${esc(x.detail)}</pre>` : ''}</div></li>`).join('')}</ul>`;
    if (all) markDone(id);
  },
  'trace-add'(b) { traceAddRow(b.closest('.ex')); },
  'trace-del'(b) {
    const tb = $('.trace.in tbody', b.closest('.ex'));
    if (tb.rows.length > 1) tb.deleteRow(-1);
  },
  async 'trace-check'(b) {
    const sec = b.closest('.ex');
    const id = sec.dataset.ex, def = EXERCISES[id];
    const exp = await Runner.expectedTrace(def);
    const rows = $$('.trace.in tbody tr', sec).map(tr => ({ line: $('.t-line', tr).value, vals: $$('.t-val', tr).map(i => i.value) }));
    const filled = rows.filter(r => r.line.trim() || r.vals.some(v => v.trim()));
    const res = Runner.checkTrace(exp, filled);
    $$('.trace.in tbody tr', sec).forEach(tr => tr.classList.remove('row-extra'));
    const trs = $$('.trace.in tbody tr', sec).filter(tr => $('.t-line', tr).value.trim() || $$('.t-val', tr).some(i => i.value.trim()));
    trs.forEach((tr, i) => {
      const r = res.rows[i];
      const inputs = [$('.t-line', tr), ...$$('.t-val', tr)];
      inputs.forEach(x => x.classList.remove('ok', 'ko'));
      if (!r || r.extra) { inputs.forEach(x => x.classList.add('ko')); return; }
      inputs[0].classList.add(r.lineOk ? 'ok' : 'ko');
      r.cells.forEach((c, j) => inputs[j + 1].classList.add(c ? 'ok' : 'ko'));
    });
    if (res.ok) {
      setFb(sec, 'Trace exacte. Une ligne par instruction exécutée, avec les bonnes valeurs.', 'ok');
      markDone(id);
    } else if (filled.length < exp.rows.length) {
      setFb(sec, `Il manque des lignes : une instruction exécutée n'est pas encore notée (vérifie aussi les lignes marquées en rouge).`, 'ko');
    } else if (filled.length > exp.rows.length) {
      setFb(sec, 'Il y a trop de lignes : seules les lignes réellement exécutées se notent.', 'ko');
    } else {
      setFb(sec, "Certaines cases sont fausses (en rouge). Pour une variable sans valeur, écris /.", 'ko');
    }
  },
  async 'trace-show'(b) {
    const sec = b.closest('.ex');
    const def = EXERCISES[sec.dataset.ex];
    const exp = await Runner.expectedTrace(def);
    const box = $('.trace-sol', sec);
    box.hidden = !box.hidden;
    if (!box.hidden) box.innerHTML = traceTableHTML(exp, exp.rows.length);
  }
};

function traceAddRow(sec) {
  const vars = (sec.dataset.vars || '').split(',').filter(Boolean);
  const tr = document.createElement('tr');
  tr.innerHTML = `<td><input class="t-line" inputmode="numeric" autocomplete="off" aria-label="Numéro de ligne"></td>` +
    vars.map(v => `<td><input class="t-val" autocomplete="off" aria-label="Valeur de ${esc(v)}"></td>`).join('');
  $('.trace.in tbody', sec).appendChild(tr);
}
function traceTableHTML(tr, upto) {
  return `<div class="trace-wrap"><table class="trace"><thead><tr><th scope="col">Ligne</th>${tr.vars.map(v => `<th scope="col"><code>${esc(v)}</code></th>`).join('')}</tr></thead><tbody>${tr.rows.slice(0, upto).map((r, i) => `<tr${i === upto - 1 ? ' class="cur"' : ''}><td>${r.line}</td>${r.vals.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function tab1dWidget(values) {

// Dessin d'un tableau à 1 dimension : les valeurs, et les indices dessous
function arrBox(values, hi) {
  return `<div class="arr" role="img" aria-label="Tableau de ${values.length} cases">
  <div class="arr-row">${values.map((v, i) => `<span class="arr-cell${i === hi ? ' on' : ''}">${esc(v)}</span>`).join('')}<span class="arr-lab">← valeurs</span></div>
  <div class="arr-row">${values.map((v, i) => `<span class="arr-idx${i === hi ? ' on' : ''}">${i}</span>`).join('')}<span class="arr-lab">← indices</span></div>
</div>`;
}
// Dessin d'un tableau à 2 dimensions (lignes x colonnes), avec une case mise en avant
function gridFig(rows, cols, hi, clickable) {
  let h = `<div class="tbl-wrap"><table class="g2"><thead><tr><th></th>${Array.from({ length: cols }, (_, j) => `<th scope="col">${j}</th>`).join('')}</tr></thead><tbody>`;
  for (let i = 0; i < rows; i++) {
    h += `<tr><th scope="row">${i}</th>`;
    for (let j = 0; j < cols; j++) {
      const on = hi && hi[0] === i && hi[1] === j;
      h += clickable ? `<td><button type="button" class="g2-cell${on ? ' on' : ''}" data-l="${i}" data-c="${j}" aria-label="Case ligne ${i}, colonne ${j}"></button></td>` : `<td class="${on ? 'on' : ''}">${on ? `t[${i}][${j}]` : ''}</td>`;
    }
    h += '</tr>';
  }
  return h + '</tbody></table></div>';
}

function mountWidgets(root) {
  $$('[data-widget]', root).forEach(w => {
    if (w._mounted) return;
    w._mounted = true;
    const kind = w.dataset.widget;
    if (kind === 'evaluator') {
      const input = $('.ev-input', w), out = $('.ev-out', w);
      const go = async () => {
        const text = input.value.trim();
        if (!text) return;
        try {
          const v = await Exalgo.evalExpression(text);
          out.className = 'ev-out ok';
          out.innerHTML = `<code>${esc(text)}</code> vaut <strong>${esc(Exalgo.describe(v))}</strong> <span class="ty">(${v.t === 'chaîne' ? 'texte' : v.t})</span>`;
        } catch (e) {
          out.className = 'ev-out ko';
          out.textContent = e.message;
        }
      };
      $('.ev-form', w).addEventListener('submit', e => { e.preventDefault(); go(); });
      $$('.chip', w).forEach(c => c.addEventListener('click', () => { input.value = c.dataset.chip; go(); }));
    } else if (kind === 'traceplayer') {
      const { program: prog, rand } = TRACE_PROGS[w.dataset.key];
      const code = $('.prog code', w), table = $('.tp-table', w), pos = $('.tp-pos', w);
      code.innerHTML = numberLines(hlEx(prog));
      let tr = null, step = 0;
      const draw = () => {
        const lines = $$('.ln', code);
        lines.forEach(l => l.classList.remove('active'));
        if (step > 0) {
          const ln = tr.rows[step - 1].line;
          if (lines[ln - 1]) lines[ln - 1].classList.add('active');
        }
        table.innerHTML = step === 0 ? '<p class="muted">Appuie sur « Pas suivant » pour exécuter la première ligne.</p>' : traceTableHTML(tr, step);
        pos.textContent = `${step} / ${tr.rows.length}`;
        $('[data-tp="next"]', w).disabled = step >= tr.rows.length;
        $('[data-tp="prev"]', w).disabled = step <= 0;
        $('[data-tp="first"]', w).disabled = step <= 0;
        $('[data-tp="last"]', w).disabled = step >= tr.rows.length;
      };
      Exalgo.traceProgram(prog, [], rand).then(t => { tr = t; draw(); });
      w.addEventListener('click', e => {
        const b = e.target.closest('[data-tp]');
        if (!b || !tr) return;
        const k = b.dataset.tp;
        if (k === 'next') step = Math.min(step + 1, tr.rows.length);
        else if (k === 'prev') step = Math.max(step - 1, 0);
        else if (k === 'first') step = 0;
        else step = tr.rows.length;
        draw();
      });
    } else if (kind === 'tab1d') {
      const vals = JSON.parse(w.dataset.values);
      const inp = $('.t1-i', w), out = $('.t1-out', w);
      const go = () => {
        const i = parseInt(inp.value, 10);
        $$('.arr-cell, .arr-idx', w).forEach(c => c.classList.remove('on'));
        if (isNaN(i)) { out.className = 'ev-out ko'; out.textContent = "L'indice est un entier."; return; }
        if (i < 0 || i >= vals.length) {
          out.className = 'ev-out ko';
          out.textContent = `Erreur : l'indice ${i} est hors du tableau. Avec ${vals.length} cases, les indices vont de 0 à ${vals.length - 1}.`;
          return;
        }
        $$('.arr-cell', w)[i].classList.add('on');
        $$('.arr-idx', w)[i].classList.add('on');
        out.className = 'ev-out ok';
        out.innerHTML = `<code>t[${i}]</code> vaut <strong>${esc(vals[i])}</strong> <span class="ty">(t.taille vaut ${vals.length})</span>`;
      };
      $('.t1-form', w).addEventListener('submit', e => { e.preventDefault(); go(); });
      go();
    } else if (kind === 'grid2d') {
      const out = $('.g2d-out', w);
      const show = b => {
        $$('.g2-cell', w).forEach(c => c.classList.toggle('on', c === b));
        const l = +b.dataset.l, c = +b.dataset.c;
        out.className = 'ev-out ok';
        out.innerHTML = `<code>t[${l}][${c}]</code> : ligne ${l}, colonne ${c}${l === 0 && c === 1 ? ' (la deuxième case de la première ligne)' : ''}`;
      };
      w.addEventListener('click', e => { const b = e.target.closest('.g2-cell'); if (b) show(b); });
      show($('.g2-cell.on', w));
    }
  });
}

function mountExercises(root) {

  }
});

<li>rappel : par convention, <strong>pas de ${c('Retourner')} dans les boucles</strong>.</li>
</ul>
<h3>Solution 1</h3>
<p>Par exemple ici, la fonction renvoie ${c('vrai')} si (et seulement si) le tableau de caractères contient un ${c("'Z'")}.</p>
${cb({ ex: `Fonction contientZ(E tab : tableau de caractères) : booléen
Var i : entier
    trouve : booléen
Début
    trouve ← faux
    i ← 0
    Tant Que non trouve et i < tab.taille Faire
        Si tab[i] == 'Z' Alors
            trouve ← vrai
        Sinon
            i ← i + 1
    Retourner trouve
Fin

ecrireLigne(contientZ(['R', 'T', 'Z', 'S']))
ecrireLigne(contientZ(['A', 'B']))`, java: `static boolean contientZ(char[] tab) {
    boolean trouve = false;
    int i = 0;
    while (!trouve && i < tab.length) {
        if (tab[i] == 'Z') {
            trouve = true;
        } else {
            i = i + 1;
        }
    }
    return trouve;
}`, run: true, lines: true })}
<p><strong>Remarque</strong> : ci-dessus, on aurait pu incrémenter ${c('i')} dans tous les cas (en dehors du ${c('Sinon')}). Ici, cela permet de sortir de la boucle avec l'indice où ${c("'Z'")} a été trouvé.</p>
<p>Voici le corps de ${c('contientZ')} exécuté pas à pas sur ${c("['R', 'T', 'Z', 'S']")} : la boucle s'arrête sans regarder la dernière case.</p>
${traceplayer('contientZ', PROG_CONTIENT_Z)}
<h3>Solution 2</h3>
<p>Ici, la fonction renvoie ${c('vrai')} si (et seulement si) le tableau ne contient que des nombres entiers strictement inférieurs à 100.</p>

Var i : entier
    tousInferieurs : booléen
Début
    tousInferieurs ← vrai
    i ← 0
    Tant Que tousInferieurs et i < tab.taille Faire
        Si tab[i] >= 100 Alors
            tousInferieurs ← faux
        Sinon
            i ← i + 1
    Retourner tousInferieurs
Fin

ecrireLigne(tousInferieurs100([4, 99, 12]))
ecrireLigne(tousInferieurs100([4, 150, 12]))`, java: `static boolean tousInferieurs100(int[] tab) {
    boolean tousInferieurs = true;
    int i = 0;
    while (tousInferieurs && i < tab.length) {
        if (tab[i] >= 100) {
            tousInferieurs = false;
        } else {
            i = i + 1;
        }
    }
    return tousInferieurs;
}`, run: true, lines: true })}

`

    body: () => `
<h2>Note à obtenir</h2>
<p>Écrire, en ExAlgo, la fonction qui, pour un semestre et une UE donnés, indique la prochaine note à obtenir pour arriver à 10 de moyenne (dans ce semestre et cette UE). Plusieurs cas de figure sont à anticiper :</p>
<ul>
<li>il y a déjà 10 notes pour le semestre de cette UE. Il faut donc indiquer à l'utilisateur qu'il n'y aura pas d'autre évaluation ;</li>
<li>si la note à obtenir est supérieure à 20, alors il faut indiquer à l'utilisateur qu'il n'est plus possible d'avoir la moyenne pour le semestre de cette UE ;</li>
<li>si la note est inférieure ou égale à 0, il faut lui indiquer que même sans rien faire, il aura toujours la moyenne ;</li>
<li>si ce n'est aucun des cas de figure précédents, il faut simplement lui afficher la note à obtenir au prochain devoir.</li>
</ul>
<p>On sépare le <strong>calcul</strong> (${c('etuCalculNoteAObtenir')}, facile à tester) de l'<strong>affichage</strong> (${c('etuAfficherNoteAObtenir')}, qui pose les questions et choisit le message).</p>
${note('retenir', 'Le calcul', "<p>Avec n notes de somme S, la note x du prochain devoir donne une moyenne de (S + x) / (n + 1). Pour que cette moyenne vaille 10 : x = 10 × (n + 1) − S. Exemple : notes 12, 8 et 15 (S = 35, n = 3) : x = 40 − 35 = 5.</p>")}
<h2>Année validée ou non ?</h2>
<p>En vous appuyant sur les règles données au début de ce sujet, écrire le code permettant d'afficher si, avec les notes actuelles, l'étudiant valide son année ou pas.</p>
<ul class="calltree"><li><code>etuAfficherAnneeValidee</code><ul><li><code>etuAnneeValidee</code><ul><li><code>etuUeValidee</code> (une fois par UE)</li><li><code>etuMoyenneAnnee</code></li></ul></li></ul></li></ul>
${exercise('p-q-note')}
${fnCards(['etuCalculNoteAObtenir', 'etuAfficherNoteAObtenir', 'etuUeValidee', 'etuAnneeValidee', 'etuAfficherAnneeValidee'])}
`

    body: () => `

<p>Après avoir réalisé un logiciel permettant à un étudiant d'avoir accès à des informations sur ses notes, vous devez mettre à jour votre logiciel pour qu'il permette également de fournir des informations à la personne en charge de la direction des études.</p>

${tbl(['Avant (partie 1)', 'Après', 'Classe'], [

    [c('remplirTableauAleatoire'), c('etuRemplirTableauAleatoire'), 'GestionNotesEtu'],
    [c('afficherNotesUE'), c('etuAfficherNotesUE'), 'GestionNotesEtu'],

<h3>Préparation des tableaux</h3>

<ul>
<li>un tableau permettant de stocker 3 moyennes pour nos 5 étudiants ;</li>

<p>Voici un exemple du tableau qui stocke les absences injustifiées. Par exemple :</p>

<p>Pour les tests unitaires, nous considérerons qu'il n'y a pas de ligne ou colonne vide dans ces deux tableaux et qu'ils auront toujours la même taille.</p>
<p>Codez l'initialisation des deux tableaux, en sachant que :</p>

    id: 'p9', title: 'Étape 9 : Modifier une moyenne, étudiants maxi', ex: ['p-q-maxi'],
    lead: "Partie 3 : mettre à jour une moyenne après un rattrapage, puis trouver les étudiants qui ont la meilleure moyenne dans chaque UE.",
    body: () => `
<h2>Modifier une moyenne</h2>
<p>Suite à un rattrapage, le/la DDE doit pouvoir saisir la nouvelle moyenne de l'UE concernée pour cet étudiant. Voici comment doit fonctionner cette fonctionnalité :</p>
<ul>
<li>demander quel numéro d'étudiant est concerné ;</li>
<li>demander quelle UE est concernée ;</li>
<li>demander quelle est la nouvelle moyenne obtenue par l'étudiant après rattrapage ;</li>
<li>la moyenne est mise à jour si elle est supérieure à l'ancienne. La moyenne finale ne peut pas non plus être supérieure à la moyenne maximale obtenue par cet étudiant sur l'ensemble des UE. Si tel est le cas, alors la moyenne de rattrapage est fixée à cette moyenne maximale.</li>
</ul>
<p>Par exemple, si l'on prend les notes de la partie « Afficher les informations » :</p>
<ul>
<li>l'étudiant ${c('1')} a repassé l'UE 1 et a eu ${c('6.5')} ; sa moyenne reste donc fixée à ${c('8.75')} ;</li>
<li>l'étudiant ${c('3')} a repassé l'UE 3 et a eu ${c('11.0')} ; sa nouvelle moyenne de l'UE 3 est donc maintenant de ${c('11.0')} ;</li>
<li>l'étudiant ${c('4')} a repassé l'UE 1 et a eu ${c('17.5')} ; sa nouvelle moyenne de l'UE 1 est donc maintenant de ${c('15.02')} (car ${c('15.02')} était sa meilleure moyenne obtenue hors rattrapage).</li>
</ul>
<p>Codez la modification de la moyenne d'une UE en suivant ces règles. Le tableau des moyennes est modifié : il est passé en mode ${c('ES')}.</p>
<h2>Étudiants maxi</h2>
<p>Un étudiant « maxi » est un étudiant dont chacune des 3 moyennes est la moyenne maximale de l'UE. Une promotion peut contenir un, plusieurs ou zéro étudiants « maxi ».</p>
<p>Écrivez une fonction qui affiche la liste des étudiants maxi.</p>
${tbl(['Exemple', 'UE1', 'UE2', 'UE3'], [['Étudiant 1', '12.0', '15.0', '9.0'], ['Étudiant 2', '<strong>14.0</strong>', '<strong>16.0</strong>', '<strong>13.0</strong>'], ['Étudiant 3', '<strong>14.0</strong>', '10.0', '<strong>13.0</strong>']])}
<p class="muted">L'étudiant 2 est maxi (meilleure moyenne de chaque UE, ex æquo compris) ; l'étudiant 3 ne l'est pas, à cause de l'UE2.</p>
<ul class="calltree"><li><code>ddeAfficherMaxi</code><ul><li><code>ddeEstMaxi</code> (vérifier une propriété : un Tant Que)<ul><li><code>ddeMaxUE</code> (le maximum d'une colonne)</li></ul></li></ul></li></ul>
${exercise('p-q-maxi')}
${fnCards(['ddeMaxEtudiant', 'ddeNouvelleMoyenne', 'ddeModifierMoyenne', 'ddeMaxUE', 'ddeEstMaxi', 'ddeAfficherMaxi'])}

function exIdsAll() { return Object.keys(EXERCISES); }
function progress() {
  const all = exIdsAll();
  const done = all.filter(id => Store.data.done[id]).length;
  const lessons = LESSONS.filter(l => Store.data.lessons[l.id]).length;
  return { done, total: all.length, lessons, nl: LESSONS.length };
}
window.updateProgress = function () {
  const p = progress();
  const pct = Math.round(100 * p.done / p.total);
  const bar = $('#prog-bar'), txt = $('#prog-txt');
  if (bar) { bar.style.width = pct + '%'; bar.parentElement.setAttribute('aria-valuenow', String(pct)); }
  if (txt) txt.textContent = `${p.done}/${p.total} exercices`;
  $$('.nav a').forEach(a => {
    const id = a.dataset.id;
    const l = LESSONS.find(x => x.id === id);
    const pr = PROJECT.find(x => x.id === id);
    const item = l || pr;
    let ok = false;
    if (item && item.ex && item.ex.length) ok = item.ex.every(e => Store.data.done[e]);
    if (l) ok = ok && !!Store.data.lessons[id] || !!Store.data.lessons[id];
    a.classList.toggle('is-done', ok);
  });
  $$('.fn-state').forEach(s => {
    const ok = !!Store.data.done[s.dataset.state];
    s.textContent = ok ? '✓ réussie' : '';
  });
  const sk = $$('.skill[data-l]');
  sk.forEach(s => s.classList.toggle('is-done', !!Store.data.lessons[s.dataset.l]));
  const sum = $('#home-sum');
  if (sum) sum.innerHTML = homeSummary();
};

}

function homeSummary() {
  const p = progress();
  const next = ORDER.find(id => {
    const l = LESSONS.find(x => x.id === id);
    if (l) return !Store.data.lessons[id];
    const pr = PROJECT.find(x => x.id === id);
    return pr.ex.some(e => !Store.data.done[e]);
  });
  const nx = next ? [...LESSONS, ...PROJECT].find(x => x.id === next) : null;
  return `<p class="sum-line"><strong>${p.lessons}</strong> leçon${p.lessons > 1 ? 's' : ''} sur ${p.nl} terminée${p.lessons > 1 ? 's' : ''} · <strong>${p.done}</strong> exercice${p.done > 1 ? 's' : ''} réussi${p.done > 1 ? 's' : ''} sur ${p.total}</p>` +

}

function mountAtelier() {
  const ed = $('[data-editor="atelier"]'), ta = $('.ta', ed), sel = $('#at-sel');
  const pending = window.pendingAtelier;
  window.pendingAtelier = null;
  ta.value = pending != null ? pending : (Store.data.atelier || SNIPPETS[sel.value]);
  const host = $('#at-term');
  atelierState.term = mountTerm(host);
  const trBox = $('#at-trace');
  const run = async trace => {
    Store.data.atelier = ta.value; Store.save();
    trBox.hidden = true;
    const t = atelierState.term;
    if (t.pending) t.abort();
    const r = await t.run(ta.value, { trace, onError: e => editorMark(ed, e.line) });
    if (trace && r && r.trace) {
      trBox.hidden = false;
      trBox.innerHTML = `<h3>Trace</h3>` + (r.trace.rows.length ? traceTableHTML(r.trace, r.trace.rows.length) : '<p class="muted">Aucune ligne tracée au niveau principal.</p>');
    }
  };
  initEditor(ed, { onChange: v => { Store.data.atelier = v; Store.save(); }, onRun: () => run(false) });
  editorUpdate(ed);
  sel.addEventListener('change', () => { ta.value = SNIPPETS[sel.value]; ta.dispatchEvent(new Event('input')); });
  $('[data-app="at-run"]').addEventListener('click', () => run(false));
  $('[data-app="at-trace"]').addEventListener('click', () => run(true));
  $('[data-app="at-reset"]').addEventListener('click', () => { ta.value = SNIPPETS[sel.value]; ta.dispatchEvent(new Event('input')); });
}

/* ---------- Routeur ---------- */
function route() {
  let id = (location.hash || '').replace('#', '');
  if (!ALL_IDS.includes(id)) id = 'accueil';
  const m = main();
  let html;
  const li = LESSONS.findIndex(l => l.id === id);
  if (id === 'accueil') html = pageAccueil();
  else if (li >= 0) html = pageLesson(LESSONS[li], li);
  else if (id === 'atelier') html = pageAtelier();
  else if (id === 'memo') html = pageMemo();
  else html = pageLesson(PROJECT.find(p => p.id === id));
  m.innerHTML = html;
  $$('.nav a').forEach(a => a.setAttribute('aria-current', a.dataset.id === id ? 'page' : 'false'));
  document.title = (id === 'accueil' ? 'ExAlgo Cycle 3' : ((LESSONS.find(l => l.id === id) || PROJECT.find(p => p.id === id) || { title: id === 'atelier' ? 'Atelier' : 'Mémo' }).title + ' · ExAlgo Cycle 3'));
  mountExercises(m);
  if (id === 'atelier') mountAtelier();
  window.updateProgress();
  closeDrawer();
  window.scrollTo(0, 0);
  m.focus({ preventScroll: true });
}
