/* core.js */
/* Noyau commun : routage, exercices, mini-éval, progression. Le contenu vient de content.js (SITE, LESSONS, EX, WIDGETS, pageMemo) */
Store.key = SITE.key; Store.load();
const TOOLS = [{ id: 'eval', label: 'Mini-éval de 5 minutes', n: '⏱' }, { id: 'memo', label: 'Mémo', n: '≡' }];
const NAV = [{ group: 'Cours', items: LESSONS.map((l, i) => ({ id: l.id, label: l.title, n: i + 1 })) }, { group: 'Outils', items: TOOLS }];
const ALL_IDS = ['accueil', ...NAV.flatMap(g => g.items.map(i => i.id))];
const ORDER = LESSONS.map(l => l.id);
const LESSON_OF = {}; LESSONS.forEach(l => l.ex.forEach(e => { LESSON_OF[e] = l; }));
const main = () => $('#main');

/* ---------- Exercices ---------- */
function exercise(id) {
  const def = EX[id], done = !!Store.data.done[id];
  const head = k => `<header class="ex-h"><span class="ex-kind">${k}</span><span class="ex-badge" ${done ? '' : 'hidden'}>✓ Réussi</span></header>`;
  const wrap = (cls, inner) => `<section class="ex ${cls}${done ? ' is-done' : ''}" data-ex="${id}">${inner}</section>`;
  if (def.type === 'qcm') return wrap('ex-qcm', `${head('Question')}<p class="ex-q">${def.q}</p>
  <div class="choices" role="group" aria-label="Réponses">${qOrder(def.choices).map(i => [def.choices[i], i]).map(([ch, i]) => `<button type="button" class="choice" data-act="qcm" data-i="${i}"><span class="mark" aria-hidden="true"></span><span class="ct">${ch}</span></button>`).join('')}</div><p class="ex-fb" role="status"></p>`);
  if (def.type === 'num') return wrap('ex-num', `${head('Calcul')}<p class="ex-q">${def.q}</p>
  <div class="num-row"><label class="sr-only" for="n-${id}">Ta réponse</label><input class="num-in" id="n-${id}" inputmode="decimal" autocomplete="off" placeholder="?"> ${def.unit ? `<span>${esc(def.unit)}</span>` : ''}<button type="button" class="btn" data-act="num">Vérifier</button><button type="button" class="btn ghost" data-act="num-hint">Indice</button></div>
  <p class="hint" hidden>${def.hint || ''}</p><p class="ex-fb" role="status"></p>`);
  if (def.type === 'classify') return wrap('ex-cls', `${head('Classer')}<p class="ex-q">${def.q}</p>
  ${def.items.map((it, k) => `<div class="cls-row" data-k="${k}"><div class="cls-t">${it.t}</div><div class="cls-btns" role="group" aria-label="Catégorie">${def.cats.map((ct, j) => `<button type="button" class="choice" data-act="cls" data-k="${k}" data-j="${j}">${ct}</button>`).join('')}</div><p class="cls-fb" role="status"></p></div>`).join('')}
  <p class="ex-fb" role="status"></p>`);
  if (def.type === 'open') return wrap('ex-open', `${head('Réponse rédigée')}<h4 class="ex-title">${esc(def.title || '')}</h4><p class="ex-q">${def.q}</p>
  <label class="sr-only" for="t-${id}">Ta réponse</label><textarea class="sql-ta plain" id="t-${id}" rows="4" placeholder="Écris ta réponse avec tes mots…">${esc(Store.data.notes[id] || '')}</textarea>
  <div class="ex-actions"><button type="button" class="btn" data-act="open-show">Voir les points attendus</button></div>
  <div class="corr" hidden><p><strong>Points attendus :</strong></p>${def.corr}<div class="ex-actions"><button type="button" class="btn" data-act="open-ok">J'avais l'essentiel ✓</button></div></div>`);
  if (def.type === 'gen') return wrap('ex-gen', `${head('Entraînement')}<div class="gen-host"></div>`);
  return '';
}
function markDone(id) {
  if (!Store.data.done[id]) { Store.data.done[id] = 1; Store.save(); }
  const sec = $(`[data-ex="${id}"]`);
  if (sec) { sec.classList.add('is-done'); const b = $('.ex-badge', sec); if (b) b.hidden = false; }
  window.updateProgress();
}
function setFb(sec, text, cls) { const fb = $('.ex-fb', sec); if (fb) { fb.textContent = text; fb.className = 'ex-fb ' + (cls || ''); } }
const parseNum = v => parseFloat(String(v).replace(/\s/g, '').replace(',', '.').replace('%', ''));

function mountGen(host, id) {
  const def = EX[id]; let streak = 0, cur, answered = false;
  host.__cur = () => cur;
  const render = () => {
    cur = GEN[def.gen](); answered = false;
    host.innerHTML = `<p class="ex-q">${cur.q}</p><div class="choices" role="group">${cur.choices.map((ch, i) => `<button type="button" class="choice" data-g="${i}"><span class="mark"></span><span class="ct">${ch}</span></button>`).join('')}</div><p class="ex-fb" role="status"></p><p class="streak" aria-live="polite">Série : <strong>${streak}</strong> / ${def.need}</p>`;
  };
  host.addEventListener('click', e => {
    const b = e.target.closest('[data-g]'); if (!b || answered) return; answered = true;
    const ok = +b.dataset.g === cur.answer; streak = ok ? streak + 1 : 0;
    $$('.choice', host).forEach((x, i) => { x.disabled = true; if (i === cur.answer) x.classList.add('ok'); else if (x === b) x.classList.add('ko'); });
    const fb = $('.ex-fb', host); fb.className = 'ex-fb ' + (ok ? 'ok' : 'ko'); fb.textContent = (ok ? 'Juste. ' : 'Pas tout à fait. ') + (cur.why || '');
    $('.streak', host).innerHTML = `Série : <strong>${streak}</strong> / ${def.need}`;
    if (streak >= def.need) { fb.textContent = 'Série complète, bravo !'; markDone(id); }
    const nx = document.createElement('button'); nx.type = 'button'; nx.className = 'btn ghost'; nx.textContent = 'Question suivante'; nx.onclick = render; fb.after(nx); nx.focus();
  });
  render();
}
function mountWidgets(root) {
  $$('[data-widget]', root).forEach(w => { const f = WIDGETS[w.dataset.widget]; if (f) f(w); });
  $$('.ex-gen', root).forEach(sec => mountGen($('.gen-host', sec), sec.dataset.ex));
  $$('.ex-open textarea', root).forEach(ta => ta.addEventListener('input', () => { Store.data.notes[ta.closest('.ex').dataset.ex] = ta.value; Store.save(); }));
  $$('.num-in', root).forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') $('[data-act="num"]', i.closest('.ex')).click(); }));
}

/* ---------- Mini-éval ---------- */
const EV = { qs: [], i: 0, score: 0, wrong: [], left: 300, t: null, running: false };
const evalPool = () => EX_IDS.filter(id => EX[id].type === 'qcm' || EX[id].type === 'num');
function pageEval() {
  return `<article class="page"><p class="kicker">Outil</p><h1>Mini-éval de 5 minutes</h1>
  <p class="lead">Chaque TD commence par une évaluation de 5 minutes. Entraîne-toi : 8 questions tirées au hasard dans tout le cours, 5 minutes au chrono.</p>
  <div id="eval-box"><div class="widget"><p>Meilleur score : <strong>${Store.data.best || 0} / 8</strong></p><button type="button" class="btn" data-app="eval-start">Lancer l'éval</button></div></div></article>`;
}
function evalQuestion() {
  const id = EV.qs[EV.i], d = EX[id];
  const box = $('#eval-box');
  const body = d.type === 'qcm'
    ? `<div class="choices">${qOrder(d.choices).map(i => [d.choices[i], i]).map(([ch, i]) => `<button type="button" class="choice" data-app="ev-ans" data-i="${i}"><span class="mark"></span><span class="ct">${ch}</span></button>`).join('')}</div>`
    : `<div class="num-row"><input class="num-in" id="ev-num" inputmode="decimal" autocomplete="off" placeholder="?"> ${d.unit ? `<span>${esc(d.unit)}</span>` : ''}<button type="button" class="btn" data-app="ev-num">Valider</button></div>`;
  box.innerHTML = `<div class="eval-top"><strong>Question ${EV.i + 1} / ${EV.qs.length}</strong><span class="timer" id="timer" role="timer"></span></div><div class="widget"><p class="ex-q">${d.q}</p>${body}</div>`;
  tick(true);
  const n = $('#ev-num'); if (n) { n.focus(); n.addEventListener('keydown', e => { if (e.key === 'Enter') $('[data-app="ev-num"]').click(); }); }
}
function tick(only) {
  const t = $('#timer'); if (!t) return;
  const m = Math.floor(EV.left / 60), s = EV.left % 60; t.textContent = `${m}:${String(s).padStart(2, '0')}`; t.classList.toggle('low', EV.left <= 30);
  if (only) return;
}
function evalStart() {
  EV.qs = shuffle(evalPool()).slice(0, 8); EV.i = 0; EV.score = 0; EV.wrong = []; EV.left = 300; EV.running = true;
  clearInterval(EV.t); EV.t = setInterval(() => { EV.left--; tick(); if (EV.left <= 0) evalEnd(); }, 1000);
  evalQuestion();
}
function evalAnswer(ok) {
  if (!EV.running) return;
  const id = EV.qs[EV.i]; if (ok) EV.score++; else EV.wrong.push(id);
  EV.i++; if (EV.i >= EV.qs.length) evalEnd(); else evalQuestion();
}
function evalEnd() {
  clearInterval(EV.t); EV.running = false;
  for (let k = EV.i; k < EV.qs.length; k++) if (!EV.wrong.includes(EV.qs[k])) EV.wrong.push(EV.qs[k]);
  const box = $('#eval-box'); if (!box) return;
  if (EV.score > (Store.data.best || 0)) { Store.data.best = EV.score; Store.save(); }
  const ans = id => { const d = EX[id]; return d.type === 'qcm' ? d.choices[d.answer] : String(d.answer) + (d.unit ? ' ' + d.unit : ''); };
  box.innerHTML = `<div class="widget"><p class="score">${EV.score} / ${EV.qs.length}</p><p>${EV.score === EV.qs.length ? 'Sans faute !' : EV.left <= 0 ? 'Temps écoulé.' : 'Voici ce qu\'il faut revoir.'}</p>
  ${EV.wrong.map(id => `<div class="rev"><p class="ex-q">${EX[id].q}</p><p><strong>Réponse :</strong> ${ans(id)}</p><p>${EX[id].why || ''}</p>${LESSON_OF[id] ? `<a href="#${LESSON_OF[id].id}">Revoir : ${esc(LESSON_OF[id].title)}</a>` : ''}</div>`).join('')}
  <button type="button" class="btn" data-app="eval-start">Recommencer</button></div>`;
}

}

}
window.updateProgress = function () {
  const p = progress(), pct = Math.round(100 * p.done / p.total);
  const bar = $('#prog-bar'), txt = $('#prog-txt');
  if (bar) { bar.style.width = pct + '%'; bar.parentElement.setAttribute('aria-valuenow', String(pct)); }
  if (txt) txt.textContent = `${p.done}/${p.total} exercices`;
  $$('.nav a').forEach(a => a.classList.toggle('is-done', !!Store.data.lessons[a.dataset.id]));
  $$('.skill[data-l]').forEach(s => s.classList.toggle('is-done', !!Store.data.lessons[s.dataset.l]));
  const sum = $('#home-sum'); if (sum) sum.innerHTML = homeSummary();
};
const navHTML = () => NAV.map(g => `<div class="nav-g"><div class="nav-h">${g.group}</div>${g.items.map(i => `<a href="#${i.id}" data-id="${i.id}"><span class="nav-n">${i.n}</span><span class="nav-t">${esc(i.label)}</span></a>`).join('')}</div>`).join('');
function pageAccueil() {
  return `<div class="home"><section class="hero"><p class="kicker">${SITE.kicker}</p><h1>${SITE.h1}</h1><p class="lead">${SITE.lead}</p><div id="home-sum" class="home-sum">${homeSummary()}</div></section>
  ${SITE.homeFig ? SITE.homeFig() : ''}
  <h2>Ce que tu sauras faire</h2><p>Chaque compétence se coche quand tu termines la leçon.</p>
  <ul class="skills">${LESSONS.map((l, i) => `<li class="skill${Store.data.lessons[l.id] ? ' is-done' : ''}" data-l="${l.id}"><a href="#${l.id}"><span class="sk-n">${i + 1}</span><span class="sk-t">${esc(l.skill)}</span><span class="sk-l">${esc(l.title)}</span></a></li>`).join('')}</ul>
  <p><a class="btn ghost" href="#eval">Mini-éval de 5 minutes</a> <a class="btn ghost" href="#memo">Voir le mémo</a></p></div>`;
}
function pageLesson(l, idx) {
  const done = !!Store.data.lessons[l.id], prev = ORDER[idx - 1], next = ORDER[idx + 1];
  const t = id => LESSONS.find(x => x.id === id).title;
  return `<article class="page"><p class="kicker">Leçon ${idx + 1} sur ${LESSONS.length}</p><h1>${esc(l.title)}</h1><p class="lead">${l.lead}</p>
  <div class="body">${l.body()}</div>
  ${l.ex.length ? `<section class="practice"><h2>S'entraîner</h2>${l.ex.map(exercise).join('')}</section>` : ''}

function route() {
  let id = (location.hash || '').replace('#', '');
  if (!ALL_IDS.includes(id)) id = 'accueil';
  if (EV.running && id !== 'eval') { clearInterval(EV.t); EV.running = false; }
  const li = LESSONS.findIndex(l => l.id === id);
  const html = id === 'accueil' ? pageAccueil() : li >= 0 ? pageLesson(LESSONS[li], li) : id === 'eval' ? pageEval() : pageMemo();
  const m = main(); m.innerHTML = html;
  $$('.nav a').forEach(a => a.setAttribute('aria-current', a.dataset.id === id ? 'page' : 'false'));
  document.title = (id === 'accueil' ? SITE.title : (li >= 0 ? LESSONS[li].title : id === 'eval' ? 'Mini-éval' : 'Mémo') + ' · ' + SITE.title);

function closeDrawer() { document.body.classList.remove('drawer-open'); const b = $('#menu-btn'); if (b) b.setAttribute('aria-expanded', 'false'); }
function setTheme(t) { try { localStorage.setItem('cours-theme', t || ''); } catch (e) { /* indisponible */ } if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }

function act(b) {
  const k = b.dataset.act, sec = b.closest('.ex'); const id = sec && sec.dataset.ex, def = id && EX[id];
  if (k === 'qcm') {
    if (sec.classList.contains('is-done') && $('.choice.ok', sec)) return;
    const i = +b.dataset.i;
    if (i === def.answer) { b.classList.add('ok'); $$('.choice', sec).forEach(x => { x.disabled = true; }); setFb(sec, 'Exact. ' + (def.why || ''), 'ok'); markDone(id); }
    else { b.classList.add('ko'); b.disabled = true; setFb(sec, "Ce n'est pas celle-là. Relis le cours et essaie une autre réponse.", 'ko'); }
  } else if (k === 'num') {
    const v = parseNum($('.num-in', sec).value);
    if (isNaN(v)) { setFb(sec, 'Entre un nombre.', 'ko'); return; }
    if (Math.abs(v - def.answer) <= (def.tol || 0.01)) { setFb(sec, 'Exact. ' + (def.why || ''), 'ok'); markDone(id); } else setFb(sec, 'Ce n\'est pas le bon résultat. Vérifie la formule et réessaie.', 'ko');
  } else if (k === 'num-hint') $('.hint', sec).hidden = false;
  else if (k === 'cls') {
    const row = b.closest('.cls-row'), it = def.items[+b.dataset.k], j = +b.dataset.j, fb = $('.cls-fb', row);
    if (j === it.a) { b.classList.add('ok'); $$('.choice', row).forEach(x => { x.disabled = true; }); fb.textContent = '✓ ' + (it.why || ''); fb.className = 'cls-fb ok'; row.dataset.ok = '1'; }
    else { b.classList.add('ko'); b.disabled = true; fb.textContent = 'Non, réessaie.'; fb.className = 'cls-fb ko'; }
    if ($$('.cls-row', sec).every(r => r.dataset.ok)) { setFb(sec, 'Tout est bien classé.', 'ok'); markDone(id); }
  } else if (k === 'open-show') { $('.corr', sec).hidden = false; b.hidden = true; }
  else if (k === 'open-ok') { markDone(id); b.disabled = true; b.textContent = '✓ Noté'; }
}
function init() {
  document.getElementById('app').innerHTML = `
<a class="skip" href="#main">Aller au contenu</a>
<header class="top">
  <button type="button" id="menu-btn" class="icon-btn" aria-label="Menu" aria-expanded="false" aria-controls="side">☰</button>
  <a class="back" href="index.html" title="Retour à la matière" aria-label="Retour à la matière">⌂</a><a class="brand" href="#accueil"><span class="brand-mark">${SITE.mark}</span>${SITE.brand}</a>
  <div class="meter" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="prog-bar"></i></div>
  <span id="prog-txt" class="prog-txt"></span>
  <div class="tools"><button type="button" id="theme-btn" class="icon-btn" aria-label="Changer le thème" title="Thème clair / sombre">◐</button></div>
</header>
<div class="shell"><nav id="side" class="side nav" aria-label="Sommaire">${navHTML()}</nav><div class="scrim" data-app="scrim"></div><main id="main" tabindex="-1"></main></div>`;
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (a) act(a);
    const b = e.target.closest('[data-app]'); if (!b) return;
    const k = b.dataset.app;
    if (k === 'finish') {
      const id = b.dataset.l; Store.data.lessons[id] = !Store.data.lessons[id]; Store.save();
      const on = !!Store.data.lessons[id];
      b.textContent = on ? '✓ Leçon terminée' : 'Marquer la leçon comme terminée'; b.classList.toggle('ghost', on); b.setAttribute('aria-pressed', String(on)); window.updateProgress();
    } else if (k === 'scrim') closeDrawer();
    else if (k === 'eval-start') evalStart();
    else if (k === 'ev-ans') { const d = EX[EV.qs[EV.i]]; evalAnswer(+b.dataset.i === d.answer); }
    else if (k === 'ev-num') { const d = EX[EV.qs[EV.i]], v = parseNum($('#ev-num').value); evalAnswer(!isNaN(v) && Math.abs(v - d.answer) <= (d.tol || 0.01)); }
  });
  $('#menu-btn').addEventListener('click', () => { const o = document.body.classList.toggle('drawer-open'); $('#menu-btn').setAttribute('aria-expanded', String(o)); });
  $('#theme-btn').addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    setTheme(dark ? 'light' : 'dark');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
  window.addEventListener('hashchange', route);
  route();
}
init();
