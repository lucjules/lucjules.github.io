/* Utilitaires */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const Store = {
  key: 'intro-systeme-v1',

  load() { try { const s = localStorage.getItem(this.key); if (s) Object.assign(this.data, JSON.parse(s)); } catch (e) { /* indisponible */ } },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* indisponible */ } }
};
const note = (kind, title, html) => `<aside class="note ${kind}"><div class="note-h">${title}</div><div class="note-b">${html}</div></aside>`;

/* shell.js */
/* Mini-shell Linux simulé : système de fichiers en mémoire, droits rwx, umask */
const Sh = (() => {
  const USER = 'etudiant', GROUP = 'etudiant', HOME = ['home', USER];
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmtDate = d => `${MONTHS[d.getMonth()]} ${String(d.getDate()).padStart(2, ' ')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  const SEED_DATE = new Date(2026, 8, 28, 14, 2);

  const dir = (mode, owner, group) => ({ t: 'd', mode, owner: owner || USER, group: group || GROUP, mtime: SEED_DATE, kids: new Map() });
  const file = (mode, data, owner, group) => ({ t: 'f', mode, owner: owner || USER, group: group || GROUP, mtime: SEED_DATE, data: data || '' });

  /* Construit un arbre depuis une spec : { 'chemin/relatif': ['d', 0o755] | ['f', 0o644, 'contenu', owner] } */
  function buildFS(spec) {
    const root = dir(0o755, 'root', 'root');
    const mk = (parts, node) => {
      let cur = root;
      parts.slice(0, -1).forEach(p => {
        if (!cur.kids.has(p)) cur.kids.set(p, dir(0o755, p === 'home' || p === USER ? (p === USER ? USER : 'root') : 'root', p === USER ? GROUP : 'root'));
        cur = cur.kids.get(p);
      });
      cur.kids.set(parts[parts.length - 1], node);
    };
    Object.entries(spec).forEach(([path, v]) => {
      const parts = path.split('/').filter(Boolean);
      const node = v[0] === 'd' ? dir(v[1], v[3], v[3]) : file(v[1], v[2], v[3], v[3]);
      if (v[0] === 'd' && !v[3]) { node.owner = USER; node.group = GROUP; }
      if (v[0] === 'f' && !v[3]) { node.owner = USER; node.group = GROUP; }
      mk(parts, node);
    });
    return root;
  }

  const SEEDS = {
    standard: () => buildFS({
      'home': ['d', 0o755, '', 'root'],
      'home/etudiant': ['d', 0o755],
      'home/etudiant/Documents': ['d', 0o755],
      'home/etudiant/Documents/notes.txt': ['f', 0o644, "Cours d'intro système\nCommandes de base et permissions\n"],
      'home/etudiant/Documents/rapport.txt': ['f', 0o644, 'Brouillon du rapport\n'],
      'home/etudiant/Projets': ['d', 0o755],
      'home/etudiant/Projets/tp1': ['d', 0o755],
      'home/etudiant/Projets/tp1/main.c': ['f', 0o644, '#include <stdio.h>\nint main(void) { return 0; }\n'],
      'home/etudiant/Projets/tp1/Makefile': ['f', 0o644, 'all:\n\tgcc main.c\n'],
      'home/etudiant/script.sh': ['f', 0o644, '#!/bin/bash\necho "Le script a bien été exécuté"\n'],
      'home/etudiant/secret.txt': ['f', 0o644, 'mot de passe du wifi : ***\n'],
      'home/etudiant/README.txt': ['f', 0o644, 'Bienvenue dans le terminal simulé.\nTape help pour la liste des commandes.\n'],
      'home/etudiant/.bashrc': ['f', 0o644, '# configuration du shell\n'],
      'tmp': ['d', 0o777, '', 'root'],
      'etc': ['d', 0o755, '', 'root'],
      'etc/passwd': ['f', 0o644, 'root:x:0:0:root:/root:/bin/bash\netudiant:x:1000:1000::/home/etudiant:/bin/bash\n', 'root']
    }),
    perms: () => buildFS({
      'home': ['d', 0o755, '', 'root'],
      'home/etudiant': ['d', 0o755],
      'home/etudiant/script.sh': ['f', 0o644, '#!/bin/bash\necho "Le script a bien été exécuté"\n'],
      'home/etudiant/secret.txt': ['f', 0o644, 'mot de passe du wifi : ***\n'],
      'home/etudiant/Projets': ['d', 0o700],
      'home/etudiant/Projets/idee.txt': ['f', 0o644, 'idée de projet\n'],
      'home/etudiant/Documents': ['d', 0o755],
      'home/etudiant/Documents/notes.txt': ['f', 0o644, 'notes\n'],
      'home/etudiant/prive': ['d', 0o600],
      'home/etudiant/prive/lettre.txt': ['f', 0o644, 'chère lettre\n'],
      'home/etudiant/notes.txt': ['f', 0o600, 'notes personnelles\n']
    }),
    empty: () => buildFS({ 'home': ['d', 0o755, '', 'root'], 'home/etudiant': ['d', 0o755] })
  };

  const modeStr = (t, m) => {
    let s = t === 'd' ? 'd' : '-';
    for (let i = 2; i >= 0; i--) {
      const b = (m >> (i * 3)) & 7;
      s += (b & 4 ? 'r' : '-') + (b & 2 ? 'w' : '-') + (b & 1 ? 'x' : '-');
    }
    return s;
  };
  const symStr = m => ['u', 'g', 'o'].map((w, i) => { const b = (m >> ((2 - i) * 3)) & 7; return `${w}=${b & 4 ? 'r' : ''}${b & 2 ? 'w' : ''}${b & 1 ? 'x' : ''}`; }).join(',');
  const octStr = m => (m & 0o777).toString(8).padStart(3, '0');

  /* Découpe une ligne en commandes (séparées par ; ou &&) puis en mots */
  function splitCommands(line) {
    const cmds = [];
    let cur = [], word = '', has = false, quoted = false, q = null;
    const endWord = () => { if (has) cur.push({ s: word, quoted }); word = ''; has = false; quoted = false; };
    const endCmd = () => { endWord(); if (cur.length) cmds.push(cur); cur = []; };
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (q) { if (ch === q) q = null; else word += ch; continue; }
      if (ch === '"' || ch === "'") { q = ch; has = true; quoted = true; continue; }
      if (ch === ' ' || ch === '\t') { endWord(); continue; }
      if (ch === ';') { endCmd(); continue; }
      if (ch === '&' && line[i + 1] === '&') { endCmd(); i++; continue; }
      if (ch === '>') {
        endWord();
        if (line[i + 1] === '>') { cur.push({ s: '>>', op: true }); i++; } else cur.push({ s: '>', op: true });
        continue;
      }
      word += ch; has = true;
    }
    if (q) throw new Error("bash: unexpected EOF while looking for matching quote");
    endCmd();
    return cmds;
  }

  class Shell {
    constructor(seed) {
      this.root = (SEEDS[seed || 'standard'])();
      this.cwd = HOME.slice();
      this.prev = null;
      this.umask = 0o022;
      this.history = [];
      this.log = [];       // lignes de commandes saisies
      this.ranScript = new Set();
      this.cleared = false;
    }

    /* ----- chemins ----- */
    normalize(path, base) {
      let parts;
      if (path === '~' || path.startsWith('~/')) parts = HOME.concat(path.slice(2).split('/'));
      else if (path.startsWith('/')) parts = path.split('/');
      else parts = (base || this.cwd).concat(path.split('/'));
      const out = [];
      parts.forEach(p => { if (p === '' || p === '.') return; if (p === '..') out.pop(); else out.push(p); });
      return out;
    }
    can(node, bit) {
      const cls = node.owner === USER ? 2 : (node.group === GROUP ? 1 : 0);
      return !!(((node.mode >> (cls * 3)) & 7) & bit);
    }
    /* Retourne { node, err } : traverse les dossiers (x requis) */
    lookup(parts) {
      let cur = this.root;
      for (let i = 0; i < parts.length; i++) {
        if (cur.t !== 'd') return { err: 'Not a directory' };
        if (!this.can(cur, 1)) return { err: 'Permission denied' };
        const nx = cur.kids.get(parts[i]);
        if (!nx) return { err: 'No such file or directory', missingAt: i };
        cur = nx;
      }
      return { node: cur };
    }
    /* Parent + nom pour une création/suppression */
    parentOf(parts) {
      if (!parts.length) return { err: 'Invalid' };
      const r = this.lookup(parts.slice(0, -1));
      if (r.err) return { err: r.err };
      if (r.node.t !== 'd') return { err: 'Not a directory' };
      return { parent: r.node, name: parts[parts.length - 1] };
    }
    pathOf(parts) { return '/' + parts.join('/'); }
    prettyCwd() {
      const h = HOME.join('/'), c = this.cwd.join('/');
      if (c === h) return '~';
      if (c.startsWith(h + '/')) return '~/' + c.slice(h.length + 1);
      return '/' + c;
    }
    prompt() { return `${USER}@intro:${this.prettyCwd()}$`; }
    get(path) { const r = this.lookup(this.normalize(path)); return r.node || null; }
    exists(path) { return !!this.get(path); }
    modeOf(path) { const n = this.get(path); return n ? n.mode & 0o777 : null; }

    /* ----- globs ----- */
    expand(words) {
      const out = [];
      words.forEach(w => {
        if (w.op || w.quoted || !/[*?]/.test(w.s)) { out.push(w); return; }
        const i = w.s.lastIndexOf('/');
        const dirPart = i >= 0 ? w.s.slice(0, i + 1) : '';
        const pat = i >= 0 ? w.s.slice(i + 1) : w.s;
        const r = this.lookup(this.normalize(dirPart || '.'));
        if (!r.node || r.node.t !== 'd' || !this.can(r.node, 4)) { out.push(w); return; }
        const re = new RegExp('^' + pat.replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*').replace(/\?/g, '.') + '$');
        const hit = [...r.node.kids.keys()].filter(k => re.test(k) && (!k.startsWith('.') || pat.startsWith('.'))).sort();
        if (!hit.length) out.push(w); else hit.forEach(k => out.push({ s: dirPart + k }));
      });
      return out;
    }

    /* ----- exécution ----- */
    run(line) {
      const res = { out: '', err: '' };
      this.log.push(line);
      if (line.trim()) this.history.push(line);
      let cmds;
      try { cmds = splitCommands(line); } catch (e) { res.err = e.message + '\n'; return res; }
      for (const words0 of cmds) {
        let words = this.expand(words0);
        let redirect = null;
        const ri = words.findIndex(w => w.op);
        if (ri >= 0) { redirect = { op: words[ri].s, target: words[ri + 1] && words[ri + 1].s }; words = words.slice(0, ri); if (!redirect.target) { res.err += 'bash: syntax error near unexpected token `newline\'\n'; break; } }
        if (!words.length) continue;
        const name = words[0].s, args = words.slice(1).map(w => w.s);
        const r = this.exec(name, args, redirect);
        res.out += r.out || ''; res.err += r.err || '';
        if (r.fail) break;
      }
      return res;
    }

    exec(name, args, redirect) {
      let out = '', err = '', fail = false;
      const E = (cmd, msg) => { err += `${cmd}: ${msg}\n`; fail = true; };
      const split = a => { const flags = [], rest = []; let done = false; a.forEach(x => { if (!done && x === '--') done = true; else if (!done && /^-[A-Za-z]+$/.test(x)) flags.push(...x.slice(1)); else rest.push(x); }); return { flags, rest }; };
      switch (name) {
        case 'pwd': out = this.pathOf(this.cwd) + '\n'; break;
        case 'whoami': out = USER + '\n'; break;
        case 'id': out = `uid=1000(${USER}) gid=1000(${GROUP}) groups=1000(${GROUP})\n`; break;
        case 'clear': this.cleared = true; break;
        case 'help': out = HELP; break;
        case 'echo': {
          const text = args.join(' ') + '\n';
          if (redirect) {
            const r = this.writeFile(redirect.target, redirect.op === '>>' ? 'append' : 'write', args.join(' ') + '\n');
            if (r) { err += `bash: ${redirect.target}: ${r}\n`; fail = true; }
          } else out = text;
          break;
        }
        case 'cd': {
          const t = args[0];
          let target;
          if (t === undefined || t === '~') target = HOME.slice();
          else if (t === '-') { if (!this.prev) { E('bash: cd', 'OLDPWD not set'); break; } target = this.prev.slice(); out = this.pathOf(target) + '\n'; }
          else target = this.normalize(t);
          const r = this.lookup(target);
          if (r.err) { E('bash: cd', `${t}: ${r.err}`); break; }
          if (r.node.t !== 'd') { E('bash: cd', `${t}: Not a directory`); break; }
          if (!this.can(r.node, 1)) { E('bash: cd', `${t}: Permission denied`); break; }
          this.prev = this.cwd; this.cwd = target;
          break;
        }
        case 'ls': {
          const { flags, rest } = split(args);
          const L = flags.includes('l'), A = flags.includes('a'), D = flags.includes('d');
          const targets = rest.length ? rest : ['.'];
          const blocks = [];
          targets.forEach((t, ti) => {
            const parts = this.normalize(t);
            const r = this.lookup(parts);
            if (r.err) { err += `ls: cannot access '${t}': ${r.err}\n`; fail = true; return; }
            const n = r.node;
            if (n.t === 'f' || D) { blocks.push({ head: null, body: this.lsLines([[t, n]], L, parts) }); return; }
            if (!this.can(n, 4)) { err += `ls: cannot open directory '${t}': Permission denied\n`; fail = true; return; }
            let names = [...n.kids.keys()].filter(k => A || !k.startsWith('.')).sort((a, b) => a.replace(/^\./, '').toLowerCase().localeCompare(b.replace(/^\./, '').toLowerCase()));
            let entries = names.map(k => [k, n.kids.get(k)]);
            if (A) entries = [['.', n], ['..', n]].concat(entries);
            const noX = !this.can(n, 1);
            const body = this.lsLines(entries, L, parts, noX, t);
            blocks.push({ head: targets.length > 1 ? t + ':' : null, body, noX: L && noX });
            if (L && noX) { fail = true; }
          });
          blocks.forEach((b, i) => {
            if (b.head) out += (i ? '\n' : '') + esc(b.head) + '\n';
            out += b.body.out;
            if (b.body.err) err += b.body.err;
          });
          break;
        }
        case 'tree': {
          const parts = this.normalize(args[0] || '.');
          const r = this.lookup(parts);
          if (r.err) { E('tree', `${args[0] || '.'}: ${r.err}`); break; }
          const lines = [esc(args[0] || '.')];
          const walk = (n, pre) => {
            if (n.t !== 'd' || !this.can(n, 4)) return;
            const ks = [...n.kids.keys()].filter(k => !k.startsWith('.')).sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
            ks.forEach((k, i) => {
              const last = i === ks.length - 1, c = n.kids.get(k);
              lines.push(pre + (last ? '└── ' : '├── ') + (c.t === 'd' ? `<span class="ls-d">${esc(k)}</span>` : esc(k)));
              walk(c, pre + (last ? '    ' : '│   '));
            });
          };
          walk(r.node, '');
          out = lines.join('\n') + '\n';
          break;
        }
        case 'mkdir': {
          const { flags, rest } = split(args);
          if (!rest.length) { E('mkdir', 'missing operand'); break; }
          const P = flags.includes('p');
          rest.forEach(t => {
            const parts = this.normalize(t);
            if (P) {
              let cur = this.root, ok = true;
              for (let i = 0; i < parts.length; i++) {
                let nx = cur.kids.get(parts[i]);
                if (!nx) {
                  if (!this.can(cur, 2) || !this.can(cur, 1)) { err += `mkdir: cannot create directory '${t}': Permission denied\n`; fail = true; ok = false; break; }
                  nx = dir(0o777 & ~this.umask); nx.mtime = new Date(); cur.kids.set(parts[i], nx);
                } else if (nx.t !== 'd') { err += `mkdir: cannot create directory '${t}': Not a directory\n`; fail = true; ok = false; break; }
                else if (!this.can(nx, 1) && i < parts.length - 1) { err += `mkdir: cannot create directory '${t}': Permission denied\n`; fail = true; ok = false; break; }
                cur = nx;
              }
              return;
            }
            const pp = this.parentOf(parts);
            if (pp.err) { err += `mkdir: cannot create directory '${t}': ${pp.err}\n`; fail = true; return; }
            if (pp.parent.kids.has(pp.name)) { err += `mkdir: cannot create directory '${t}': File exists\n`; fail = true; return; }
            if (!this.can(pp.parent, 2) || !this.can(pp.parent, 1)) { err += `mkdir: cannot create directory '${t}': Permission denied\n`; fail = true; return; }
            const d = dir(0o777 & ~this.umask); d.mtime = new Date();
            pp.parent.kids.set(pp.name, d);
          });
          break;
        }
        case 'rmdir': {
          if (!args.length) { E('rmdir', 'missing operand'); break; }
          args.forEach(t => {
            const parts = this.normalize(t);
            const pp = this.parentOf(parts);
            const n = pp.parent && pp.parent.kids.get(pp.name);
            if (pp.err || !n) { err += `rmdir: failed to remove '${t}': ${pp.err || 'No such file or directory'}\n`; fail = true; return; }
            if (n.t !== 'd') { err += `rmdir: failed to remove '${t}': Not a directory\n`; fail = true; return; }
            if (n.kids.size) { err += `rmdir: failed to remove '${t}': Directory not empty\n`; fail = true; return; }
            if (!this.can(pp.parent, 2) || !this.can(pp.parent, 1)) { err += `rmdir: failed to remove '${t}': Permission denied\n`; fail = true; return; }
            pp.parent.kids.delete(pp.name);
          });
          break;
        }
        case 'touch': {
          if (!args.length) { E('touch', 'missing file operand'); break; }
          args.forEach(t => {
            const parts = this.normalize(t);
            const r = this.lookup(parts);
            if (r.node) { r.node.mtime = new Date(); return; }
            if (r.err !== 'No such file or directory') { err += `touch: cannot touch '${t}': ${r.err}\n`; fail = true; return; }
            const pp = this.parentOf(parts);
            if (pp.err) { err += `touch: cannot touch '${t}': ${pp.err}\n`; fail = true; return; }
            if (!this.can(pp.parent, 2) || !this.can(pp.parent, 1)) { err += `touch: cannot touch '${t}': Permission denied\n`; fail = true; return; }
            const f = file(0o666 & ~this.umask, ''); f.mtime = new Date();
            pp.parent.kids.set(pp.name, f);
          });
          break;
        }
        case 'cat': {
          if (!args.length) { E('cat', 'missing file operand'); break; }
          args.forEach(t => {
            const r = this.lookup(this.normalize(t));
            if (r.err) { err += `cat: ${t}: ${r.err}\n`; fail = true; return; }
            if (r.node.t === 'd') { err += `cat: ${t}: Is a directory\n`; fail = true; return; }
            if (!this.can(r.node, 4)) { err += `cat: ${t}: Permission denied\n`; fail = true; return; }
            out += esc(r.node.data);
          });
          break;
        }
        case 'cp': {
          const { flags, rest } = split(args);
          const R = flags.includes('R') || flags.includes('r');
          if (rest.length < 2) { E('cp', rest.length ? `missing destination file operand after '${rest[0]}'` : 'missing file operand'); break; }
          const dst = rest[rest.length - 1], srcs = rest.slice(0, -1);
          const dparts = this.normalize(dst);
          const dr = this.lookup(dparts);
          const dstIsDir = dr.node && dr.node.t === 'd';
          if (srcs.length > 1 && !dstIsDir) { E('cp', `target '${dst}' is not a directory`); break; }
          srcs.forEach(s => {
            const sparts = this.normalize(s);
            const sr = this.lookup(sparts);
            if (sr.err) { err += `cp: cannot stat '${s}': ${sr.err}\n`; fail = true; return; }
            if (sr.node.t === 'd' && !R) { err += `cp: -r not specified; omitting directory '${s}'\n`; fail = true; return; }
            let target = dstIsDir ? dparts.concat(sparts[sparts.length - 1] || '') : dparts;
            if (sr.node.t === 'd' && target.slice(0, sparts.length).join('/') === sparts.join('/') && target.length >= sparts.length) { err += `cp: cannot copy a directory, '${s}', into itself, '${dst === '.' ? s : dst}${dstIsDir ? '/' + sparts[sparts.length - 1] : ''}'\n`; fail = true; return; }
            const pp = this.parentOf(target);
            if (pp.err) { err += `cp: cannot create regular file '${dst}': ${pp.err}\n`; fail = true; return; }
            if (!this.can(pp.parent, 2) || !this.can(pp.parent, 1)) { err += `cp: cannot create ${sr.node.t === 'd' ? 'directory' : 'regular file'} '${dst}': Permission denied\n`; fail = true; return; }
            const ex = pp.parent.kids.get(pp.name);
            if (ex && ex.t === 'd' && sr.node.t !== 'd') { err += `cp: cannot overwrite directory '${dst}' with non-directory\n`; fail = true; return; }
            const problem = this.copyNode(sr.node, pp.parent, pp.name, s);
            if (problem) { err += problem; fail = true; }
          });
          break;
        }
        case 'mv': {
          const { rest } = split(args);
          if (rest.length < 2) { E('mv', rest.length ? `missing destination file operand after '${rest[0]}'` : 'missing file operand'); break; }
          const dst = rest[rest.length - 1], srcs = rest.slice(0, -1);
          const dparts = this.normalize(dst);
          const dr = this.lookup(dparts);
          const dstIsDir = dr.node && dr.node.t === 'd';
          if (srcs.length > 1 && !dstIsDir) { E('mv', `target '${dst}' is not a directory`); break; }
          srcs.forEach(s => {
            const sparts = this.normalize(s);
            const sp = this.parentOf(sparts);
            const sn = sp.parent && sp.parent.kids.get(sp.name);

<h2>Une chaîne de 10 caractères</h2>
<p>La commande ${c('ls -l')} affiche les permissions sous la forme d'une chaîne de 10 caractères, comme ${c('-rwxr-xr--')}.</p>
${lsFig('-rwxr-xr--')}
<ul>
<li>Le <strong>1er caractère</strong> indique le type (${c('-')} pour un fichier, ${c('d')} pour un répertoire).</li>
<li>Les <strong>9 suivants</strong> sont divisés en 3 groupes de 3, représentant les droits pour <strong>u</strong>, <strong>g</strong>, puis <strong>o</strong>.</li>
<li>Un tiret ${c('-')} signifie que le droit n'est pas accordé.</li>
</ul>
<h3>Exemple</h3>
<p>${c('-rwxr-xr--')} signifie que :</p>
${tbl(['Catégorie', 'Droits', 'Ce que ça autorise'], [['u (propriétaire)', c('rwx'), 'tous les droits : lire, écrire, exécuter'], ['g (groupe)', c('r-x'), 'lire et exécuter'], ['o (autres)', c('r--'), 'lire seulement']])}
${sh(`$ ls -l script.sh
-rwxr-xr-- 1 etudiant etudiant 55 Oct 13 08:00 script.sh`, { noTry: true })}
<p>Les autres colonnes de ${c('ls -l')} sont, dans l'ordre : le nombre de liens, le <strong>propriétaire</strong>, le <strong>groupe</strong>, la taille en octets, la date de modification et le nom.</p>
<h3>Dans un répertoire</h3>
${lsFig('drwxr-x---')}
<p>${c('drwxr-x---')} : un <strong>répertoire</strong> ; son propriétaire peut lister, modifier et entrer ; le groupe peut lister et entrer (mais pas créer ni supprimer) ; les autres n'ont aucun droit.</p>
<h2>Entraîne-toi</h2>
${drillW('who', 'Qui peut faire quoi ?')}
`

<h2>La méthode symbolique</h2>
<p>Elle utilise les lettres <strong>u</strong>, <strong>g</strong>, <strong>o</strong>, <strong>a</strong> (<em>all</em>, pour tout le monde) et les opérateurs :</p>
${tbl(['Opérateur', 'Effet'], [[c('+'), 'ajouter les droits'], [c('-'), 'retirer les droits'], [c('='), 'définir exactement les droits (remplace ce qui existait)']])}
<p>Syntaxe : ${c('chmod [qui][opérateur][droits] fichier')}.</p>
<h3>Exemples</h3>
${sh(`$ chmod u+x script.sh
$ chmod go-rw secret.txt
$ chmod a=r secret.txt`)}
${tbl(['Commande', 'Effet'], [
    [c('chmod u+x script.sh'), "ajoute le droit d'exécution au propriétaire"],
    [c('chmod go-rw fichier.txt'), "retire les droits de lecture et d'écriture au groupe et aux autres"],
    [c('chmod a=r fichier.txt'), 'définit le droit de lecture seule pour tout le monde (propriétaire, groupe et autres)']])}
<p>Observe l'effet avec ${c('ls -l')} avant et après chaque commande :</p>
${sh(`$ ls -l secret.txt
$ chmod go-rw secret.txt
$ ls -l secret.txt
$ chmod a=r secret.txt
$ ls -l secret.txt`)}
<h3>Plusieurs changements à la fois</h3>
<p>On sépare les clauses par une virgule, sans espace : ${c('chmod u=rwx,g=rx,o= dossier')} donne tous les droits au propriétaire, lecture et exécution au groupe, et rien aux autres. ${c('chmod -R')} applique le changement à un répertoire et à tout son contenu.</p>
${note('convention', 'Sans lettre devant', `${c('chmod +x fichier')} sans préciser qui équivaut ici à <code>a+x</code> : tout le monde reçoit le droit d'exécution.`)}
<h2>Entraîne-toi</h2>
<p>Voici un fichier avec ses droits actuels et une commande ${c('chmod')} symbolique : quels sont ses droits après ?</p>
${drillW('sym', 'Résultat d\'un chmod symbolique')}
`

    body: () => `
<h2>La méthode octale (ou numérique)</h2>
<p>Chaque droit se voit attribuer une valeur : <strong>r = 4</strong>, <strong>w = 2</strong>, <strong>x = 1</strong>. Pour chaque catégorie (u, g, o), on additionne ces valeurs pour obtenir un chiffre de 0 à 7.</p>
${tbl(['Droits', 'Calcul', 'Chiffre'], [[c('rwx'), '4 + 2 + 1', '<strong>7</strong>'], [c('rw-'), '4 + 2 + 0', '<strong>6</strong>'], [c('r-x'), '4 + 0 + 1', '<strong>5</strong>'], [c('r--'), '4 + 0 + 0', '<strong>4</strong>'], [c('-wx'), '0 + 2 + 1', '<strong>3</strong>'], [c('-w-'), '0 + 2 + 0', '<strong>2</strong>'], [c('--x'), '0 + 0 + 1', '<strong>1</strong>'], [c('---'), '0 + 0 + 0', '<strong>0</strong>']])}
<p>On forme ensuite un nombre à <strong>trois chiffres</strong> (un pour chaque catégorie : u, g, o), comme 755 ou 644.</p>
<h3>Exemples</h3>
${tbl(['Commande', 'Lecture'], [
    [c('chmod 755 dossier'), 'tous les droits au propriétaire (7), et le droit de lire et d\'exécuter au groupe (5) et aux autres (5)'],
    [c('chmod 644 fichier.txt'), 'droit de lire et d\'écrire au propriétaire (6), et seulement le droit de lire au groupe (4) et aux autres (4)']])}
<p>Décompose toujours chiffre par chiffre :</p>
${sh(`$ chmod 754 script.sh
$ ls -l script.sh`)}
<p>7 → ${c('rwx')}, 5 → ${c('r-x')}, 4 → ${c('r--')} : ${c('-rwxr-xr--')}.</p>
<h3>Valeurs courantes</h3>
${tbl(['Octal', 'Chaîne', 'Usage typique'], [[c('644'), c('-rw-r--r--'), 'fichier ordinaire, lisible par tous'], [c('600'), c('-rw-------'), 'fichier privé'], [c('755'), c('-rwxr-xr-x'), 'programme ou répertoire public'], [c('700'), c('-rwx------'), 'répertoire privé'], [c('750'), c('-rwxr-x---'), 'partagé avec le groupe uniquement'], [c('444'), c('-r--r--r--'), 'lecture seule pour tous']])}
<h2>Symbolique ou octal ?</h2>
<p>L'octal fixe <strong>tous</strong> les droits d'un coup (comme <code>=</code>). Le symbolique est pratique pour changer <strong>un seul</strong> droit sans toucher aux autres.</p>
<h2>Entraîne-toi</h2>
<p>Deux entraînements sans fin : de la chaîne vers l'octal, puis l'inverse.</p>
${drillW('str2oct', 'De rwx vers l\'octal')}
${drillW('oct2str', 'De l\'octal vers rwx')}
`

<h2>Le masque umask</h2>
<p>La commande ${c('umask')} définit les permissions <strong>par défaut</strong> appliquées aux nouveaux fichiers et répertoires. Elle fonctionne comme un « masque » qui <strong>retire</strong> des droits.</p>
<p>Un <code>umask</code> de <strong>022</strong> conduit à la création de fichiers avec les droits <strong>644</strong> et de répertoires avec les droits <strong>755</strong>.</p>
<h3>Comment on le calcule</h3>
<p>On part de droits maximaux : <strong>666</strong> pour un fichier (on n'accorde pas x par défaut) et <strong>777</strong> pour un répertoire. On retire ensuite, chiffre par chiffre, les droits du masque.</p>
${tbl(['', 'Fichier', 'Répertoire'], [['Départ', '666', '777'], ['Moins umask 022', '644', '755'], ['Moins umask 077', '600', '700'], ['Moins umask 002', '664', '775']])}
<p>Détail pour 022 sur un fichier : ${c('rw-')} − ${c('---')} = ${c('rw-')} (6) pour u ; ${c('rw-')} − ${c('-w-')} = ${c('r--')} (4) pour g ; idem pour o. D'où 644.</p>
${sh(`$ umask
0022
$ touch a.txt
$ mkdir d
$ ls -ld a.txt d
$ umask 077
$ touch b.txt
$ mkdir e
$ ls -ld b.txt e`)}
${note('retenir', 'À retenir', "<ul><li><code>umask</code> retire des droits aux nouveaux fichiers et répertoires.</li><li>022 → 644 (fichiers) et 755 (répertoires).</li><li>Il n'affecte que les <strong>futurs</strong> fichiers, pas ceux qui existent déjà.</li></ul>")}
<h2>Entraîne-toi</h2>
${drillW('umask', 'Droits par défaut avec umask')}
`
  }
];

/* ---------- Terminal ---------- */
function mountTerm(host, shell, opts) {
  opts = opts || {};
  host.innerHTML = `<div class="term"><div class="term-out" aria-live="polite" tabindex="0" role="log" aria-label="Sortie du terminal"></div><form class="term-in"><label class="prompt"></label><input class="term-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Commande"></form></div>`;
  const out = $('.term-out', host), form = $('.term-in', host), input = $('.term-input', host), pr = $('.prompt', host);
  const T = { shell, out, input, hist: 0 };
  const sync = () => { pr.textContent = shell.prompt() + ' '; };
  T.sync = sync;
  T.print = html => { out.insertAdjacentHTML('beforeend', html); out.scrollTop = out.scrollHeight; };
  T.exec = line => {
    T.print(`<div class="t-echo">${esc(shell.prompt())} ${esc(line)}</div>`);
    const r = shell.run(line);
    if (shell.cleared) { out.innerHTML = ''; shell.cleared = false; }
    if (r.out) T.print(`<div class="t-out">${r.out}</div>`);
    if (r.err) T.print(`<div class="t-err">${esc(r.err)}</div>`);
    sync();
    if (opts.onRun) opts.onRun(line, r);
    if (opts.save) opts.save(out.innerHTML);
  };
  T.runAll = async cmds => { for (const c of cmds) { T.exec(c); await new Promise(r => setTimeout(r, 120)); } };
  form.addEventListener('submit', e => {
    e.preventDefault();
    const v = input.value; input.value = ''; T.hist = 0;
    if (!v.trim()) { T.print(`<div class="t-echo">${esc(shell.prompt())}</div>`); return; }
    T.exec(v);
  });
  input.addEventListener('keydown', e => {
    const h = shell.history;
    if (e.key === 'ArrowUp' && h.length) { T.hist = Math.min(T.hist + 1, h.length); input.value = h[h.length - T.hist]; e.preventDefault(); }
    else if (e.key === 'ArrowDown') { T.hist = Math.max(T.hist - 1, 0); input.value = T.hist ? h[h.length - T.hist] : ''; e.preventDefault(); }
    else if (e.key === 'l' && e.ctrlKey) { out.innerHTML = ''; e.preventDefault(); }
  });
  host.addEventListener('click', e => { if (!e.target.closest('.term-out') || !getSelection().toString()) input.focus({ preventScroll: true }); });
  sync();
  return T;
}

/* ---------- Drills ---------- */
const MODES = ['rwx', 'rw-', 'r-x', 'r--', '-wx', '-w-', '--x', '---'];
const randStr = () => { let s = ''; for (let i = 0; i < 3; i++) s += pick(i === 0 ? ['rwx', 'rw-', 'r-x', 'r--'] : MODES); return s; };
const strToMode = s => { let m = 0; for (let i = 0; i < 9; i++) if (s[i] !== '-') m |= 1 << (8 - i); return m; };
const normStr = v => { v = v.trim(); return v.length === 10 && /^[-d]/.test(v) ? v.slice(1) : v; };
const DRILLS = {
  who() {
    const s = randStr(), who = rnd(3), r = rnd(3);
    const names = ['le propriétaire', 'le groupe', 'les autres'], rights = ['lire', 'écrire', 'exécuter'];
    const truth = s[who * 3 + r] !== '-';
    return { q: `Avec les droits <code>-${s}</code> sur un fichier : ${names[who]} peut-il ${rights[r]} ?`, bool: true, ok: v => (v === 'vrai') === truth, show: truth ? 'Oui' : 'Non', why: `Regarde le bloc de ${names[who]} : ${s.slice(who * 3, who * 3 + 3)}.` };
  },
  sym() {
    const start = pick([0o644, 0o755, 0o600, 0o640, 0o700, 0o444, 0o750]);
    const who = pick(['u', 'g', 'o', 'a', 'go', 'ug']), op = pick(['+', '-', '=']), rt = pick(['r', 'w', 'x', 'rw', 'rx', 'wx', 'rwx']);
    const spec = who + op + rt, res = applyMode(spec, start, false, 0o022);
    const rs = modeStr('-', res).slice(1);
    return { q: `Un fichier est en <code>${modeStr('-', start)}</code> (${octStr(start)}). Que devient-il après <code>chmod ${spec}</code> ?`, ph: 'ex : rw-r--r-- ou 644', ok: v => { v = normStr(v); return v === rs || v === octStr(res); }, show: `${rs} (${octStr(res)})`, why: 'Applique la lettre à chaque catégorie visée : + ajoute, - retire, = remplace tout.' };
  },
  str2oct() {
    const s = randStr(); const o = octStr(strToMode(s));
    return { q: `Convertis <code>${s}</code> en notation octale (3 chiffres).`, ph: 'ex : 754', ok: v => v.trim() === o, show: o, why: 'r=4, w=2, x=1 : additionne pour chaque bloc de trois.' };
  },
  oct2str() {
    const o = pick(['755', '644', '600', '640', '750', '700', '444', '666', '754', '711', '555', '620']);
    const s = modeStr('-', parseInt(o, 8)).slice(1);
    return { q: `Convertis <code>${o}</code> en chaîne de droits (rwx).`, ph: 'ex : rwxr-xr-x', ok: v => normStr(v) === s, show: s, why: 'Chaque chiffre donne un bloc : 7=rwx, 6=rw-, 5=r-x, 4=r--, 0=---.' };
  },
  umask() {
    const u = pick(['022', '027', '077', '002', '007', '037', '026']), um = parseInt(u, 8), dir = rnd(2) === 1;
    const o = octStr((dir ? 0o777 : 0o666) & ~um);
    return { q: `Avec <code>umask ${u}</code>, quels droits (en octal) reçoit un nouveau ${dir ? 'répertoire' : 'fichier'} ?`, ph: 'ex : 644', ok: v => v.trim() === o, show: o, why: `${dir ? '777' : '666'} moins le masque ${u}.` };
  }
};
function mountDrill(host, kind, need, onDone, title) {
  let streak = 0, cur = null, answered = false;
  const render = () => {
    cur = DRILLS[kind](); answered = false;
    host.innerHTML = `${title ? `<h4 class="ex-title">${esc(title)}</h4>` : ''}<p class="ex-q">${cur.q}</p>
    ${cur.bool ? `<div class="bool-btns" role="group"><button type="button" class="choice" data-d="vrai"><span class="mark"></span>Oui</button><button type="button" class="choice" data-d="faux"><span class="mark"></span>Non</button></div>`
      : `<form class="drill-form"><input class="drill-in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(cur.ph)}" aria-label="Ta réponse"><button class="btn" type="submit">Valider</button></form>`}
    <p class="ex-fb" role="status"></p>
    <p class="streak" aria-live="polite">Série : <strong>${streak}</strong> / ${need}</p>`;
  };
  const answer = v => {
    if (answered) return; answered = true;
    const ok = cur.ok(v);
    streak = ok ? streak + 1 : 0;
    const fb = $('.ex-fb', host);
    fb.className = 'ex-fb ' + (ok ? 'ok' : 'ko');
    fb.textContent = ok ? 'Juste !' : `Pas tout à fait : ${cur.show}. ${cur.why}`;
    $('.streak', host).innerHTML = `Série : <strong>${streak}</strong> / ${need}`;
    if (streak >= need) { fb.textContent = 'Série complète, bravo !'; if (onDone) onDone(); }
    const nxt = document.createElement('button'); nxt.type = 'button'; nxt.className = 'btn ghost'; nxt.textContent = 'Question suivante'; nxt.onclick = render; fb.after(nxt); nxt.focus();
    $$('.choice, .drill-in', host).forEach(x => { x.disabled = true; });
    const sb = $('.drill-form .btn', host); if (sb) sb.disabled = true;
  };
  host.addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (b) answer(b.dataset.d); });
  host.addEventListener('submit', e => { e.preventDefault(); const i = $('.drill-in', host); if (i && i.value.trim()) answer(i.value); });
  render();
}

function mountPermLab(host) {
  let isDir = false, m = 0o754;
  const rows = ['Propriétaire (u)', 'Groupe (g)', 'Autres (o)'], cols = ['r lire', 'w écrire', 'x exécuter'];
  const draw = () => {
    host.innerHTML = `<h4 class="ex-title">Laboratoire de permissions</h4>

    <div class="seg" role="group" aria-label="Type"><button type="button" data-t="f" aria-pressed="${!isDir}">Fichier</button><button type="button" data-t="d" aria-pressed="${isDir}">Répertoire</button></div>
    <div class="pl-grid" role="group" aria-label="Droits"><span></span>${cols.map(x => `<strong class="pl-h">${x}</strong>`).join('')}
    ${rows.map((r, i) => `<span class="pl-r">${r}</span>${[0, 1, 2].map(j => { const bit = 1 << (8 - i * 3 - j); return `<label class="pl-c"><input type="checkbox" data-b="${bit}" ${m & bit ? 'checked' : ''} aria-label="${r} ${cols[j]}"><i></i></label>`; }).join('')}`).join('')}</div>
    <div class="pl-out">
      <div><span>ls -l</span><code class="pl-ls">${modeStr(isDir ? 'd' : '-', m)}</code></div>
      <div><span>Octal</span><code>${octStr(m)}</code></div>
      <div><span>Commande</span><code>chmod ${octStr(m)} ${isDir ? 'dossier' : 'fichier.txt'}</code></div>

    </div><p class="pl-fr">${explain()}</p>`;
  };
  const explain = () => {
    const names = ['Le propriétaire', 'Le groupe', 'Les autres'];
    const vr = isDir ? ['lister le contenu', 'créer, renommer ou supprimer dedans', 'entrer dedans (cd)'] : ['lire le fichier', 'le modifier', "l'exécuter"];
    return names.map((n, i) => { const b = (m >> ((2 - i) * 3)) & 7; const l = vr.filter((_, j) => b & (4 >> j)); return `${n} : ${l.length ? 'peut ' + l.join(', ') : 'aucun droit'}.`; }).join(' ');
  };
  host.addEventListener('change', e => { const cb = e.target.closest('[data-b]'); if (!cb) return; m = cb.checked ? m | +cb.dataset.b : m & ~+cb.dataset.b; draw(); const f = $(`[data-b="${cb.dataset.b}"]`, host); if (f) f.focus(); });
  host.addEventListener('click', e => { const t = e.target.closest('[data-t]'); if (!t) return; isDir = t.dataset.t === 'd'; draw(); });
  draw();
}

function mountWidgets(root) {
  $$('[data-widget]', root).forEach(w => {
    if (w.dataset.widget === 'permlab') mountPermLab(w);
    else if (w.dataset.widget === 'drill') mountDrill(w, w.dataset.kind, 99, null, w.dataset.title);
  });
  $$('.ex-shell', root).forEach(startTask);
  $$('.ex-drill', root).forEach(sec => mountDrill($('.drill-host', sec), sec.dataset.kind, +sec.dataset.need, () => markDone(sec.dataset.ex)));
}

/* ---------- Pages ---------- */
function progress() {
  const done = EX_IDS.filter(id => Store.data.done[id]).length;
  const lessons = LESSONS.filter(l => Store.data.lessons[l.id]).length;
  return { done, total: EX_IDS.length, lessons, nl: LESSONS.length };
}
function homeSummary() {
  const p = progress();
  const nx = LESSONS.find(l => !Store.data.lessons[l.id]);
  return `<p class="sum-line"><strong>${p.lessons}</strong> leçon${p.lessons > 1 ? 's' : ''} sur ${p.nl} terminée${p.lessons > 1 ? 's' : ''} · <strong>${p.done}</strong> exercice${p.done > 1 ? 's' : ''} réussi${p.done > 1 ? 's' : ''} sur ${p.total}</p>` +
    (nx ? `<a class="btn" href="#${nx.id}">${p.done || p.lessons ? 'Continuer' : 'Commencer'} : ${esc(nx.title)}</a>` : '<p class="sum-line">Tout est fait. Le terminal et le mémo sont là pour t\'entraîner librement.</p>');
}
window.updateProgress = function () {
  const p = progress(), pct = Math.round(100 * p.done / p.total);
  const bar = $('#prog-bar'), txt = $('#prog-txt');
  if (bar) { bar.style.width = pct + '%'; bar.parentElement.setAttribute('aria-valuenow', String(pct)); }
  if (txt) txt.textContent = `${p.done}/${p.total} exercices`;
  $$('.nav a').forEach(a => a.classList.toggle('is-done', !!Store.data.lessons[a.dataset.id]));
  $$('.skill[data-l]').forEach(s => s.classList.toggle('is-done', !!Store.data.lessons[s.dataset.l]));
  const sum = $('#home-sum'); if (sum) sum.innerHTML = homeSummary();
};
function navHTML() {
  return NAV.map(g => `<div class="nav-g"><div class="nav-h">${g.group}</div>${g.items.map(i => `<a href="#${i.id}" data-id="${i.id}"><span class="nav-n">${i.n}</span><span class="nav-t">${esc(i.label)}</span></a>`).join('')}</div>`).join('');
}
function pageAccueil() {
  return `<div class="home">
  <section class="hero"><p class="kicker">Intro système</p>
  <h1>Le terminal et les permissions Linux.</h1>
  <p class="lead">Se déplacer, créer, copier, supprimer, puis comprendre et modifier les droits <code>rwx</code> avec <code>chmod</code>. Un vrai terminal simulé t'attend pour pratiquer sans risque.</p>
  <div id="home-sum" class="home-sum">${homeSummary()}</div></section>
  ${lsFig('-rwxr-xr--')}
  <h2>Ce que tu sauras faire</h2>
  <p>Chaque compétence se coche quand tu termines la leçon.</p>
  <ul class="skills">${LESSONS.map((l, i) => `<li class="skill${Store.data.lessons[l.id] ? ' is-done' : ''}" data-l="${l.id}"><a href="#${l.id}"><span class="sk-n">${i + 1}</span><span class="sk-t">${esc(l.skill)}</span><span class="sk-l">${esc(l.title)}</span></a></li>`).join('')}</ul>
  <p><a class="btn ghost" href="#terminal">Ouvrir le terminal</a> <a class="btn ghost" href="#memo">Voir le mémo</a></p></div>`;
}
function pageLesson(l, idx) {
  const done = !!Store.data.lessons[l.id];
  const prev = ORDER[idx - 1], next = ORDER[idx + 1];
  const t = id => LESSONS.find(x => x.id === id).title;
  return `<article class="page"><p class="kicker">Leçon ${idx + 1} sur ${LESSONS.length}</p><h1>${esc(l.title)}</h1><p class="lead">${esc(l.lead)}</p>
  <div class="body">${l.body()}</div>
  <section class="practice"><h2>S'entraîner</h2>${l.ex.map(exercise).join('')}</section>
  <div class="finish"><button type="button" class="btn${done ? ' ghost' : ''}" data-app="finish" data-l="${l.id}" aria-pressed="${done}">${done ? '✓ Leçon terminée' : 'Marquer la leçon comme terminée'}</button></div>
  <nav class="pager" aria-label="Navigation">${prev ? `<a href="#${prev}"><span>Précédent</span>${esc(t(prev))}</a>` : '<span></span>'}${next ? `<a class="next" href="#${next}"><span>Suivant</span>${esc(t(next))}</a>` : '<a class="next" href="#memo"><span>Pour finir</span>Mémo</a>'}</nav></article>`;
}
function pageMemo() {
  const bits = tbl(['Chiffre', 'Droits', 'Calcul'], [['7', c('rwx'), '4+2+1'], ['6', c('rw-'), '4+2'], ['5', c('r-x'), '4+1'], ['4', c('r--'), '4'], ['3', c('-wx'), '2+1'], ['2', c('-w-'), '2'], ['1', c('--x'), '1'], ['0', c('---'), '0']]);
  const common = tbl(['Octal', 'ls -l', 'Usage typique'], [[c('755'), c('rwxr-xr-x'), 'répertoire, programme'], [c('644'), c('rw-r--r--'), 'fichier ordinaire'], [c('600'), c('rw-------'), 'fichier privé'], [c('700'), c('rwx------'), 'répertoire privé'], [c('750'), c('rwxr-x---'), 'partagé avec le groupe'], [c('777'), c('rwxrwxrwx'), 'tout le monde fait tout (à éviter)']]);
  return `<article class="page"><p class="kicker">Aide-mémoire</p><h1>Mémo</h1><p class="lead">Tout le cours sur une page.</p>
  <h2>Les commandes</h2>${tbl(['Commande', 'Rôle', 'Exemple'], MEMO.cmds.map(r => [c(r[0]), esc(r[1]), c(r[2])]))}
  <h2>Les droits</h2>${tbl(['', 'Fichier', 'Répertoire'], [[c('r'), 'lire le contenu', 'lister les noms'], [c('w'), 'modifier le contenu', 'créer, renommer, supprimer dedans'], [c('x'), 'exécuter', 'entrer (cd) et accéder aux fichiers']])}
  ${tbl(['', 'Qui'], [[c('u'), 'user : le propriétaire'], [c('g'), 'group : le groupe'], [c('o'), 'others : les autres'], [c('a'), 'all : tout le monde']])}
  <h2>chmod</h2>${tbl(['Méthode', 'Exemple', 'Effet'], [['symbolique', c('chmod u+x script.sh'), 'ajoute x au propriétaire'], ['symbolique', c('chmod go-rw fichier.txt'), 'retire r et w au groupe et aux autres'], ['symbolique', c('chmod a=r fichier.txt'), 'lecture seule pour tous'], ['octale', c('chmod 755 dossier'), 'rwxr-xr-x'], ['octale', c('chmod 644 fichier.txt'), 'rw-r--r--']])}
  <h2>Octal</h2><p>r = 4, w = 2, x = 1. On additionne par catégorie.</p>${bits}${common}
  <h2>umask</h2><p>Le masque retire des droits aux nouveaux éléments : fichiers = 666 − umask, répertoires = 777 − umask. Avec <code>022</code> : 644 et 755.</p>
  <h2>Messages d'erreur</h2>${tbl(['Message', 'Signification'], MEMO.errors.map(r => [c(r[0]), esc(r[1])]))}</article>`;
}

/* ---------- Routage ---------- */
function route() {
  let id = (location.hash || '').replace('#', '');
  if (!ALL_IDS.includes(id)) id = 'accueil';
  const li = LESSONS.findIndex(l => l.id === id);
  if (li >= 0 && !(Main.back === id)) { /* mémorise la leçon courante */ }
  let html;
  if (id === 'accueil') html = pageAccueil();
  else if (li >= 0) html = pageLesson(LESSONS[li], li);
  else if (id === 'terminal') html = pageTerminal();
  else html = pageMemo();
  const m = main(); m.innerHTML = html;
  $$('.nav a').forEach(a => a.setAttribute('aria-current', a.dataset.id === id ? 'page' : 'false'));
  document.title = id === 'accueil' ? 'Intro Système' : ((li >= 0 ? LESSONS[li].title : id === 'terminal' ? 'Terminal' : 'Mémo') + ' · Intro Système');
  mountWidgets(m);
  if (id === 'terminal') mountTerminal();
  if (li >= 0) Main.cur = id;
  window.updateProgress(); closeDrawer(); window.scrollTo(0, 0); m.focus({ preventScroll: true });
}
function closeDrawer() { document.body.classList.remove('drawer-open'); const b = $('#menu-btn'); if (b) b.setAttribute('aria-expanded', 'false'); }
function setTheme(t) { try { localStorage.setItem('cours-theme', t || ''); } catch (e) { /* indisponible */ } if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }

function init() {
  document.getElementById('app').innerHTML = `
<a class="skip" href="#main">Aller au contenu</a>
<header class="top">
  <button type="button" id="menu-btn" class="icon-btn" aria-label="Menu" aria-expanded="false" aria-controls="side">☰</button>
  <a class="back" href="index.html" title="Retour à la matière" aria-label="Retour à la matière">⌂</a><a class="brand" href="#accueil"><span class="brand-mark">$</span>Intro <small>système</small></a>
  <div class="meter" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="prog-bar"></i></div>
  <span id="prog-txt" class="prog-txt"></span>
  <div class="tools"><button type="button" id="theme-btn" class="icon-btn" aria-label="Changer le thème" title="Thème clair / sombre">◐</button></div>
</header>
<div class="shell"><nav id="side" class="side nav" aria-label="Sommaire">${navHTML()}</nav><div class="scrim" data-app="scrim"></div><main id="main" tabindex="-1"></main></div>`;
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-act]');
    if (a) act(a);
    const b = e.target.closest('[data-app]');
    if (!b) return;
    const k = b.dataset.app;
    if (k === 'finish') {
      const id = b.dataset.l; Store.data.lessons[id] = !Store.data.lessons[id]; Store.save();
      const on = !!Store.data.lessons[id];
      b.textContent = on ? '✓ Leçon terminée' : 'Marquer la leçon comme terminée';
      b.classList.toggle('ghost', on); b.setAttribute('aria-pressed', String(on)); window.updateProgress();
    } else if (k === 'scrim') closeDrawer();
    else if (k === 'term-reset') { Main.shell = new Shell(Main.seed); Main.html = ''; mountTerminal(); }
  });
  $('#menu-btn').addEventListener('click', () => { const o = document.body.classList.toggle('drawer-open'); $('#menu-btn').setAttribute('aria-expanded', String(o)); });
  $('#theme-btn').addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    setTheme(dark ? 'light' : 'dark');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
  window.addEventListener('hashchange', route);
  route();
}

function act(b) {
  const k = b.dataset.act, sec = b.closest('.ex');
  if (k === 'try') {
    window.pendingCmds = JSON.parse(b.dataset.cmds);
    Main.back = Main.cur || null;
    location.hash = '#terminal';
  } else if (k === 'qcm') {
    if (sec.classList.contains('is-done') && $('.choice.ok', sec)) return;
    const def = EX[sec.dataset.ex], i = +b.dataset.i;
    if (i === def.answer) {
      b.classList.add('ok'); $$('.choice', sec).forEach(x => { x.disabled = true; });
      setFb(sec, 'Exact. ' + def.why, 'ok'); markDone(sec.dataset.ex);
    } else { b.classList.add('ko'); b.disabled = true; setFb(sec, "Ce n'est pas celle-là. Relis le cours et essaie une autre réponse.", 'ko'); }
  } else if (k === 'sh-check') {
    const id = sec.dataset.ex, def = EX[id], t = TASKS[id];
    const [ok, msg] = def.check(t.shell);
    setFb(sec, ok ? 'Réussi. ' + msg : msg, ok ? 'ok' : 'ko');
    if (ok) markDone(id);
  } else if (k === 'sh-hint') { $('.hint', sec).hidden = false; }
  else if (k === 'sh-sol') { $('.sol', sec).hidden = false; }
  else if (k === 'sh-reset') { startTask(sec); setFb(sec, '', ''); }
}
init();

;(function(){var o=window.updateProgress;window.updateProgress=function(){if(o)o.apply(this,arguments);try{var ids=typeof EX_IDS!=='undefined'?EX_IDS:Object.keys(EXERCISES);var d=Store.data.done||{},l=Store.data.lessons||{};localStorage.setItem('hub:systeme/intro-systeme',JSON.stringify({done:ids.filter(function(k){return d[k]}).length,total:ids.length,lessons:LESSONS.filter(function(x){return l[x.id]}).length,nl:LESSONS.length}))}catch(e){}};window.updateProgress()})();

</script>
