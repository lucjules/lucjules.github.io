<script type="text/plain" id="src-alice">
#!/usr/bin/env bash
# SAE 1.03 - Installation de poste BUTGAMES : préparation de la machine
# Debian 12/13 ou Xubuntu/Ubuntu LTS, bureau XFCE.
#
# À lancer depuis le compte d'alice (administratrice) :   sudo bash sae-alice.sh
#
# Options (variables d'environnement, à placer avant la commande) :
#   GO_SOURCE=tarball|apt   origine de Go (défaut : tarball = dernière version officielle de go.dev)
#   UPGRADE=0|1             mettre à jour tout le système d'abord (défaut : 1)
#   BOB_TOOLS=0|1           installer l'extension Go et les outils Go dans le compte de bob (défaut : 1)
#   ONLY="comptes prompt"   ne lancer que ces étapes (liste en bas du script)
# Exemple :   sudo GO_SOURCE=apt UPGRADE=0 bash sae-alice.sh
set -euo pipefail

GO_SOURCE=${GO_SOURCE:-tarball}
UPGRADE=${UPGRADE:-1}
BOB_TOOLS=${BOB_TOOLS:-1}
ONLY=${ONLY:-}

LOCALE=en_US.UTF-8        # système en anglais
KB_LAYOUT=fr              # clavier français
TZONE=Europe/Paris
ALICE_PW='alice@but'      # mots de passe imposés par le sujet
BOB_PW='bob@but'
SHARED_RC=/etc/butgames.bashrc
MARK='# >>> butgames >>>'
APT="apt-get -y -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold"
export DEBIAN_FRONTEND=noninteractive

log()  { printf '\n\033[1;34m==>\033[0m \033[1m%s\033[0m\n' "$*"; }
ok()   { printf '  \033[32m✔\033[0m %s\n' "$*"; }
warn() { printf '  \033[33m!\033[0m %s\n' "$*" >&2; }
die()  { printf '\033[31mErreur :\033[0m %s\n' "$*" >&2; exit 1; }

[ "$(id -u)" -eq 0 ] || die "lance ce script avec sudo :  sudo bash $0"
# shellcheck disable=SC1091
. /etc/os-release
case "${ID:-}" in
  debian|ubuntu) ;;
  *) die "distribution non prévue : ${ID:-inconnue} (Debian ou Ubuntu/Xubuntu attendues)" ;;
esac

step_paquets() {
  log "Paquets de base (git, curl, outils VMware...)"
  # Debian installée depuis un CD/ISO : une ligne « deb cdrom: » bloque apt update
  [ -f /etc/apt/sources.list ] && sed -i 's/^deb cdrom:/# deb cdrom:/' /etc/apt/sources.list
  $APT update
  if [ "$UPGRADE" = 1 ]; then $APT full-upgrade; fi
  $APT install sudo git curl wget ca-certificates gpg apt-transport-https \
      bash-completion locales open-vm-tools open-vm-tools-desktop
  ok "$(git --version)"
}

step_locale() {
  log "Langue du système : anglais ($LOCALE)"
  if [ "$ID" = ubuntu ]; then $APT install language-pack-en; fi
  if [ -f /etc/locale.gen ]; then sed -i "s/^# *\($LOCALE UTF-8\)/\1/" /etc/locale.gen; fi
  locale-gen >/dev/null
  update-locale LANG="$LOCALE"
  ok "LANG=$LOCALE dans /etc/default/locale"
}

step_clavier() {
  log "Clavier : disposition française ($KB_LAYOUT)"
  cat > /etc/default/keyboard <<EOF
# Fichier lu par la console et par le serveur graphique (Xorg)
XKBMODEL="pc105"
XKBLAYOUT="$KB_LAYOUT"
XKBVARIANT=""
XKBOPTIONS=""

BACKSPACE="guess"
EOF
  if command -v localectl >/dev/null 2>&1; then
    localectl set-x11-keymap "$KB_LAYOUT" pc105 >/dev/null 2>&1 || warn "localectl indisponible : /etc/default/keyboard suffit après redémarrage"
  fi
  ok "XKBLAYOUT=\"$KB_LAYOUT\" dans /etc/default/keyboard (effectif après reconnexion)"
}

step_fuseau() {
  log "Fuseau horaire : $TZONE"
  if ! timedatectl set-timezone "$TZONE" >/dev/null 2>&1; then
    ln -sf "/usr/share/zoneinfo/$TZONE" /etc/localtime
    echo "$TZONE" > /etc/timezone
  fi
  ok "$TZONE"
}

step_comptes() {
  log "Comptes : alice (administratrice) et bob (développeur)"
  local u
  for u in alice bob; do
    id "$u" >/dev/null 2>&1 || useradd -m -s /bin/bash -c "${u^}" "$u"
  done
  echo "alice:$ALICE_PW" | chpasswd
  echo "bob:$BOB_PW" | chpasswd
  usermod -aG sudo alice                       # alice administre : sudo
  gpasswd -d bob sudo >/dev/null 2>&1 || true   # bob n'est PAS administrateur
  gpasswd -d bob admin >/dev/null 2>&1 || true
  ok "alice : $(id -nG alice)"
  ok "bob   : $(id -nG bob)"
}

step_go() {
  log "Go (source : $GO_SOURCE)"
  if [ "$GO_SOURCE" = apt ]; then
    $APT install golang-go
  else
    local arch json ver file sha tmp
    arch=$(dpkg --print-architecture)           # amd64 ou arm64, comme chez go.dev
    case "$arch" in amd64|arm64) ;; *) die "architecture non prise en charge : $arch" ;; esac
    json=$(curl -fsSL 'https://go.dev/dl/?mode=json')
    ver=$(printf '%s' "$json" | grep -m1 -o '"version": *"go[0-9.]*"' | grep -o 'go[0-9.]*')
    file="$ver.linux-$arch.tar.gz"
    sha=$(printf '%s' "$json" | grep -A6 -F "\"filename\": \"$file\"" | grep -m1 -o '"sha256": *"[0-9a-f]*"' | grep -o '[0-9a-f]\{64\}')
    { [ -n "$ver" ] && [ -n "$sha" ]; } || die "version ou empreinte de Go introuvable sur go.dev"
    tmp=$(mktemp -d)
    curl -fsSL -o "$tmp/$file" "https://go.dev/dl/$file"
    echo "$sha  $tmp/$file" | sha256sum -c -         # vérifie l'intégrité du téléchargement
    rm -rf /usr/local/go
    tar -C /usr/local -xzf "$tmp/$file"
    rm -rf "$tmp"
    ln -sf /usr/local/go/bin/go /usr/local/bin/go         # `go` visible dans tous les shells
    ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
  fi
  cat > /etc/profile.d/go.sh <<'EOF'
case ":$PATH:" in *:/usr/local/go/bin:*) ;; *) PATH="$PATH:/usr/local/go/bin" ;; esac
export PATH
EOF
  ok "$(go version)"
}

step_vscode() {
  log "Visual Studio Code (dépôt apt officiel de Microsoft)"
  curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor --yes -o /usr/share/keyrings/microsoft.gpg
  chmod 644 /usr/share/keyrings/microsoft.gpg
  rm -f /etc/apt/sources.list.d/vscode.list     # évite un doublon si le .deb a déjà ajouté le dépôt
  cat > /etc/apt/sources.list.d/vscode.sources <<EOF
Types: deb
URIs: https://packages.microsoft.com/repos/code
Suites: stable
Components: main
Architectures: $(dpkg --print-architecture)
Signed-By: /usr/share/keyrings/microsoft.gpg
EOF
  $APT update
  $APT install code
  ok "$(code --version --user-data-dir=/tmp/vscode-root 2>/dev/null | head -1 || echo installé)"
}

step_lisezmoi() {
  log "Fichier LISEZMOI sur le bureau d'alice et de bob"
  local u
  for u in alice bob; do
    install -d -o "$u" -g "$u" "/home/$u/Desktop"
    cat > "/home/$u/Desktop/LISEZMOI.txt" <<'EOF'
BUTGAMES - poste de développement Go

Comptes
  alice / alice@but   administratrice (sudo) : installe et met à jour les logiciels
  bob   / bob@but     développeur : écrit, compile et lance les programmes Go

Premiers pas, en tant que bob
  1. Ouvrir un terminal : le prompt affiche la branche git, par exemple (langage_go *)
  2. git clone --branch langage_go https://gitlab-ce.iut.u-bordeaux.fr/rgiot/hello.sae4.but1.iut.git
  3. cd hello.sae4.but1.iut && ./test.sh
  4. Nouveau projet Go : mkdir mon-projet && cd mon-projet && go mod init mon-projet && code .

Besoin d'un logiciel ? bob n'a pas sudo : demander à alice (sudo apt install ...).
EOF
    chown "$u:$u" "/home/$u/Desktop/LISEZMOI.txt"
  done
  ok "LISEZMOI.txt créé"
}

step_prompt() {
  log "Prompt bash avec l'état du dépôt git (+ PATH de Go)"
  cat > "$SHARED_RC" <<'EOF'
# /etc/butgames.bashrc - chargé par le ~/.bashrc de chaque utilisateur (shells interactifs)

# PATH : Go, et les outils Go installés par l'utilisateur (gopls, dlv...)
case ":$PATH:" in *:/usr/local/go/bin:*) ;; *) PATH="$PATH:/usr/local/go/bin" ;; esac
case ":$PATH:" in *":$HOME/go/bin:"*) ;; *) PATH="$PATH:$HOME/go/bin" ;; esac
export PATH

# Prompt : utilisateur@machine:dossier (branche état-du-dépôt)$
if [ -r /usr/lib/git-core/git-sh-prompt ]; then
  . /usr/lib/git-core/git-sh-prompt
  GIT_PS1_SHOWDIRTYSTATE=1       # * = modifications non indexées, + = modifications indexées
  GIT_PS1_SHOWUNTRACKEDFILES=1   # % = fichiers non suivis
  GIT_PS1_SHOWSTASHSTATE=1       # $ = du travail mis de côté (git stash)
  GIT_PS1_SHOWUPSTREAM=auto      # < en retard, > en avance, = à jour, <> divergent
  # Apostrophes : $(__git_ps1) doit être évalué à CHAQUE affichage du prompt, pas une fois pour toutes
  PS1='${debian_chroot:+($debian_chroot)}\[\033[01;32m\]\u@\h\[\033[00m\]:\[\033[01;34m\]\w\[\033[00m\]\[\033[01;33m\]$(__git_ps1 " (%s)")\[\033[00m\]\$ '
fi
EOF
  local rc
  for rc in /etc/skel/.bashrc /home/alice/.bashrc /home/bob/.bashrc; do
    [ -f "$rc" ] || continue
    if ! grep -qF "$MARK" "$rc"; then
      printf '\n%s\n[ -r %s ] && . %s\n# <<< butgames <<<\n' "$MARK" "$SHARED_RC" "$SHARED_RC" >> "$rc"
    fi
  done
  ok "prompt et PATH définis dans $SHARED_RC, chargés par alice, bob et les futurs comptes (/etc/skel)"
}

step_bob() {
  if [ "$BOB_TOOLS" != 1 ]; then warn "BOB_TOOLS=$BOB_TOOLS : étape ignorée"; return 0; fi
  log "Compte de bob : identité git, extension Go de VS Code, outils Go (dans son home, sans droits admin)"
  runuser -l bob -c 'git config --global user.name "Bob" && git config --global user.email "bob@butgames.local" && git config --global init.defaultBranch main'
  runuser -l bob -c 'code --install-extension golang.go --force' \
    || warn "extension non installée : refais « code --install-extension golang.go » depuis la session de bob"
  runuser -l bob -c 'go install golang.org/x/tools/gopls@latest'            || warn "gopls non installé (réseau ?)"
  runuser -l bob -c 'go install github.com/go-delve/delve/cmd/dlv@latest'  || warn "dlv non installé (réseau ?)"
  runuser -l bob -c 'go install honnef.co/go/tools/cmd/staticcheck@latest' || warn "staticcheck non installé (réseau ?)"
  ok "extensions de bob : $(runuser -l bob -c 'code --list-extensions' 2>/dev/null | tr '\n' ' ')"
}

run() { if [ -z "$ONLY" ] || [[ " $ONLY " == *" $1 "* ]]; then "step_$1"; fi; }
# Ordre : paquets locale clavier fuseau comptes go vscode lisezmoi prompt bob
for s in paquets locale clavier fuseau comptes go vscode lisezmoi prompt bob; do run "$s"; done

log "Terminé"
echo "  1. Redémarre la machine (clavier et langue pris en compte)  :  sudo reboot"
echo "  2. Ouvre la session de bob et lance :  bash sae-bob.sh"
</script>
<script type="text/plain" id="src-bob">
#!/usr/bin/env bash
# SAE 1.03 - côté bob (développeur) : cloner le dépôt de validation et lancer test.sh
# À lancer depuis le compte de bob, SANS sudo :   bash sae-bob.sh
set -uo pipefail

REPO=https://gitlab-ce.iut.u-bordeaux.fr/rgiot/hello.sae4.but1.iut.git
BRANCH=langage_go
DIR=$HOME/projets
LOG=$HOME/preuve-test.txt

[ "$(id -u)" -ne 0 ] || { echo "Ne lance pas ce script en root : utilise le compte de bob."; exit 1; }
[ "$(id -un)" = bob ] || echo "(attention : tu es « $(id -un) », pas bob)"
command -v git >/dev/null || { echo "git n'est pas installé : demande à alice (sudo apt install git)."; exit 1; }

mkdir -p "$DIR" && cd "$DIR" || exit 1
name=$(basename "$REPO" .git)
if [ -d "$name/.git" ]; then
  echo "Dépôt déjà cloné : mise à jour de la branche $BRANCH"
  git -C "$name" fetch origin "$BRANCH" && git -C "$name" checkout "$BRANCH" && git -C "$name" pull --ff-only
else
  git clone --branch "$BRANCH" "$REPO" || { echo "Clone impossible : voir la page Dépannage (réseau, identifiants, nom de branche)."; exit 1; }
fi
cd "$name" || exit 1

echo; echo "Branche : $(git branch --show-current)"
echo "---- début de test.sh (lis-le avant de le lancer) ----"
head -n 40 test.sh
echo "-------------------------------------------------------"

{
  date
  echo "machine : $(hostname) | utilisateur : $(id -un) | $(go version 2>&1)"
} | tee "$LOG"
if [ -x test.sh ]; then ./test.sh 2>&1 | tee -a "$LOG"; else bash test.sh 2>&1 | tee -a "$LOG"; fi
code=${PIPESTATUS[0]}
echo "code retour de test.sh : $code   (0 = aucune erreur)" | tee -a "$LOG"
echo "Trace enregistrée dans $LOG"
exit "$code"
</script>
<script type="text/plain" id="src-verif">
#!/usr/bin/env bash
# SAE 1.03 - vérifie chaque exigence du sujet et affiche [ OK ] / [FAIL]
# À lancer dans la VM, depuis le compte d'alice :   sudo bash sae-verif.sh
# Pour lancer aussi test.sh dans le compte de bob :  sudo RUN_TEST=1 bash sae-verif.sh
set -uo pipefail
RUN_TEST=${RUN_TEST:-0}
REPO_DIR=/home/bob/projets/hello.sae4.but1.iut
[ "$(id -u)" -eq 0 ] || { echo "Lance : sudo bash $0"; exit 1; }

ok=0; ko=0
check() {   # check "libellé" commande [arguments...]
  local label=$1; shift
  if "$@" >/dev/null 2>&1; then printf '  \033[32m[ OK ]\033[0m %s\n' "$label"; ok=$((ok+1))
  else printf '  \033[31m[FAIL]\033[0m %s\n' "$label"; ko=$((ko+1)); fi
}
as_bob() { runuser -l bob -c "$1"; }
in_group()     { id -nG "$1" 2>/dev/null | tr ' ' '\n' | grep -qx "$2"; }
not_admin()    { ! id -nG "$1" 2>/dev/null | tr ' ' '\n' | grep -Eqx 'sudo|admin|wheel'; }
prompt_works() { local d; d=$(mktemp -d); git -C "$d" init -q -b langage_go && [ "$(bash -c '. /usr/lib/git-core/git-sh-prompt; cd "$1" && __git_ps1 "(%s)"' _ "$d")" = "(langage_go)" ]; local r=$?; rm -rf "$d"; return $r; }
bob_prompt()   { as_bob 'bash -ic "echo \$PS1" 2>/dev/null' | grep -q __git_ps1; }
bob_ext()      { as_bob 'code --list-extensions 2>/dev/null' | grep -qix 'golang.go'; }
bob_branch()   { [ "$(as_bob "git -C $REPO_DIR branch --show-current")" = langage_go ]; }
bob_test()     { as_bob "cd $REPO_DIR && if [ -x test.sh ]; then ./test.sh; else bash test.sh; fi"; }
bob_hello()    { as_bob 'd=$(mktemp -d) && cd "$d" && go mod init essai >/dev/null 2>&1 && printf "package main\nimport \"fmt\"\nfunc main(){ fmt.Println(\"ok\") }\n" > main.go && [ "$(go run .)" = ok ]'; }

echo; echo "SAE 1.03 - vérification ($(. /etc/os-release; echo "$PRETTY_NAME"))"
echo; echo "Système"
check "Bureau XFCE installé"                         command -v xfce4-session
check "Langue du système : anglais (en_US.UTF-8)"    grep -Eq '^LANG="?en_US' /etc/default/locale
check "Clavier : disposition française (fr)"         grep -q '^XKBLAYOUT="fr"' /etc/default/keyboard
check "Outils VMware (presse-papiers, résolution)"   systemctl is-enabled --quiet open-vm-tools
echo; echo "Comptes"
check "alice existe"                                 id alice
check "alice est administratrice (groupe sudo)"      in_group alice sudo
check "bob existe"                                   id bob
check "bob n'est PAS administrateur"                 not_admin bob
echo; echo "Logiciels"
check "git installé"                                 command -v git
check "Go installé (go version)"                     go version
check "Visual Studio Code installé (code)"           command -v code
check "Extension Go dans le compte de bob"           bob_ext
check "gopls (outil Go) dans le home de bob"         test -x /home/bob/go/bin/gopls
check "bob compile et lance un programme Go"         bob_hello
echo; echo "Prompt bash"
check "Fichier /etc/butgames.bashrc présent"         grep -q __git_ps1 /etc/butgames.bashrc
check "__git_ps1 affiche la branche d'un dépôt"      prompt_works
check "Le ~/.bashrc d'alice charge ce prompt"        grep -q butgames /home/alice/.bashrc
check "Le ~/.bashrc de bob charge ce prompt"         grep -q butgames /home/bob/.bashrc
check "Le shell de bob utilise __git_ps1"            bob_prompt
echo; echo "Projet de validation"
check "Dépôt cloné dans le compte de bob"            test -d "$REPO_DIR/.git"
check "Branche courante : langage_go"                bob_branch
if [ "$RUN_TEST" = 1 ]; then check "test.sh se termine sans erreur (code 0)" bob_test
else echo "  (test.sh non lancé ici : ajoute RUN_TEST=1, ou lance-le dans la session de bob)"; fi

echo; printf 'Bilan : \033[32m%d OK\033[0m, \033[31m%d échec(s)\033[0m\n' "$ok" "$ko"
[ "$ko" -eq 0 ]
</script>

<script>
/* ===== Outils communs ===== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const R = String.raw; // les contenus contiennent beaucoup de \ (prompt, scripts) : on les garde tels quels
const Store = {
  key: 'sae-103-v1',
  data: { distro: 'debian', chk: {}, gen: {} },
  load() {
    try {
      const s = localStorage.getItem(this.key);
      if (s) { const d = JSON.parse(s); if (d && typeof d === 'object') Object.assign(this.data, d); }
    } catch (e) { /* stockage indisponible */ }
    if (this.data.distro !== 'xubuntu') this.data.distro = 'debian';
    if (!this.data.chk || typeof this.data.chk !== 'object') this.data.chk = {};
    if (!this.data.gen || typeof this.data.gen !== 'object') this.data.gen = {};
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* stockage indisponible */ } }
};
Store.load();

const c = s => `<code>${esc(s)}</code>`;
const kbd = s => `<kbd>${esc(s)}</kbd>`;
const note = (kind, title, html) => `<aside class="note ${kind}"><div class="note-h">${title}</div><div class="note-b">${html}</div></aside>`;
const tbl = (head, rows, cls) => `<div class="tbl-wrap"><table class="tbl ${cls || ''}"><thead><tr>${head.map(h => `<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const WHO = { hote: 'sur l\'hôte', alice: 'alice', bob: 'bob', root: 'root' };
const who = w => `<span class="who ${w}">${WHO[w]}</span>`;
/* Contenu propre à une distribution : seul le parcours choisi est visible (voir sae103.css) */
const D = (deb, xub) => `<div class="dv dv-debian">${deb}</div><div class="dv dv-xubuntu">${xub}</div>`;
const Di = (deb, xub) => `<span class="dv dv-debian">${deb}</span><span class="dv dv-xubuntu">${xub}</span>`;

/* Bloc de code : le texte est copié tel quel. Une ligne entièrement en commentaire, ou la fin de ligne après « # », est atténuée. */
function colorLine(l) {
  const e = esc(l);
  const m = e.match(/^(\s*)(#.*)$/);
  if (m) return m[1] + '<span class="c-com">' + m[2] + '</span>';
  const k = e.search(/\s#\s/);
  if (k > 0 && !/['"][^'"]*$/.test(e.slice(0, k))) return e.slice(0, k) + '<span class="c-com">' + e.slice(k) + '</span>';
  return e;
}
function code(text, o) {
  o = o || {};
  const t = text.replace(/^\n+|\s+$/g, '');
  const html = t.split('\n').map(colorLine).join('\n');
  const name = o.name ? `<figcaption class="cb-name">${esc(o.name)}</figcaption>` : '';
  return `<figure class="cb">${name}<pre class="cb-code"><code>${html}</code></pre><div class="cb-bar"><span class="cb-lang">${esc(o.lang || 'bash')}</span><div class="cb-actions"><button type="button" class="btn mini" data-act="copy">Copier</button></div></div></figure>`;
}
const sh = text => code(text, { lang: 'bash' });
const file = (name, text) => code(text, { lang: 'fichier', name });
/* Transcription : les lignes « $ commande » sont des commandes (seules copiées), les autres sont la réponse du système */
function term(block) {
  const lines = block.replace(/^\n+|\s+$/g, '').split('\n');
  const cmds = lines.filter(l => l.startsWith('$ ')).map(l => l.slice(2));
  const html = lines.map(l => l.startsWith('$ ')
    ? `<span class="sh-p">$</span> <span class="sh-c">${esc(l.slice(2))}</span>`
    : `<span class="sh-o">${esc(l)}</span>`).join('\n');
  return `<figure class="cb" data-copy="${esc(cmds.join('\n'))}"><pre class="cb-code"><code>${html}</code></pre><div class="cb-bar"><span class="cb-lang">terminal</span><div class="cb-actions"><button type="button" class="btn mini" data-act="copy">Copier les commandes</button></div></div></figure>`;
}
/* Script complet (texte dans un <script type="text/plain">), affiché replié, copiable et téléchargeable */
function scriptBlock(srcId, fname, summary) {
  const t = $('#' + srcId).textContent.replace(/^\n+/, '');
  const n = t.split('\n').length;
  return `<details class="dt"><summary>${esc(summary)} <span class="pill">${n} lignes</span></summary><div>

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) { /* page en file:// ou presse-papiers refusé : repli ci-dessous */ }
  const ta = document.createElement('textarea');
  ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove(); return ok;
}
function download(name, text, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function flash(btn, msg) {
  const old = btn.dataset.old || btn.textContent; btn.dataset.old = old;
  btn.textContent = msg; btn.classList.add('is-ok');
  clearTimeout(btn._t); btn._t = setTimeout(() => { btn.textContent = old; btn.classList.remove('is-ok'); }, 1600);
}

addSec({

/* ---------- 7. git, Go, VS Code ---------- */
addSec({
  id: 'logiciels', group: 'Installer', title: 'git, Go et VS Code',
  lead: "Les logiciels installés pour tout le monde par alice, avec sudo.",
  body: () => R`
<p>${who('alice')} Installation système : le dossier d'installation et les droits en écriture restent à root, donc bob peut les <em>utiliser</em> sans pouvoir les <em>modifier</em>.</p>
<h2>1. git</h2>
${sh(R`sudo apt install -y git curl wget ca-certificates gpg apt-transport-https bash-completion`)}
${term(R`$ git --version
git version 2.xx.x`)}

<h2>2. Go</h2>
<p>Deux méthodes (voir le comparatif de l'étape « Choix »). La version officielle est conseillée.</p>
<h3>Méthode A : l'archive officielle de go.dev (conseillée)</h3>
${sh(R`# 1. Trouver la dernière version stable et l'archive de ta machine (amd64 ou arm64)
ARCH=$(dpkg --print-architecture)
VER=$(curl -fsSL 'https://go.dev/dl/?mode=json' | grep -m1 -o '"version": *"go[0-9.]*"' | grep -o 'go[0-9.]*')
echo "$VER pour $ARCH"
# 2. Télécharger
curl -fLO "https://go.dev/dl/$VER.linux-$ARCH.tar.gz"
# 3. Vérifier l'intégrité : comparer avec l'empreinte SHA-256 affichée sur https://go.dev/dl/
sha256sum "$VER.linux-$ARCH.tar.gz"
# 4. Installer dans /usr/local/go (en remplaçant une éventuelle ancienne version)
sudo rm -rf /usr/local/go
sudo tar -C /usr/local -xzf "$VER.linux-$ARCH.tar.gz"
# 5. Rendre la commande visible pour tout le monde
sudo ln -sf /usr/local/go/bin/go /usr/local/bin/go
sudo ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt`)}
<p>Le <strong>script</strong> du guide fait exactement cela, et compare lui-même l'empreinte SHA-256 avant d'installer. Les deux liens dans <code>/usr/local/bin</code> rendent <code>go</code> disponible dans tous les shells ; le fichier <code>/etc/butgames.bashrc</code> (étape suivante) ajoute aussi <code>/usr/local/go/bin</code> et <code>~/go/bin</code> au PATH.</p>
<h3>Méthode B : le paquet de la distribution</h3>
${sh(R`apt policy golang-go    # voir la version proposée
sudo apt install -y golang-go`)}
<h3>Vérifier</h3>
${term(R`$ go version
go version go1.xx.x linux/amd64
$ go env GOROOT GOPATH
/usr/local/go
/home/alice/go`)}

<h2>3. Visual Studio Code</h2>
<p>On ajoute le <strong>dépôt apt officiel de Microsoft</strong> : VS Code se met ensuite à jour avec le système.</p>
${sh(R`# clé de signature du dépôt
curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/microsoft.gpg
# déclaration du dépôt
sudo tee /etc/apt/sources.list.d/vscode.sources >/dev/null <<EOF
Types: deb
URIs: https://packages.microsoft.com/repos/code
Suites: stable
Components: main
Architectures: $(dpkg --print-architecture)
Signed-By: /usr/share/keyrings/microsoft.gpg
EOF
sudo apt update
sudo apt install -y code`)}
${term(R`$ code --version
1.xx.x
...`)}
<p>Le logiciel apparaît dans le menu <em>Applications → Development</em> et se lance avec la commande <code>code</code>.</p>
${D(
  '<p class="muted-s">Sur Debian, le paquet <code>code</code> du dépôt Microsoft est la voie normale : ni snap ni flatpak nécessaires.</p>',
  '<p class="muted-s">Sur Xubuntu, <code>sudo snap install code --classic</code> marche aussi, mais le snap est plus lourd et démarre plus lentement : le dépôt apt est préférable pour une VM distribuée.</p>'
)}
${note('attention', 'L\'extension Go, ce n\'est pas ici', '<p>Ce que tu viens d\'installer est <strong>VS Code lui-même</strong>, pour tout le monde. L\'<strong>extension Go</strong> et les outils de développement (<code>gopls</code>, <code>dlv</code>) s\'installent <strong>dans le compte de bob</strong> : étape « Côté bob ».</p>')}`,
  check: [
    ['logiciels-1', "<code>git --version</code> répond."],
    ['logiciels-2', "<code>go version</code> répond (dans le compte d'alice puis dans celui de bob)."],
    ['logiciels-3', "<code>code --version</code> répond et VS Code s'ouvre."],
    ['logiciels-4', "Je sais expliquer pourquoi Go est dans /usr/local et pas dans le dossier de bob."]
  ]
});

addSec({
  id: 'prompt', group: 'Installer', title: 'Le prompt avec l\'état de git',
  lead: "Faire afficher la branche et l'état du dépôt dans le prompt de bash, pour alice, bob et les futurs comptes.",
  body: () => R`
<h2>Ce qu'on veut obtenir</h2>
<p>Dans un dépôt git, le prompt montre la branche et ce qui a changé :</p>
${term(R`bob@butgames-dev:~/projets/hello.sae4.but1.iut (langage_go)$ echo x >> test.sh
bob@butgames-dev:~/projets/hello.sae4.but1.iut (langage_go *)$ git add test.sh
bob@butgames-dev:~/projets/hello.sae4.but1.iut (langage_go +)$`)}
${tbl(['Symbole', 'Signification'], [
  [c('(langage_go)'), 'branche courante, dépôt sans changement'],
  [c('*'), 'fichiers suivis <strong>modifiés</strong>, pas encore ajoutés (<code>git add</code>)'],
  [c('+'), 'modifications <strong>ajoutées</strong> à l\'index, prêtes pour le commit'],
  [c('%'), 'fichiers <strong>non suivis</strong> par git'],
  [c('$'), 'du travail mis de côté avec <code>git stash</code>'],
  [c('#'), 'dépôt neuf, <strong>sans aucun commit</strong>'],
  [c('<  >  <>  ='), 'en retard / en avance / divergent / à jour par rapport au dépôt distant']
])}

<h2>Comment ça marche</h2>
<ul>
  <li>Le prompt est la variable <code>PS1</code>, relue par bash à chaque ligne.</li>
  <li>git fournit une fonction <code>__git_ps1</code> dans le fichier <code>/usr/lib/git-core/git-sh-prompt</code> : elle affiche la branche et l'état, ou rien si on n'est pas dans un dépôt.</li>
  <li>Des variables <code>GIT_PS1_SHOW…</code> choisissent ce qui est affiché.</li>
  <li><strong>Piège classique</strong> : <code>PS1</code> doit être entre <strong>apostrophes</strong>. Entre guillemets, <code>$(__git_ps1)</code> serait calculé une seule fois, à la définition, et le prompt ne changerait jamais de branche.</li>
</ul>

<h2>Où l'écrire : un fichier commun</h2>
<p>Plutôt que de copier le même bloc dans chaque <code>~/.bashrc</code>, on le met dans <strong>un seul fichier système</strong>, <code>/etc/butgames.bashrc</code>, que chaque <code>.bashrc</code> charge. Une modification, un seul endroit. Il règle aussi le PATH de Go.</p>
${file('/etc/butgames.bashrc', bashrcTxt())}
<p>Puis, pour chaque utilisateur existant et pour les futurs (<code>/etc/skel</code>), une ligne dans le <code>.bashrc</code> :</p>
${sh(R`for rc in /etc/skel/.bashrc /home/alice/.bashrc /home/bob/.bashrc; do
  echo '[ -r /etc/butgames.bashrc ] && . /etc/butgames.bashrc' | sudo tee -a "$rc" >/dev/null
done`)}
<p>Crée le fichier avec <code>sudo nano /etc/butgames.bashrc</code> (copie le bloc ci-dessus) ou laisse le <a href="#scripts">script</a> le faire : il n'ajoute la ligne qu'une fois dans chaque <code>.bashrc</code>.</p>

<h2>Tester</h2>
${term(R`$ source ~/.bashrc
$ cd /tmp && git init -q essai && cd essai
alice@butgames-dev:/tmp/essai (master #)$ touch a && git add a
alice@butgames-dev:/tmp/essai (master #+)$ cd ..
alice@butgames-dev:/tmp$`)}
<p>Le prompt change aussi dans le terminal intégré de VS Code. Les couleurs : vert pour <code>utilisateur@machine</code>, bleu pour le dossier, jaune pour git.</p>
${note('attention', 'Si le prompt n\'a pas changé', '<ul><li>Ouvre un <strong>nouveau</strong> terminal (ou <code>source ~/.bashrc</code>) : un shell déjà ouvert garde l\'ancien.</li><li>Affiche <code>echo "$PS1"</code> : il doit contenir <code>__git_ps1</code>, pas du texte déjà calculé comme <code>(master)</code>.</li><li>Un prompt avec <code>$(__git_ps1 ...)</code> écrit tel quel signifie que <code>PS1</code> est entre guillemets, ou que <code>git-sh-prompt</code> n\'a pas été chargé.</li></ul>')}`,
  check: [
    ['prompt-1', "Le fichier /etc/butgames.bashrc existe et contient __git_ps1."],
    ['prompt-2', "Le ~/.bashrc d'alice et celui de bob chargent ce fichier."],
    ['prompt-3', "Dans un dépôt de test, le prompt affiche la branche et change avec * et +."],
    ['prompt-4', "Je sais expliquer pourquoi PS1 est entre apostrophes."]
  ]
});

${sh(R`./test.sh 2>&1 | tee ~/preuve-test.txt
echo "code retour : ${'$'}{PIPESTATUS[0]}"`)}
<p>Un code retour de <code>0</code> signifie « aucune erreur ». Si le fichier n'est pas exécutable (« Permission denied ») : <code>bash test.sh</code>, ou <code>chmod +x test.sh</code> (git verra alors une modification : le prompt affichera <code>*</code>).</p>
${note('attention', 'Si test.sh réclame un logiciel absent', '<p>Message du type « command not found » ? bob ne peut pas installer lui-même (pas de sudo) : <strong>alice</strong> installe le paquet manquant (<code>sudo apt install …</code>) et bob relance le test. C\'est le fonctionnement voulu des deux rôles. Note ce cas dans le rapport, c\'est une difficulté rencontrée.</p>')}

<h2>6. Vérifier avec un vrai projet Go</h2>
<p>Comme le test n'est pas exhaustif, vérifie toi-même qu'on peut créer, compiler et lancer un programme (détails dans la <a href="#notice">notice</a>) :</p>

go mod init bonjour
cat > main.go <<'EOF'
package main

import "fmt"

func main() { fmt.Println("Bonjour BUTGAMES !") }
EOF
go run .
code .`)}`,
  check: [
    ['bob-1', "L'extension golang.go est installée chez bob (<code>code --list-extensions</code>)."],
    ['bob-2', "gopls et dlv sont dans ~/go/bin et VS Code ne signale aucun outil manquant."],
    ['bob-3', "Le dépôt est cloné sur la branche langage_go et le prompt affiche (langage_go)."],
    ['bob-4', "<code>./test.sh</code> se termine avec le code retour 0, et j'ai gardé la trace."],
    ['bob-5', "Je compile et lance un mini-programme Go depuis le terminal et depuis VS Code."]
  ]
});

/* ---------- Mémo : la liste minimale des actions et commandes (aussi utilisée par le générateur du rapport) ---------- */
function bashrcTxt() {
  const m = $('#src-alice').textContent.match(/cat > "\$SHARED_RC" <<'EOF'\n([\s\S]*?)\nEOF\n/);
  return m ? m[1] : '';
}
const GO_CMDS = R`ARCH=$(dpkg --print-architecture)
VER=$(curl -fsSL 'https://go.dev/dl/?mode=json' | grep -m1 -o '"version": *"go[0-9.]*"' | grep -o 'go[0-9.]*')
curl -fLO "https://go.dev/dl/$VER.linux-$ARCH.tar.gz"
sha256sum "$VER.linux-$ARCH.tar.gz"      # comparer avec l'empreinte de https://go.dev/dl/
sudo rm -rf /usr/local/go && sudo tar -C /usr/local -xzf "$VER.linux-$ARCH.tar.gz"
sudo ln -sf /usr/local/go/bin/go /usr/local/bin/go
sudo ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt`;
const CODE_CMDS = R`curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/microsoft.gpg
sudo tee /etc/apt/sources.list.d/vscode.sources >/dev/null <<EOF
Types: deb
URIs: https://packages.microsoft.com/repos/code
Suites: stable
Components: main
Architectures: $(dpkg --print-architecture)
Signed-By: /usr/share/keyrings/microsoft.gpg
EOF
sudo apt update && sudo apt install -y code`;
const MEMO = (distro, goSrc) => [
  { who: 'hote', t: 'Créer la machine virtuelle', steps: [
    { x: 'VMware : New Virtual Machine, « I will install the operating system later », Linux ' + (distro === 'debian' ? '(Debian 12.x 64-bit)' : '(Ubuntu 64-bit)') + ', nom BUTGAMES-DEV, disque de 40 Go dynamique.' },
    { x: 'Customize Hardware : 4096 Mo de RAM, 1 processeur à 2 cœurs, réseau NAT, accélération 3D désactivée, ISO dans le lecteur CD/DVD.' }
  ] },
  { who: 'hote', t: 'Installer le système', steps: distro === 'debian' ? [
    { x: 'Graphical install : langue English, pays France, clavier French, nom de machine butgames-dev.' },
    { x: 'Mot de passe root : laisser VIDE. Utilisateur alice, mot de passe alice@but.' },
    { x: 'Partitionnement : disque entier, une seule partition. Miroir France. Logiciels : Debian desktop environment + Xfce + standard system utilities (sans GNOME).' }
  ] : [
    { x: 'Install Xubuntu : langue English, clavier French, effacer le disque et installer, fuseau Paris.' },
    { x: 'Utilisateur alice, ordinateur butgames-dev, mot de passe alice@but, sans connexion automatique.' }
  ] },
  { who: 'alice', t: 'Système : mises à jour, outils VMware, langue, clavier, fuseau', steps: [
    { c: 'sudo apt update && sudo apt full-upgrade -y' },
    { c: 'sudo apt install -y git curl wget ca-certificates gpg apt-transport-https bash-completion locales open-vm-tools open-vm-tools-desktop' },
    distro === 'debian'
      ? { x: 'Langue anglaise :', c: "sudo sed -i 's/^# *\\(en_US.UTF-8 UTF-8\\)/\\1/' /etc/locale.gen\nsudo locale-gen\nsudo update-locale LANG=en_US.UTF-8" }
      : { x: 'Langue anglaise :', c: 'sudo apt install -y language-pack-en\nsudo locale-gen en_US.UTF-8\nsudo update-locale LANG=en_US.UTF-8' },
    { x: 'Clavier français et fuseau horaire :', c: 'sudo localectl set-x11-keymap fr pc105\nsudo timedatectl set-timezone Europe/Paris' }
  ] },
  { who: 'alice', t: 'Comptes', steps: [
    { c: 'sudo useradd -m -s /bin/bash -c "Bob" bob\necho \'alice:alice@but\' | sudo chpasswd\necho \'bob:bob@but\' | sudo chpasswd\nsudo usermod -aG sudo alice' }
  ] },
  { who: 'alice', t: 'Go', steps: [ goSrc === 'apt'
    ? { x: 'Paquet de la distribution :', c: 'sudo apt install -y golang-go' }
    : { x: 'Archive officielle go.dev :', c: GO_CMDS } ] },
  { who: 'alice', t: 'Visual Studio Code', steps: [ { x: 'Dépôt apt officiel de Microsoft :', c: CODE_CMDS } ] },
  { who: 'alice', t: 'Prompt git et PATH (un fichier commun)', steps: [
    { x: 'Créer /etc/butgames.bashrc (contenu : voir l\'étape « Prompt ») puis le charger depuis chaque .bashrc :', c: 'for rc in /etc/skel/.bashrc /home/alice/.bashrc /home/bob/.bashrc; do\n  echo \'[ -r /etc/butgames.bashrc ] && . /etc/butgames.bashrc\' | sudo tee -a "$rc" >/dev/null\ndone' }
  ] },
  { who: 'bob', t: 'Environnement de développement (dans le compte de bob)', steps: [
    { c: 'git config --global user.name "Bob"\ngit config --global user.email "bob@butgames.local"' },
    { c: 'code --install-extension golang.go' },
    { c: 'go install golang.org/x/tools/gopls@latest\ngo install github.com/go-delve/delve/cmd/dlv@latest\ngo install honnef.co/go/tools/cmd/staticcheck@latest' }
  ] },
  { who: 'bob', t: 'Valider l\'installation', steps: [
    { c: 'mkdir -p ~/projets && cd ~/projets\ngit clone --branch langage_go ' + GIT_URL + '\ncd hello.sae4.but1.iut\n./test.sh 2>&1 | tee ~/preuve-test.txt; echo "code retour : ${PIPESTATUS[0]}"' }
  ] }
];
function memoText(distro, goSrc) {
  const out = [];
  let n = 0;
  MEMO(distro, goSrc).forEach(g => {
    out.push(`${++n}. [${WHO[g.who]}] ${g.t}`);
    g.steps.forEach(s => {
      if (s.x) out.push('   ' + s.x);
      if (s.c) out.push(s.c.split('\n').map(l => '       ' + l).join('\n'));
    });
  });
  return out.join('\n');
}

addSec({
  id: 'notice', group: 'Rendre', title: 'Notice et portfolio',
  lead: "Créer un projet Go, apporter la preuve du test d'installation, rédiger le texte du portfolio.",
  body: () => R`
<p>La notice d'utilisation s'adresse à l'équipe de développeurs : elle doit leur permettre de <strong>créer un projet Go</strong>, de <strong>vérifier le test d'installation</strong>, et contient ton texte de <strong>portfolio</strong>.</p>

<h2>1. Créer un nouveau projet Go</h2>
<p>${who('bob')} Un projet Go est un <strong>module</strong> : un dossier avec un fichier <code>go.mod</code>.</p>
${sh(R`mkdir -p ~/projets/mon-projet && cd ~/projets/mon-projet
git init                       # le prompt affiche maintenant (main)
go mod init mon-projet         # crée go.mod : le nom du module
code .                         # ouvre le dossier dans VS Code`)}
<p>Crée le fichier <code>main.go</code> (dans VS Code : <em>Nouveau fichier</em>) :</p>
${file('main.go', R`package main

import "fmt"

func main() {
	fmt.Println("Bonjour BUTGAMES !")
}`)}
${sh(R`go run .          # compile et lance, sans garder de fichier
go build -o jeu    # produit l'exécutable ./jeu
./jeu`)}
<p>Un test se place dans un fichier qui finit par <code>_test.go</code> :</p>
${file('main_test.go', R`package main

import "testing"

func TestAddition(t *testing.T) {
	if 2+2 != 4 {
		t.Fatal("les maths sont cassées")
	}
}`)}
${sh(R`go test ./...    # lance tous les tests du projet`)}
${tbl(['Commande', 'Rôle'], [
  [c('go mod init nom'), 'crée un nouveau module (fichier go.mod)'],
  [c('go run .'), 'compile et exécute le programme du dossier'],
  [c('go build'), 'compile et produit un exécutable'],
  [c('go test ./...'), 'lance les tests de tous les paquets'],
  [c('go fmt ./...'), 'met le code au format officiel'],
  [c('go vet ./...'), 'repère des erreurs probables'],
  [c('go mod tidy'), 'met à jour les dépendances du go.mod'],
  [c('go get paquet'), 'ajoute une dépendance']
])}
<p>Dans VS Code, avec l'extension Go : complétion et erreurs en direct (gopls), ${kbd('F5')} pour exécuter et déboguer, et un bouton « run test » au-dessus de chaque test.</p>

<h2>2. Vérifier le test d'installation</h2>

  const f = (k, lab, type, extra) => `<label>${lab}<input data-gen="${k}" type="${type}" value="${esc(g[k])}" ${extra || ''}></label>`;
  host.innerHTML = `<div class="w-title">Brouillon du dossier d'étude</div>
  <div class="form-g">
    <label>Distribution et version<input data-gen="distro" list="gen-distros" value="${esc(g.distro)}" autocomplete="off"><datalist id="gen-distros"><option value="Debian 13 « trixie » + Xfce"><option value="Debian 12 « bookworm » + Xfce"><option value="Xubuntu 24.04 LTS (Xfce)"><option value="Xubuntu LTS plus récente (Xfce)"></datalist></label>
    ${f('vcpu', 'vCPU', 'number', 'min="1" max="16" inputmode="numeric"')}${f('ram', 'RAM (Go)', 'number', 'min="1" max="64" inputmode="numeric"')}${f('disk', 'Disque (Go)', 'number', 'min="10" max="500" inputmode="numeric"')}
    <label>Go<select data-gen="go"><option value="tarball"${g.go === 'tarball' ? ' selected' : ''}>Archive officielle go.dev</option><option value="apt"${g.go === 'apt' ? ' selected' : ''}>Paquet de la distribution</option></select></label>
    <label>VS Code<select data-gen="code"><option value="repo"${g.code === 'repo' ? ' selected' : ''}>Dépôt apt Microsoft</option><option value="deb"${g.code === 'deb' ? ' selected' : ''}>Paquet .deb</option><option value="snap"${g.code === 'snap' ? ' selected' : ''}>Snap</option></select></label>
    ${f('host', 'Poste hôte (facultatif)', 'text', 'placeholder="ex. PC de l\'IUT, 16 Go, 8 threads"')}${f('names', 'Auteurs (facultatif)', 'text', 'placeholder="Prénom Nom, Prénom Nom"')}
  </div>
  <label class="gen-chk"><input type="checkbox" data-gen-cmds checked> Ajouter la liste minimale des commandes</label>
  <textarea class="gen-out" readonly aria-label="Brouillon généré" spellcheck="false"></textarea>
  <div class="gen-bar"><button type="button" class="btn" data-act="copy-gen">Copier le brouillon</button><button type="button" class="btn ghost" data-act="dl-gen">Télécharger (.md)</button><button type="button" class="btn ghost" data-act="reset-gen">Remettre à zéro</button></div>`;
  const out = $('.gen-out', host);
  const build = () => {
    const cur = genData();
    let t = genMarkdown(cur);
    if ($('[data-gen-cmds]', host).checked) t += '\n\n### 5. Liste minimale des actions et commandes (installation)\n\n' + memoText(cur.deb ? 'debian' : 'xubuntu', cur.go);
    out.value = t;
  };
  host._build = build;
  if (!host._bound) {
    host._bound = true;
    host.addEventListener('input', e => {
      const k = e.target.dataset && e.target.dataset.gen;
      if (k) { Store.data.gen[k] = ['vcpu', 'ram', 'disk'].includes(k) ? Math.max(1, +e.target.value || 1) : e.target.value; Store.save(); }
      host._build();
    });
    host.addEventListener('change', () => host._build());
  }
  build();
}
function mountTimer(host) {
  const total = PHASES.reduce((a, p) => a + p.s, 0);
  let elapsed = 0, run = false, iv = null, t0 = 0, base = 0;
  const mmss = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  host.innerHTML = `<div class="tm-clock" aria-live="off">15:00</div><div class="tm-phase"></div><div class="tm-bar"><i></i></div>
  <div class="gen-bar"><button type="button" class="btn" data-tm="go">Démarrer</button><button type="button" class="btn ghost" data-tm="reset">Remettre à zéro</button></div>
  <ol class="tm-list">${PHASES.map((p, i) => `<li data-i="${i}"><span class="tm-m"></span><span>${esc(p.t)}</span></li>`).join('')}</ol><p class="muted-s tm-tip"></p>`;
  const draw = () => {
    const left = Math.max(0, total - elapsed);
    const clock = $('.tm-clock', host); clock.textContent = mmss(left); clock.classList.toggle('low', left <= 300 && elapsed > 0);
    let acc = 0, cur = PHASES.length - 1, curEnd = total;
    for (let i = 0; i < PHASES.length; i++) { acc += PHASES[i].s; if (elapsed < acc) { cur = i; curEnd = acc; break; } }
    const finished = elapsed >= total;
    $('.tm-phase', host).textContent = finished ? 'Temps écoulé' : (elapsed === 0 && !run ? 'Prêt' : `${PHASES[cur].t} · encore ${mmss(curEnd - elapsed)}`);
    $('.tm-tip', host).textContent = finished ? '' : PHASES[cur].tip;
    $('.tm-bar i', host).style.width = Math.min(100, 100 * elapsed / total) + '%';
    let start = 0;
    $$('.tm-list li', host).forEach((li, i) => {
      const p = PHASES[i]; $('.tm-m', li).textContent = mmss(start) + ' → ' + mmss(start + p.s);
      li.classList.toggle('cur', !finished && i === cur && (run || elapsed > 0)); li.classList.toggle('done', elapsed >= start + p.s); start += p.s;
    });
    $('[data-tm=go]', host).textContent = run ? 'Pause' : (elapsed > 0 && !finished ? 'Reprendre' : 'Démarrer');
  };
  const tick = () => { elapsed = Math.min(total, base + Math.floor((Date.now() - t0) / 1000)); if (elapsed >= total) { stop(); } draw(); };
  const stop = () => { run = false; clearInterval(iv); iv = null; };
  host.addEventListener('click', e => {
    const b = e.target.closest('[data-tm]'); if (!b) return;
    if (b.dataset.tm === 'go') {
      if (run) { stop(); } else { if (elapsed >= total) elapsed = 0; base = elapsed; t0 = Date.now(); run = true; iv = setInterval(tick, 250); }
    } else { stop(); elapsed = 0; base = 0; }
    draw();
  });
  host._cleanup = stop;
  draw();
}
function mountDep(host) {
  const q = $('#dep-q', host), rows = $$('#dep-t tbody tr', host), n = $('#dep-n', host);
  const f = () => {
    const words = q.value.toLowerCase().split(/\s+/).filter(Boolean); let k = 0;
    rows.forEach(r => { const ok = words.every(w => r.dataset.t.includes(w)); r.hidden = !ok; if (ok) k++; });
    n.textContent = words.length ? `${k} résultat${k > 1 ? 's' : ''} sur ${rows.length}` : `${rows.length} problèmes décrits`;
  };
  q.addEventListener('input', f); f();
}
function mountWidgets(root) {
  $$('[data-widget]', root).forEach(h => {
    const k = h.dataset.widget;
    if (k === 'timeline') mountTimeline(h); else if (k === 'countdown') mountCountdown(h);
    else if (k === 'calc') mountCalc(h); else if (k === 'gen') mountGen(h); else if (k === 'timer') mountTimer(h);
  });
  if ($('#dep-q', root)) mountDep(root);
}

/* ---------- Progression, distribution, navigation ---------- */
window.updateProgress = function () {
  const p = progress(), pct = Math.round(100 * p.done / p.total);
  const bar = $('#prog-bar'), txt = $('#prog-txt');
  if (bar) { bar.style.width = pct + '%'; bar.parentElement.setAttribute('aria-valuenow', String(pct)); }
  if (txt) txt.textContent = `${p.done}/${p.total} cases`;
  $$('.nav a').forEach(a => { const s = SEC[a.dataset.id]; a.classList.toggle('is-done', !!s && secDone(s)); });
  $$('.skill[data-l]').forEach(s => s.classList.toggle('is-done', secDone(SEC[s.dataset.l])));
  const sum = $('#home-sum'); if (sum) sum.innerHTML = homeSummary();
  $$('.ck-box').forEach(b => { const s = SEC[b.dataset.sec]; if (!s) return; const n = s.check.filter(([id]) => Store.data.chk[id]).length; $('.ck-n', b).textContent = n + '/' + s.check.length; b.classList.toggle('is-done', n === s.check.length); });
  try { localStorage.setItem('hub:systeme/sae-103', JSON.stringify({ done: p.done, total: p.total, lessons: p.lessons, nl: p.nl, unit: 'cases cochées' })); } catch (e) { /* stockage indisponible */ }
};
function applyDistro() {
  const d = Store.data.distro;
  document.body.dataset.distro = d;
  $$('.dist-seg button, .pick button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.setDistro === d)));
}
function setDistro(d) {
  Store.data.distro = d === 'xubuntu' ? 'xubuntu' : 'debian'; Store.save();
  const id = currentId();
  if (id === 'memo' || id === 'rapport') route(true); else applyDistro();
}
const currentId = () => { const id = (location.hash || '').replace('#', ''); return ALL_IDS.includes(id) ? id : 'accueil'; };
function route(keepScroll) {
  const id = currentId(), s = SEC[id], m = $('#main');
  $$('[data-widget=timer]', m).forEach(h => h._cleanup && h._cleanup());
  const y = window.scrollY;
  m.innerHTML = id === 'accueil' ? pageAccueil() : pageSection(s);
  $$('.nav a').forEach(a => a.setAttribute('aria-current', a.dataset.id === id ? 'page' : 'false'));
  document.title = id === 'accueil' ? 'SAE 1.03 · Installation de poste' : s.title + ' · SAE 1.03';
  applyDistro(); mountWidgets(m); window.updateProgress(); closeDrawer();
  if (keepScroll === true) window.scrollTo(0, y); else { window.scrollTo(0, 0); m.focus({ preventScroll: true }); }
}
function closeDrawer() { document.body.classList.remove('drawer-open'); const b = $('#menu-btn'); if (b) b.setAttribute('aria-expanded', 'false'); }
function setTheme(t) { try { localStorage.setItem('cours-theme', t || ''); } catch (e) { /* stockage indisponible */ } if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }

function init() {
  $('#app').innerHTML = `
<a class="skip" href="#main">Aller au contenu</a>
<header class="top">
  <button type="button" id="menu-btn" class="icon-btn" aria-label="Menu" aria-expanded="false" aria-controls="side">☰</button>
  <a class="back" href="index.html" title="Retour à la matière" aria-label="Retour à la matière">⌂</a><a class="brand" href="#accueil"><span class="brand-mark">SAE</span>1.03 <small>installation de poste</small></a>
  <div class="meter" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="prog-bar"></i></div>
  <span id="prog-txt" class="prog-txt"></span>
  <div class="tools"><span class="dist-lbl">Distribution</span><div class="seg dist-seg" role="group" aria-label="Distribution"><button type="button" data-set-distro="debian" aria-pressed="true">Debian</button><button type="button" data-set-distro="xubuntu" aria-pressed="false">Xubuntu</button></div><button type="button" id="theme-btn" class="icon-btn" aria-label="Changer le thème" title="Thème clair / sombre">◐</button></div>
</header>
<div class="shell"><nav id="side" class="side nav" aria-label="Sommaire">${navHTML()}</nav><div class="scrim" data-app="scrim"></div><main id="main" tabindex="-1"></main></div>`;
  document.addEventListener('click', e => {
    const dist = e.target.closest('[data-set-distro]');
    if (dist) { setDistro(dist.dataset.setDistro); return; }
    const a = e.target.closest('[data-act]');
    if (a) { act(a); return; }
    if (e.target.closest('[data-app="scrim"]')) closeDrawer();
  });
  document.addEventListener('change', e => {
    const id = e.target.dataset && e.target.dataset.ck;
    if (id) { Store.data.chk[id] = e.target.checked; if (!e.target.checked) delete Store.data.chk[id]; Store.save(); window.updateProgress(); }
  });
  $('#menu-btn').addEventListener('click', () => { const o = document.body.classList.toggle('drawer-open'); $('#menu-btn').setAttribute('aria-expanded', String(o)); });
  $('#theme-btn').addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    setTheme(dark ? 'light' : 'dark');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
  window.addEventListener('hashchange', () => route());
  route();
}
async function act(b) {
  const k = b.dataset.act;
  if (k === 'copy') {
    const fig = b.closest('figure'), t = fig.dataset.copy !== undefined ? fig.dataset.copy : $('pre', fig).textContent;
    flash(b, (await copyText(t)) ? 'Copié ✓' : 'Copie impossible');
  } else if (k === 'copy-src') {
    flash(b, (await copyText($('#' + b.dataset.src).textContent.replace(/^\n+/, ''))) ? 'Copié ✓' : 'Copie impossible');
  } else if (k === 'dl-src') {
    download(b.dataset.name, $('#' + b.dataset.src).textContent.replace(/^\n+/, ''), 'text/x-shellscript'); flash(b, 'Téléchargé ✓');
  } else if (k === 'dl-arch') {
    download('architecture-logicielle.svg', archSVG(true), 'image/svg+xml'); flash(b, 'Téléchargé ✓');
  } else if (k === 'copy-gen') {
    flash(b, (await copyText($('.gen-out').value)) ? 'Copié ✓' : 'Copie impossible');
  } else if (k === 'dl-gen') {
    download('dossier-etude-sae103.md', $('.gen-out').value, 'text/markdown'); flash(b, 'Téléchargé ✓');
  } else if (k === 'reset-gen') {
    Store.data.gen = {}; Store.save(); mountGen($('[data-widget=gen]'));
  } else if (k === 'copy-memo' || k === 'dl-memo') {
    const t = 'SAE 1.03 - Liste minimale des actions et commandes (' + DIST_NAME[Store.data.distro] + ')\n\n' + memoText(Store.data.distro, 'tarball');
    if (k === 'copy-memo') flash(b, (await copyText(t)) ? 'Copié ✓' : 'Copie impossible'); else { download('commandes-minimales-sae103.txt', t); flash(b, 'Téléchargé ✓'); }
  }
}
init();
</script>
