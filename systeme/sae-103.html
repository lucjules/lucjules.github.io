<!-- Les trois scripts : une seule source, utilisée pour l'affichage, la copie et le téléchargement -->
<script type="text/plain" id="src-alice">
#!/usr/bin/env bash
# SAE 1.03 - Installation de poste BUTGAMES : préparation de la machine
# Debian 12/13 ou Xubuntu/Ubuntu LTS, bureau XFCE.
#
# À lancer depuis le compte d'alice (administratrice) :   sudo bash sae-alice.sh
#
# Options (variables d'environnement, à placer avant la commande) :
#   GO_SOURCE=tarball|apt   origine de Go (défaut : tarball = dernière version officielle de go.dev)
#   UPGRADE=0|1             mettre à jour tout le système d'abord (défaut : 1)
#   BOB_TOOLS=0|1           installer l'extension Go et les outils Go dans le compte de bob (défaut : 1)
#   ONLY="comptes prompt"   ne lancer que ces étapes (liste en bas du script)
# Exemples :   sudo GO_SOURCE=apt UPGRADE=0 bash sae-alice.sh
#              sudo ONLY="droits" bash sae-alice.sh      (répare les permissions de bob)
# Le script peut être relancé autant de fois que nécessaire.
set -euo pipefail

GO_SOURCE=${GO_SOURCE:-tarball}
UPGRADE=${UPGRADE:-1}
BOB_TOOLS=${BOB_TOOLS:-1}
ONLY=${ONLY:-}

LOCALE=en_US.UTF-8        # système en anglais
KB_LAYOUT=fr              # clavier français
TZONE=Europe/Paris
ALICE_PW='alice@but'      # mots de passe imposés par le sujet
BOB_PW='bob@but'
SHARED_RC=/etc/butgames.bashrc
MARK='# >>> butgames >>>'
APT="apt-get -y -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold"
export DEBIAN_FRONTEND=noninteractive

log()  { printf '\n\033[1;34m==>\033[0m \033[1m%s\033[0m\n' "$*"; }
ok()   { printf '  \033[32m✔\033[0m %s\n' "$*"; }
warn() { printf '  \033[33m!\033[0m %s\n' "$*" >&2; }
die()  { printf '\033[31mErreur :\033[0m %s\n' "$*" >&2; exit 1; }

[ "$(id -u)" -eq 0 ] || die "lance ce script avec sudo :  sudo bash $0"
# shellcheck disable=SC1091
. /etc/os-release
case "${ID:-}" in
  debian|ubuntu) ;;
  *) die "distribution non prévue : ${ID:-inconnue} (Debian ou Ubuntu/Xubuntu attendues)" ;;
esac

step_paquets() {
  log "Paquets de base (git, curl, outils VMware...)"
  # Debian installée depuis un CD/ISO : une ligne « deb cdrom: » bloque apt update
  [ -f /etc/apt/sources.list ] && sed -i 's/^deb cdrom:/# deb cdrom:/' /etc/apt/sources.list
  $APT update
  if [ "$UPGRADE" = 1 ]; then $APT full-upgrade; fi
  $APT install sudo git curl wget ca-certificates gpg apt-transport-https \
      bash-completion locales open-vm-tools open-vm-tools-desktop
  ok "$(git --version)"
}

step_locale() {
  log "Langue du système : anglais ($LOCALE)"
  if [ "$ID" = ubuntu ]; then $APT install language-pack-en; fi
  if [ -f /etc/locale.gen ]; then sed -i "s/^# *\($LOCALE UTF-8\)/\1/" /etc/locale.gen; fi
  locale-gen >/dev/null
  update-locale LANG="$LOCALE"
  ok "LANG=$LOCALE dans /etc/default/locale"
}

step_clavier() {
  log "Clavier : disposition française ($KB_LAYOUT)"
  cat > /etc/default/keyboard <<EOF
# Fichier lu par la console et par le serveur graphique (Xorg)
XKBMODEL="pc105"
XKBLAYOUT="$KB_LAYOUT"
XKBVARIANT=""
XKBOPTIONS=""

BACKSPACE="guess"
EOF
  if command -v localectl >/dev/null 2>&1; then
    localectl set-x11-keymap "$KB_LAYOUT" pc105 >/dev/null 2>&1 || warn "localectl indisponible : /etc/default/keyboard suffit après redémarrage"
  fi
  ok "XKBLAYOUT=\"$KB_LAYOUT\" dans /etc/default/keyboard (effectif après reconnexion)"
}

step_fuseau() {
  log "Fuseau horaire : $TZONE"
  if ! timedatectl set-timezone "$TZONE" >/dev/null 2>&1; then
    ln -sf "/usr/share/zoneinfo/$TZONE" /etc/localtime
    echo "$TZONE" > /etc/timezone
  fi
  ok "$TZONE"
}

step_comptes() {
  log "Comptes : alice (administratrice) et bob (développeur)"
  local u
  for u in alice bob; do
    id "$u" >/dev/null 2>&1 || useradd -m -s /bin/bash -c "${u^}" "$u"
  done
  echo "alice:$ALICE_PW" | chpasswd
  echo "bob:$BOB_PW" | chpasswd
  usermod -aG sudo alice                       # alice administre : sudo
  gpasswd -d bob sudo >/dev/null 2>&1 || true   # bob n'est PAS administrateur
  gpasswd -d bob admin >/dev/null 2>&1 || true
  ok "alice : $(id -nG alice)"
  ok "bob   : $(id -nG bob)"
}

step_go() {
  log "Go (source : $GO_SOURCE)"
  if [ "$GO_SOURCE" = apt ]; then
    $APT install golang-go
  else
    local arch json ver file sha tmp
    arch=$(dpkg --print-architecture)           # amd64 ou arm64, comme chez go.dev
    case "$arch" in amd64|arm64) ;; *) die "architecture non prise en charge : $arch" ;; esac
    json=$(curl -fsSL 'https://go.dev/dl/?mode=json')
    ver=$(printf '%s' "$json" | grep -m1 -o '"version": *"go[0-9.]*"' | grep -o 'go[0-9.]*')
    file="$ver.linux-$arch.tar.gz"
    sha=$(printf '%s' "$json" | grep -A6 -F "\"filename\": \"$file\"" | grep -m1 -o '"sha256": *"[0-9a-f]*"' | grep -o '[0-9a-f]\{64\}')
    { [ -n "$ver" ] && [ -n "$sha" ]; } || die "version ou empreinte de Go introuvable sur go.dev"
    tmp=$(mktemp -d)
    curl -fsSL -o "$tmp/$file" "https://go.dev/dl/$file"
    echo "$sha  $tmp/$file" | sha256sum -c -         # vérifie l'intégrité du téléchargement
    rm -rf /usr/local/go
    tar -C /usr/local --no-same-owner -xzf "$tmp/$file"   # les fichiers appartiennent à root
    chmod -R a+rX /usr/local/go                          # lisibles et exécutables par bob
    rm -rf "$tmp"
    ln -sf /usr/local/go/bin/go /usr/local/bin/go         # `go` visible dans tous les shells
    ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
  fi
  cat > /etc/profile.d/go.sh <<'EOF'
case ":$PATH:" in *:/usr/local/go/bin:*) ;; *) PATH="$PATH:/usr/local/go/bin" ;; esac
export PATH
EOF
  ok "$(go version)"
}

step_vscode() {
  log "Visual Studio Code (dépôt apt officiel de Microsoft)"
  curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor --yes -o /usr/share/keyrings/microsoft.gpg
  chmod 644 /usr/share/keyrings/microsoft.gpg
  rm -f /etc/apt/sources.list.d/vscode.list     # évite un doublon si le .deb a déjà ajouté le dépôt
  cat > /etc/apt/sources.list.d/vscode.sources <<EOF
Types: deb
URIs: https://packages.microsoft.com/repos/code
Suites: stable
Components: main
Architectures: $(dpkg --print-architecture)
Signed-By: /usr/share/keyrings/microsoft.gpg
EOF
  $APT update
  $APT install code
  ok "$(code --version --user-data-dir=/tmp/vscode-root 2>/dev/null | head -1 || echo installé)"
}

step_lisezmoi() {
  log "Fichier LISEZMOI sur le bureau d'alice et de bob"
  local u
  for u in alice bob; do
    install -d -o "$u" -g "$u" "/home/$u/Desktop"
    cat > "/home/$u/Desktop/LISEZMOI.txt" <<'EOF'
BUTGAMES - poste de développement Go

Comptes
  alice / alice@but   administratrice (sudo) : installe et met à jour les logiciels
  bob   / bob@but     développeur : écrit, compile et lance les programmes Go

Premiers pas, en tant que bob
  1. Ouvrir un terminal : le prompt affiche la branche git, par exemple (langage_go *)
  2. git clone --branch langage_go https://gitlab-ce.iut.u-bordeaux.fr/rgiot/hello.sae4.but1.iut.git
  3. cd hello.sae4.but1.iut && ./test.sh
  4. Nouveau projet Go : mkdir mon-projet && cd mon-projet && go mod init mon-projet && code .

Besoin d'un logiciel ? bob n'a pas sudo : demander à alice (sudo apt install ...).
EOF
    chown "$u:$u" "/home/$u/Desktop/LISEZMOI.txt"
  done
  ok "LISEZMOI.txt créé"
}

step_prompt() {
  log "Prompt bash avec l'état du dépôt git (+ PATH de Go)"
  cat > "$SHARED_RC" <<'EOF'
# /etc/butgames.bashrc - chargé par le ~/.bashrc de chaque utilisateur (shells interactifs)

# PATH : Go, et les outils Go installés par l'utilisateur (gopls, dlv...)
case ":$PATH:" in *:/usr/local/go/bin:*) ;; *) PATH="$PATH:/usr/local/go/bin" ;; esac
case ":$PATH:" in *":$HOME/go/bin:"*) ;; *) PATH="$PATH:$HOME/go/bin" ;; esac
export PATH

# Prompt : utilisateur@machine:dossier (branche état-du-dépôt)$
if [ -r /usr/lib/git-core/git-sh-prompt ]; then
  . /usr/lib/git-core/git-sh-prompt
  GIT_PS1_SHOWDIRTYSTATE=1       # * = modifications non indexées, + = modifications indexées
  GIT_PS1_SHOWUNTRACKEDFILES=1   # % = fichiers non suivis
  GIT_PS1_SHOWSTASHSTATE=1       # $ = du travail mis de côté (git stash)
  GIT_PS1_SHOWUPSTREAM=auto      # < en retard, > en avance, = à jour, <> divergent
  # Apostrophes : $(__git_ps1) doit être évalué à CHAQUE affichage du prompt, pas une fois pour toutes
  PS1='${debian_chroot:+($debian_chroot)}\[\033[01;32m\]\u@\h\[\033[00m\]:\[\033[01;34m\]\w\[\033[00m\]\[\033[01;33m\]$(__git_ps1 " (%s)")\[\033[00m\]\$ '
fi
EOF
  local rc
  for rc in /etc/skel/.bashrc /home/alice/.bashrc /home/bob/.bashrc; do
    [ -f "$rc" ] || continue
    if ! grep -qF "$MARK" "$rc"; then
      printf '\n%s\n[ -r %s ] && . %s\n# <<< butgames <<<\n' "$MARK" "$SHARED_RC" "$SHARED_RC" >> "$rc"
    fi
  done
  ok "prompt et PATH définis dans $SHARED_RC, chargés par alice, bob et les futurs comptes (/etc/skel)"
}

step_bob() {
  if [ "$BOB_TOOLS" != 1 ]; then warn "BOB_TOOLS=$BOB_TOOLS : étape ignorée"; return 0; fi
  log "Compte de bob : identité git, extension Go de VS Code, outils Go (dans son home, sans droits admin)"
  runuser -l bob -c 'git config --global user.name "Bob" && git config --global user.email "bob@butgames.local" && git config --global init.defaultBranch main'
  runuser -l bob -c 'code --install-extension golang.go --force' \
    || warn "extension non installée : refais « code --install-extension golang.go » depuis la session de bob"
  runuser -l bob -c 'go install golang.org/x/tools/gopls@latest'            || warn "gopls non installé (réseau ?)"
  runuser -l bob -c 'go install github.com/go-delve/delve/cmd/dlv@latest'  || warn "dlv non installé (réseau ?)"
  runuser -l bob -c 'go install honnef.co/go/tools/cmd/staticcheck@latest' || warn "staticcheck non installé (réseau ?)"
  ok "extensions de bob : $(runuser -l bob -c 'code --list-extensions' 2>/dev/null | tr '\n' ' ')"
}

step_partage() {
  log "Scripts partagés dans /opt/butgames (lisibles par alice ET par bob)"
  # Le dossier ~/Downloads d'alice est privé : bob ne peut pas y lire un script.
  local src f n=0
  src=$(cd "$(dirname "$0")" && pwd)
  install -d -m 0755 /opt/butgames
  if [ "$src" = /opt/butgames ]; then ok "le script est déjà dans /opt/butgames"; return 0; fi
  for f in "$src"/sae-*.sh; do
    [ -f "$f" ] || continue
    install -m 0755 "$f" /opt/butgames/
    n=$((n+1))
  done
  ok "$n script(s) dans /opt/butgames : bob lance « bash /opt/butgames/sae-bob.sh »"
}

step_droits() {
  log "Droits : chacun possède son dossier, tout le monde lit ce qui est partagé"
  local u
  for u in alice bob; do
    if id "$u" >/dev/null 2>&1; then
      chown -R "$u:$(id -gn "$u")" "/home/$u"     # répare ce qu'un sudo a laissé à root
    fi
  done
  [ -f "$SHARED_RC" ] && chmod 0644 "$SHARED_RC"
  [ -d /usr/local/go ] && chmod -R a+rX /usr/local/go
  [ -d /opt/butgames ] && chmod -R a+rX /opt/butgames
  gpasswd -d bob sudo >/dev/null 2>&1 || true      # bob n'a PAS les droits d'administration (voulu)
  ok "dossiers personnels rendus à leur propriétaire, fichiers partagés lisibles"
}

run() { if [ -z "$ONLY" ] || [[ " $ONLY " == *" $1 "* ]]; then "step_$1"; fi; }
# Ordre : paquets locale clavier fuseau comptes go vscode lisezmoi prompt bob partage droits
for s in paquets locale clavier fuseau comptes go vscode lisezmoi prompt bob partage droits; do run "$s"; done

log "Terminé"
echo "  1. Redémarre la machine (clavier et langue pris en compte)  :  sudo reboot"
echo "  2. Ouvre la session de bob et lance :  bash /opt/butgames/sae-bob.sh"
echo "  3. Dans la session d'alice, vérifie tout :  sudo bash /opt/butgames/sae-verif.sh"
</script>
<script type="text/plain" id="src-bob">
#!/usr/bin/env bash
# SAE 1.03 - côté bob (développeur) : cloner le dépôt de validation et lancer test.sh
#
# À lancer depuis le compte de BOB, SANS sudo :   bash /opt/butgames/sae-bob.sh
# (le script est dans /opt/butgames, lisible par tous : le dossier ~/Downloads d'alice est privé)
set -uo pipefail

REPO=https://gitlab-ce.iut.u-bordeaux.fr/rgiot/hello.sae4.but1.iut.git
BRANCH=langage_go
DIR=$HOME/projets
LOG=$HOME/preuve-test.txt

stop() { printf '\033[31mArrêt :\033[0m %s\n' "$*" >&2; exit 1; }

# --- Contrôles avant de commencer ---
[ "$(id -u)" -ne 0 ] || stop "ne lance pas ce script en root ni avec sudo : ouvre une session de bob."
[ "$(id -un)" = bob ] || echo "(attention : tu es « $(id -un) » et non bob)"
cd "$HOME" || stop "impossible d'entrer dans $HOME."      # évite de rester dans le dossier d'un autre compte
[ -w "$HOME" ] || stop "$HOME n'est pas accessible en écriture. Dans la session d'alice : sudo chown -R bob:bob /home/bob"
command -v git >/dev/null || stop "git n'est pas installé. Dans la session d'alice : sudo apt install -y git"
command -v go  >/dev/null || stop "go n'est pas installé (ou pas dans le PATH). Dans la session d'alice : sudo bash /opt/butgames/sae-alice.sh"

# --- Clone (ou mise à jour si déjà cloné) ---
mkdir -p "$DIR" && cd "$DIR" || stop "impossible de créer $DIR."
name=$(basename "$REPO" .git)
if [ -d "$name/.git" ]; then
  echo "Dépôt déjà cloné : mise à jour de la branche $BRANCH"
  git -C "$name" fetch origin "$BRANCH" && git -C "$name" checkout "$BRANCH" && git -C "$name" pull --ff-only \
    || stop "mise à jour impossible : voir la page Dépannage du guide."
else
  git clone --branch "$BRANCH" "$REPO" || stop "clone impossible (réseau ? identifiants ? nom de branche ?) : voir la page Dépannage du guide."
fi
cd "$name" || stop "dossier $name introuvable."

echo; echo "Branche : $(git branch --show-current)"
[ -f test.sh ] || stop "test.sh est absent de ce dépôt : vérifie la branche ($BRANCH)."
echo "---- début de test.sh (lis-le avant de le lancer) ----"
head -n 40 test.sh
echo "-------------------------------------------------------"

# --- Test, avec trace pour le rapport ---
{
  date
  echo "machine : $(hostname) | utilisateur : $(id -un) | $(go version 2>&1)"
} | tee "$LOG"
if [ -x test.sh ]; then ./test.sh 2>&1 | tee -a "$LOG"; else bash test.sh 2>&1 | tee -a "$LOG"; fi
code=${PIPESTATUS[0]}
echo "code retour de test.sh : $code   (0 = aucune erreur)" | tee -a "$LOG"
echo "Trace enregistrée dans $LOG"
exit "$code"
</script>
<script type="text/plain" id="src-verif">
#!/usr/bin/env bash
# SAE 1.03 - vérifie chaque exigence du sujet : [ OK ] ou [FAIL] + la commande pour corriger
#
# Dans la session d'ALICE :   sudo bash /opt/butgames/sae-verif.sh
# Avec le test du projet :    sudo RUN_TEST=1 bash /opt/butgames/sae-verif.sh
set -uo pipefail
RUN_TEST=${RUN_TEST:-0}
REPO_DIR=/home/bob/projets/hello.sae4.but1.iut
[ "$(id -u)" -eq 0 ] || { echo "Lance avec sudo :  sudo bash $0"; exit 1; }

AL=/opt/butgames/sae-alice.sh
[ -f "$AL" ] || AL="$(cd "$(dirname "$0")" && pwd)/sae-alice.sh"
ok=0; ko=0; FIXES=()

# check "libellé" "commande(s) pour corriger" commande [arguments...]
check() {
  local label=$1 fix=$2; shift 2
  if "$@" >/dev/null 2>&1; then
    printf '  \033[32m[ OK ]\033[0m %s\n' "$label"; ok=$((ok+1))
  else
    printf '  \033[31m[FAIL]\033[0m %s\n' "$label"; ko=$((ko+1))
    printf '         \033[33mpour corriger :\033[0m %s\n' "$fix"
    FIXES+=("$fix")
  fi
}
as_bob()       { runuser -l bob -c "$1"; }
in_group()     { id -nG "$1" 2>/dev/null | tr ' ' '\n' | grep -qx "$2"; }
not_admin()    { ! id -nG "$1" 2>/dev/null | tr ' ' '\n' | grep -Eqx 'sudo|admin|wheel'; }
owns_home()    { [ -d "/home/$1" ] && [ -z "$(find "/home/$1" -xdev ! -user "$1" -print -quit 2>/dev/null)" ]; }
bob_no_sudo()  { ! as_bob 'sudo -n true'; }
prompt_works() { local d r; d=$(mktemp -d); git -C "$d" init -q -b langage_go && [ "$(bash -c '. /usr/lib/git-core/git-sh-prompt; cd "$1" && __git_ps1 "(%s)"' _ "$d")" = "(langage_go)" ]; r=$?; rm -rf "$d"; return $r; }
bob_prompt()   { as_bob 'bash -ic "echo \$PS1" 2>/dev/null' | grep -q __git_ps1; }
bob_ext()      { as_bob 'code --list-extensions 2>/dev/null' | grep -qix 'golang.go'; }
bob_branch()   { [ "$(as_bob "git -C $REPO_DIR branch --show-current")" = langage_go ]; }
bob_test()     { as_bob "cd $REPO_DIR && if [ -x test.sh ]; then ./test.sh; else bash test.sh; fi"; }
bob_hello()    { as_bob 'd=$(mktemp -d) && cd "$d" && go mod init essai >/dev/null 2>&1 && printf "package main\nimport \"fmt\"\nfunc main(){ fmt.Println(\"ok\") }\n" > main.go && [ "$(go run .)" = ok ]'; }
only()         { echo "sudo ONLY=\"$1\" bash $AL"; }

echo; echo "SAE 1.03 - vérification ($(. /etc/os-release; echo "$PRETTY_NAME"))"
echo; echo "Système"
check "Bureau XFCE installé"                          "sudo apt install -y xfce4"                         command -v xfce4-session
check "Langue du système : anglais (en_US.UTF-8)"     "$(only locale)"                                    grep -Eq '^LANG="?en_US' /etc/default/locale
check "Clavier : disposition française (fr)"          "$(only clavier)"                                   grep -q '^XKBLAYOUT="fr"' /etc/default/keyboard
check "Outils VMware installés (copier-coller)"       "sudo apt install -y open-vm-tools open-vm-tools-desktop"  dpkg -s open-vm-tools
echo; echo "Comptes et droits"
check "alice existe"                                  "$(only comptes)"                                   id alice
check "alice est administratrice (groupe sudo)"       "sudo usermod -aG sudo alice   (puis déconnexion / reconnexion)"  in_group alice sudo
check "bob existe"                                    "$(only comptes)"                                   id bob
check "bob n'est PAS administrateur (voulu)"          "sudo gpasswd -d bob sudo"                          not_admin bob
check "bob se voit refuser sudo (voulu)"              "regarde /etc/sudoers.d : bob ne doit y figurer nulle part"  bob_no_sudo
check "bob possède son dossier personnel"             "sudo chown -R bob:bob /home/bob"                   owns_home bob
check "alice possède son dossier personnel"           "sudo chown -R alice:alice /home/alice"             owns_home alice
check "bob peut écrire dans son dossier"              "sudo chown -R bob:bob /home/bob"                   as_bob 'f=$(mktemp ~/.essai.XXXXXX) && rm -f "$f"'
check "bob peut lire /etc/butgames.bashrc"            "sudo chmod 644 /etc/butgames.bashrc"               as_bob 'test -r /etc/butgames.bashrc'
check "bob peut lire les scripts de /opt/butgames"    "$(only partage)"                                   as_bob 'test -r /opt/butgames/sae-bob.sh'
echo; echo "Logiciels"
check "git installé"                                  "sudo apt install -y git"                           command -v git
check "Go installé (go version)"                      "$(only go)"                                        go version
check "bob peut lancer Go (droits sur /usr/local/go)" "sudo chmod -R a+rX /usr/local/go"                  as_bob 'go version'
check "Visual Studio Code installé (code)"            "$(only vscode)"                                    command -v code
check "Extension Go dans le compte de bob"            "en bob :  code --install-extension golang.go"      bob_ext
check "gopls (outil Go) dans le home de bob"          "en bob :  go install golang.org/x/tools/gopls@latest"  test -x /home/bob/go/bin/gopls
check "bob compile et lance un programme Go"          "en bob :  vérifie « go version » puis relance ce contrôle"  bob_hello
echo; echo "Prompt bash"
check "Fichier /etc/butgames.bashrc présent"          "$(only prompt)"                                    grep -q __git_ps1 /etc/butgames.bashrc
check "__git_ps1 affiche la branche d'un dépôt"       "sudo apt install -y git"                           prompt_works
check "Le ~/.bashrc d'alice charge ce prompt"         "$(only prompt)"                                    grep -q butgames /home/alice/.bashrc
check "Le ~/.bashrc de bob charge ce prompt"          "$(only prompt)"                                    grep -q butgames /home/bob/.bashrc
check "Le shell de bob utilise __git_ps1"             "$(only prompt)"                                    bob_prompt
echo; echo "Projet de validation"
check "Dépôt cloné dans le compte de bob"             "en bob :  bash /opt/butgames/sae-bob.sh"           test -d "$REPO_DIR/.git"
check "Le dépôt appartient à bob"                     "sudo chown -R bob:bob /home/bob/projets"           test "$(stat -c %U "$REPO_DIR" 2>/dev/null)" = bob

function colorLine(l) {

const horsChaine = t => (t.match(/'/g) || []).length % 2 === 0 && (t.match(/"/g) || []).length % 2 === 0;

function stripCom(text) {
  return text.split('\n').map(l => {
    if (/^\s*#/.test(l)) return null;
    const k = l.search(/\s#\s/);
    if (k > 0 && horsChaine(l.slice(0, k))) return l.slice(0, k).replace(/\s+$/, '');

async function copyText(t) {

  const ta = document.createElement('textarea');
  ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';

  let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove(); return ok;
}
function download(name, text, mime) {

  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

addSec({
  id: 'comptes', group: 'Installer', title: 'Les comptes alice et bob',
  lead: "Deux utilisateurs, deux rôles : alice administre (sudo), bob développe (sans sudo, et c'est voulu).",
  body: () => R`
<p>${who('alice')} Toutes les commandes se tapent en <strong>alice</strong>.</p>
<h2>Pourquoi deux comptes ?</h2>
<p>C'est le principe du <strong>moindre privilège</strong> : on ne travaille pas avec plus de droits que nécessaire. <strong>alice</strong> installe et met à jour (avec <code>sudo</code>) ; <strong>bob</strong> écrit, compile et lance du code, mais <strong>ne peut pas modifier le système</strong>. S'il lui manque un logiciel, il le demande à alice.</p>
${tbl(['', 'alice', 'bob'], [
  ['Rôle', 'Administration du poste', 'Développement en Go'],
  ['Mot de passe', c('alice@but'), c('bob@but')],
  ['Groupe sudo', '<strong>Oui</strong>', '<strong>Non</strong> : « bob is not in the sudoers file » est normal'],
  ['Installe des logiciels pour tous', 'Oui (apt, archive Go)', 'Non'],
  ['Installe dans son compte', 'Possible', 'Oui : extension VS Code, outils Go dans ~/go/bin'],
  ['Peut lire le dossier personnel de l\'autre', 'Non (privé)', 'Non (privé)']
])}
${note('attention', 'Les dossiers personnels sont privés', '<p>bob ne peut <strong>pas</strong> lire <code>/home/alice</code> (ni l\'inverse). Un fichier que bob doit utiliser (un script, un test) ne doit donc <strong>pas</strong> être dans le dossier d\'alice : on le met dans un dossier partagé (<code>/opt/butgames</code>, voir l\'étape « Scripts »). Et un dossier appartient à celui qui l\'a créé : bob ne peut pas écrire dans un dossier créé par alice.</p>')}

${chemin('A', 'À la main', 'commande par commande', R`
<h3>A1. Créer bob</h3>
${steps([
  { c: 'sudo useradd -m -s /bin/bash -c "Bob" bob', ok: "aucun message. Si tu vois <code>user 'bob' already exists</code>, bob existe déjà : passe à A2.", once: true }
])}
<p><code>-m</code> crée le dossier personnel <code>/home/bob</code>, <code>-s /bin/bash</code> lui donne le shell bash.</p>
<h3>A2. Les mots de passe imposés, et le groupe sudo d'alice</h3>
${sh(R`echo 'alice:alice@but' | sudo chpasswd
echo 'bob:bob@but' | sudo chpasswd
sudo usermod -aG sudo alice`, { once: false, fin: "Fixe les mots de passe imposés et met alice dans le groupe sudo." })}
<p><strong>Attendu :</strong> aucun message. Les apostrophes empêchent le shell d'interpréter les caractères spéciaux du mot de passe : garde-les. Alice reste administratrice : <code>-aG sudo</code> l'ajoute au groupe <code>sudo</code> sans la retirer des autres.</p>
<h3>A3. Vérifier les comptes</h3>
${steps([
  { c: 'id alice', ok: "la liste des groupes contient <code>sudo</code>, par exemple <code>uid=1000(alice) … 27(sudo)…</code>", once: false },
  { c: 'id bob', ok: "<strong>sans</strong> <code>sudo</code> : seulement <code>bob</code>, par exemple <code>uid=1001(bob) gid=1001(bob) groups=1001(bob)</code>", once: false },
  { c: 'getent passwd alice bob', ok: "deux lignes, une par compte.", once: false }
])}
<h3>A4. Tester la connexion de bob, en terminal</h3>
<p>Ces commandes se tapent <strong>une par une</strong>, parce que la première ouvre un <em>nouveau shell</em> : ce que tu tapes ensuite s'adresse à bob, pas à alice.</p>
${steps([
  { c: 'su - bob', ok: "mot de passe : <code>bob@but</code> (invisible). Le prompt devient <code>bob@butgames-dev:~$</code>.", once: false },
  { w: 'bob', c: 'whoami', ok: "<code>bob</code>.", once: false },
  { w: 'bob', c: 'pwd', ok: "<code>/home/bob</code>.", once: false },
  { w: 'bob', c: 'sudo ls', ok: "<strong>un refus</strong> : « bob is not in the sudoers file. This incident will be reported. » C'est <strong>normal et voulu</strong> : bob n'est pas administrateur.", once: false },

addSec({
  id: 'logiciels', group: 'Installer', title: 'git, Go et VS Code',
  lead: "Les logiciels installés pour tout le monde par alice, avec sudo.",
  body: () => R`
<p>${who('alice')} Installation système : le dossier d'installation reste à root. bob peut donc <em>utiliser</em> ces logiciels sans pouvoir les <em>modifier</em>.</p>
${chemin('A', 'À la main', 'commande par commande', R`
<h3>A1. git</h3>
${sh(R`sudo apt install -y git curl wget ca-certificates gpg apt-transport-https bash-completion`, { once: false })}
${steps([{ c: 'git --version', ok: "<code>git version 2.xx.x</code>.", once: false }])}

<h3>A2. Go : méthode 1, l'archive officielle (conseillée)</h3>
<p>Ce bloc utilise des <strong>variables</strong> (<code>ARCH</code>, <code>VER</code>, <code>SHA</code>) : colle-le <strong>en une seule fois, dans le même terminal</strong>. Si tu le coupes, garde le même terminal du début à la fin.</p>
${sh(R`# 1. Version stable la plus récente et architecture de ta machine
ARCH=$(dpkg --print-architecture)
VER=$(curl -fsSL 'https://go.dev/dl/?mode=json' | grep -m1 -o '"version": *"go[0-9.]*"' | grep -o 'go[0-9.]*')
FILE="$VER.linux-$ARCH.tar.gz"
echo "Go : $VER pour $ARCH"
# 2. Télécharger l'archive et son empreinte officielle, puis vérifier l'intégrité
cd /tmp && curl -fLO "https://go.dev/dl/$FILE"
SHA=$(curl -fsSL 'https://go.dev/dl/?mode=json' | grep -A6 -F "\"filename\": \"$FILE\"" | grep -m1 -o '"sha256": *"[0-9a-f]*"' | grep -o '[0-9a-f]\{64\}')
echo "$SHA  $FILE" | sha256sum -c -
# 3. Installer dans /usr/local/go (propriétaire root, lisible par bob)
sudo rm -rf /usr/local/go
sudo tar -C /usr/local --no-same-owner -xzf "$FILE"
sudo chmod -R a+rX /usr/local/go
# 4. Rendre la commande visible dans tous les shells
sudo ln -sf /usr/local/go/bin/go /usr/local/bin/go
sudo ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt`, { once: false, fin: "Télécharge la dernière version de Go, vérifie son empreinte et l'installe pour tous." })}
<p><strong>Attendu :</strong> une ligne <code>Go : go1.xx.x pour amd64</code>, puis <code>go1.xx.x.linux-amd64.tar.gz: OK</code>. Si tu lis <code>FAILED</code> ou <code>OK</code> absent, ne continue pas : l'archive est incomplète.</p>
<h3>A2 bis. Go : méthode 2, le paquet de la distribution (plus simple, version plus ancienne)</h3>
${sh(R`sudo apt install -y golang-go`, { once: false })}
<p class="muted-s">Choisis <strong>une seule</strong> des deux méthodes.</p>

<h3>A3. Visual Studio Code (dépôt apt officiel de Microsoft)</h3>
<p>Colle le bloc <strong>entier</strong>, de la première ligne jusqu'à <code>sudo apt install -y code</code>, en une seule fois : le morceau entre <code>&lt;&lt;EOF</code> et <code>EOF</code> est un tout.</p>
${sh(R`curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/microsoft.gpg
sudo tee /etc/apt/sources.list.d/vscode.sources >/dev/null <<EOF
Types: deb
URIs: https://packages.microsoft.com/repos/code
Suites: stable
Components: main
Architectures: $(dpkg --print-architecture)
Signed-By: /usr/share/keyrings/microsoft.gpg
EOF
sudo apt update
sudo apt install -y code`, { once: false, fin: "Ajoute le dépôt officiel de Microsoft et installe VS Code." })}
${D(
  '<p class="muted-s">Debian : le paquet <code>code</code> du dépôt Microsoft est la voie normale (ni snap ni flatpak).</p>',
  '<p class="muted-s">Xubuntu : <code>sudo snap install code --classic</code> marche aussi, mais le snap est plus lourd et plus lent au démarrage : le dépôt apt est préférable pour une VM distribuée.</p>'
)}

<h3>A4. Vérifier : alice, puis bob</h3>
${steps([

  { c: "su - bob -c 'go version'", ok: "mot de passe <code>bob@but</code>, puis la <strong>même</strong> ligne <code>go version go1.xx…</code>. C'est le test qui prouve que <strong>bob peut lancer Go</strong>. Si tu lis « Permission denied » : <code>sudo chmod -R a+rX /usr/local/go</code>.", once: false }
])}
`)}
${chemin('B', 'Avec le script', 'pour aller vite', ONLY_NOTE('go vscode') + '<p>Pour Go via le paquet de la distribution : <code>sudo GO_SOURCE=apt ONLY="go vscode" bash /opt/butgames/sae-alice.sh</code></p>')}
${note('attention', 'L\'extension Go, ce n\'est pas ici', '<p>Tu viens d\'installer <strong>VS Code lui-même</strong>, pour tout le monde. L\'<strong>extension Go</strong> et les outils de développement (<code>gopls</code>, <code>dlv</code>) s\'installent <strong>dans le compte de bob</strong> : étape « Côté bob ».</p>')}
${AIDE_LIEN('logiciels')}`,

    ['logiciels-1', "<code>git --version</code> répond."],

/* ---------- 8. Prompt git ---------- */
addSec({
  id: 'prompt', group: 'Installer', title: 'Le prompt avec l\'état de git',
  lead: "Faire afficher la branche git dans le terminal. Deux chemins séparés : tout à la main, pas à pas (pour comprendre), ou le script (pour aller vite).",
  body: () => R`
<h2>Ce qu'on veut obtenir</h2>
<p>Le <strong>prompt</strong>, c'est le texte qui s'affiche avant chaque commande, par exemple <code>alice@butgames-dev:~$</code>. Le sujet demande qu'il indique aussi <strong>l'état du dépôt git</strong> du dossier où l'on se trouve :</p>
${term(R`alice@butgames-dev:~$ cd projets/hello.sae4.but1.iut
alice@butgames-dev:~/projets/hello.sae4.but1.iut (langage_go)$ echo x >> test.sh
alice@butgames-dev:~/projets/hello.sae4.but1.iut (langage_go *)$`)}
<p>Hors d'un dépôt, rien de plus n'apparaît. Dans un dépôt : la <strong>branche</strong> (<code>langage_go</code>) et un symbole si quelque chose a changé (<code>*</code> = fichier modifié).</p>

<h2>Comprendre en 4 idées</h2>
<ol class="flow">
  <li><strong>Le prompt est une variable</strong> nommée <code>PS1</code>. Bash la relit avant chaque commande.</li>
  <li><strong>git fournit une fonction</strong>, <code>__git_ps1</code>, qui écrit la branche et l'état (ou rien hors d'un dépôt), dans le fichier <code>/usr/lib/git-core/git-sh-prompt</code>, qu'il faut « charger ».</li>
  <li><strong>Le réglage se met dans <code>~/.bashrc</code></strong>, lu par bash à chaque terminal, <em>pour chaque utilisateur</em> : il faut le faire pour alice, bob et les futurs comptes (<code>/etc/skel</code>).</li>
  <li><strong>On range le réglage dans un seul fichier commun</strong>, <code>/etc/butgames.bashrc</code>, et chaque <code>.bashrc</code> ne contient qu'une ligne qui le charge.</li>
</ol>
<details class="dt"><summary>Que veut dire la ligne PS1 ? (facultatif)</summary><div>
${tbl(['Morceau', 'Effet'], [
  [c('\\u'), 'nom de l\'utilisateur (alice, bob)'],
  [c('\\h'), 'nom de la machine'],
  [c('\\w'), 'dossier courant'],
  [c('$(__git_ps1 " (%s)")'), 'appelle la fonction git : affiche « (branche état) », ou rien'],
  [c('\\[\\033[01;32m\\]'), 'passe en vert gras ; ' + c('\\[\\033[00m\\]') + ' remet la couleur normale (vert = utilisateur, bleu = dossier, jaune = git)'],
  [c('\\$'), 'affiche $ (ou # pour root)']
], 'wrapc')}
<p><strong>Les apostrophes sont obligatoires</strong> autour de la valeur de <code>PS1</code> : avec des guillemets, bash calculerait <code>__git_ps1</code> une seule fois, tout de suite, et la branche ne se mettrait jamais à jour.</p></div></details>
${note('attention', 'Règle d\'or de cette étape : chacun teste chez soi', '<p>Un dossier ou un fichier <strong>appartient à celui qui l\'a créé</strong>. Si alice crée <code>/tmp/essai</code>, bob ne pourra pas y écrire : « Permission denied ». Les tests du prompt se font donc <strong>dans le dossier personnel de chacun</strong> (<code>~</code>), jamais dans un dossier créé par l\'autre.</p>')}

${chemin('A', 'À la main', 'étapes A1 à A6, résultat attendu après chacune', R`
<p>${who('alice')} Terminal d'<strong>alice</strong>. Fais les étapes <strong>dans l'ordre</strong>.</p>
<h3>A1. Vérifier que git fournit la fonction</h3>
${steps([{ c: 'ls /usr/lib/git-core/git-sh-prompt', ok: "le chemin du fichier est répété. Si « No such file or directory » : <code>sudo apt install -y git</code>.", once: false }])}

<h3>A2. Créer le fichier commun et le rendre lisible par tous</h3>
<p>Copie le bloc <strong>entier</strong> (de <code>sudo tee</code> jusqu'à <code>EOF</code>) en une seule fois :</p>
${sh('sudo tee /etc/butgames.bashrc >/dev/null <<\'EOF\'\n' + bashrcTxt() + '\nEOF', { once: false, fin: "Crée le fichier commun qui règle le prompt git et le PATH de Go." })}
<p>Puis, <strong>séparément</strong>, rends-le lisible par bob (et contrôle) :</p>
${steps([
  { c: 'sudo chmod 644 /etc/butgames.bashrc', ok: "aucun message.", once: false },
  { c: 'ls -l /etc/butgames.bashrc', ok: "la ligne commence par <code>-rw-r--r--</code> : tout le monde peut lire.", once: false }
])}
${note('convention', 'Tu préfères un éditeur ?', '<p><code>sudo nano /etc/butgames.bashrc</code>, colle le contenu (sans les lignes <code>sudo tee</code> et <code>EOF</code>), puis ' + kbd('Ctrl+O') + ', ' + kbd('Entrée') + ', ' + kbd('Ctrl+X') + '. Termine par le <code>chmod 644</code> ci-dessus.</p>')}

<h3>A3. Faire charger ce fichier par chaque compte</h3>
<p>Ce bloc ajoute <strong>une ligne</strong> à la fin du <code>.bashrc</code> d'alice, de bob et du modèle des futurs comptes. Il vérifie d'abord (avec <code>sudo grep</code>) que la ligne n'y est pas déjà : tu peux donc le relancer sans créer de doublon.</p>
${sh(R`for rc in /etc/skel/.bashrc /home/alice/.bashrc /home/bob/.bashrc; do
  sudo grep -qF 'butgames.bashrc' "$rc" || echo '[ -r /etc/butgames.bashrc ] && . /etc/butgames.bashrc' | sudo tee -a "$rc" >/dev/null
done`, { once: false, fin: "Ajoute une seule fois la ligne de chargement dans chaque .bashrc." })}
${steps([{ c: 'tail -n 2 ~/.bashrc', ok: "la dernière ligne est <code>[ -r /etc/butgames.bashrc ] &amp;&amp; . /etc/butgames.bashrc</code>.", once: false }])}

<h3>A4. Recharger le terminal et contrôler</h3>
${steps([
  { c: 'source ~/.bashrc', ok: "le prompt devient vert et bleu.", once: false },
  { c: 'echo "$PS1"', ok: "une ligne qui contient <code>__git_ps1</code>. Si tu vois <code>(master)</code> à la place, PS1 était entre guillemets : refais A2.", once: false }
])}

<h3>A5. Tester le prompt, chez alice (dans son dossier personnel)</h3>
${steps([
  { c: 'cd ~', ok: "le prompt montre <code>~</code>.", once: false },
  { c: 'git init -q essai-prompt', ok: "aucun message.", once: false },
  { c: 'cd essai-prompt', ok: "le prompt se termine par <code>(master #)</code> ou <code>(main #)</code>. Le <code>#</code> veut dire « dépôt sans aucun commit ».", once: false },
  { c: 'touch a.txt', ok: "le prompt devient <code>(master #%)</code> : <code>%</code> = fichier non suivi.", once: false },
  { c: 'git add a.txt', ok: "le prompt devient <code>(master +)</code> : <code>+</code> = ajouté à l'index (le <code>#</code> disparaît dès qu'un fichier est indexé).", once: false },
  { c: 'cd ..', ok: "plus aucune parenthèse : tu as quitté le dépôt.", once: false },
  { c: 'rm -r ~/essai-prompt', ok: "nettoyage ; aucun message.", once: false }
])}

<h3>A6. Tester chez bob (dans SON dossier personnel)</h3>
<p>${who('bob')} Une commande à la fois : la première ouvre le shell de bob.</p>
${steps([
  { c: 'su - bob', ok: "mot de passe <code>bob@but</code> ; le prompt devient <code>bob@butgames-dev:~$</code>, <strong>coloré</strong>.", once: false },
  { w: 'bob', c: 'git init -q essai-prompt', ok: "aucun message (tu es dans <code>/home/bob</code>, à toi).", once: false },
  { w: 'bob', c: 'cd essai-prompt', ok: "le prompt se termine par <code>(master #)</code> ou <code>(main #)</code>.", once: false },
  { w: 'bob', c: 'touch a.txt', ok: "<code>(master #%)</code>. Aucun « Permission denied » : tu travailles dans ton dossier.", once: false },
  { w: 'bob', c: 'cd ~ && rm -r essai-prompt', ok: "nettoyage ; aucun message.", once: false },
  { w: 'bob', c: 'exit', ok: "retour au terminal d'alice.", once: false }
])}
`)}
${chemin('B', 'Avec le script', 'à la place du chemin A (jamais les deux)', R`
<p>${who('alice')} Si le script est dans <code>/opt/butgames</code> (étape « Scripts tout-en-un »), une commande fait A2 et A3 :</p>
${steps([{ c: 'sudo ONLY="prompt" bash /opt/butgames/sae-alice.sh', ok: "le script affiche <code>✔ prompt et PATH définis…</code>. Ouvre un <strong>nouveau terminal</strong>, puis fais le test A5.", once: false }])}
`)}

<h2>Les symboles du prompt</h2>
${tbl(['Symbole', 'Signification'], [
  [c('(langage_go)'), 'branche courante, rien à signaler'],
  [c('*'), 'fichiers suivis <strong>modifiés</strong>, pas encore ajoutés (<code>git add</code>)'],
  [c('+'), 'modifications <strong>ajoutées</strong> à l\'index, prêtes pour le commit'],
  [c('%'), 'fichiers <strong>non suivis</strong> par git'],
  [c('$'), 'du travail mis de côté avec <code>git stash</code>'],
  [c('#'), 'dépôt neuf, <strong>sans aucun commit</strong>'],
  [c('<  >  <>  ='), 'en retard / en avance / divergent / à jour par rapport au dépôt distant']
])}
${AIDE_LIEN('prompt')}`,
  check: [
    ['prompt-1', "Le fichier /etc/butgames.bashrc existe, contient __git_ps1 et est lisible par tous (644)."],
    ['prompt-2', "Le ~/.bashrc d'alice et celui de bob chargent ce fichier (une seule fois)."],
    ['prompt-3', "Chez alice, dans ~/essai-prompt, le prompt affiche la branche et change avec % et +."],
    ['prompt-4', "Chez bob aussi (dans son dossier personnel), sans « Permission denied »."]
  ]
});

/* ---------- 9. Côté bob ---------- */
addSec({
  id: 'bob', group: 'Installer', title: 'Côté bob : extension, clone et test',
  lead: "Ce que fait le développeur dans son propre compte : extension Go, outils Go, clone de la branche langage_go, lancement de test.sh.",
  body: () => R`
<h2>D'abord : comment « être bob » ?</h2>
${tbl(['Méthode', 'Comment', 'Pour quoi faire'], [
  ['<strong>Session graphique</strong>', 'Menu <em>Applications → Log Out → Switch User</em> (ou déconnecte alice), puis connexion <code>bob</code> / <code>bob@but</code>.', 'Tout ce qui ouvre une fenêtre : <strong>VS Code</strong>, l\'extension, le clavier à vérifier.'],
  ['<strong>Terminal depuis alice</strong>', 'Dans un terminal d\'alice : <code>su - bob</code> (mot de passe <code>bob@but</code>). On en sort avec <code>exit</code>.', 'Les commandes sans fenêtre : git, go, clone, test.sh.']
], 'wrapc')}
${note('attention', 'Trois règles pour éviter « Permission denied »', '<ol><li><strong>Ne tape jamais <code>sudo</code> en bob.</strong> Le refus (« not in the sudoers file ») est voulu. Pour une tâche d\'administrateur : <code>su - alice</code>, <code>sudo …</code>, <code>exit</code>.</li><li><strong>Travaille dans <code>/home/bob</code></strong> (le <code>~</code> de bob), jamais dans le dossier d\'alice ni dans un dossier créé par alice.</li><li><strong>Utilise <code>su -</code> (avec le tiret)</strong> : sans tiret, tu restes dans le dossier d\'alice, que bob ne peut pas lire.</li></ol>')}
<p>Vérifie d'abord que tu es bien chez bob :</p>
${steps([
  { w: 'bob', c: 'whoami', ok: "<code>bob</code>.", once: false },

])}

${chemin('A', 'À la main', 'étapes B1 à B7', R`
<h3>B1. Identité git</h3>
<p>git signe chaque commit avec un nom et un email, à régler une fois par utilisateur.</p>
${sh(R`git config --global user.name "Bob"
git config --global user.email "bob@butgames.local"
git config --global init.defaultBranch main`, { once: false, fin: "Donne à git le nom et l'email de bob." })}

])}
<p>Autre méthode : dans VS Code, <em>Extensions</em> (${kbd('Ctrl+Shift+X')}), chercher « Go », choisir celle de <strong>Go Team at Google</strong>, Install. Elle se range dans <code>~/.vscode/extensions</code> : <strong>chez bob uniquement</strong>.</p>

<h3>B3. Les outils Go (gopls, dlv, staticcheck)</h3>
<p>L'extension s'appuie sur des programmes Go. Ils s'installent <strong>sans sudo</strong> dans <code>~/go/bin</code>. Chaque commande télécharge : compte une minute ou deux. Lance-les une par une.</p>
${steps([
  { c: 'go install golang.org/x/tools/gopls@latest', ok: "aucun message après un moment (c'est bon signe).", once: false },
  { c: 'go install github.com/go-delve/delve/cmd/dlv@latest', ok: "aucun message.", once: false },
  { c: 'go install honnef.co/go/tools/cmd/staticcheck@latest', ok: "aucun message.", once: false },

])}

<h3>B4. Cloner le projet de validation</h3>
${steps([
  { c: 'mkdir -p ~/projets', ok: "aucun message.", once: false },
  { c: 'cd ~/projets', ok: "le prompt montre <code>~/projets</code>.", once: false },
  { c: 'git clone --branch langage_go ' + GIT_URL, ok: "« Cloning into 'hello.sae4.but1.iut'… done. » Une erreur ? ouvre l'aide de cette étape.", once: true },
  { c: 'cd hello.sae4.but1.iut', ok: "le prompt affiche <code>(langage_go)</code>.", once: false },

<p>Le dossier prend le nom du dépôt sans <code>.git</code>. <code>--branch langage_go</code> te place directement sur la bonne branche.</p>

<h3>B5. Lire test.sh</h3>
<p>Lis toujours un script avant de l'exécuter, ne serait-ce que pour savoir ce qu'il vérifie.</p>
${steps([{ c: 'cat test.sh', ok: "le texte du script (utile pour le rapport).", once: false }])}

<h3>B6. Lancer test.sh et garder la preuve</h3>
<p>Ces <strong>deux lignes se tapent de suite</strong> (rien entre les deux) : la seconde lit le résultat de la première.</p>
${sh(R`./test.sh 2>&1 | tee ~/preuve-test.txt
echo "code retour : ${'$'}{PIPESTATUS[0]}"`, { once: false })}
<p><strong>Attendu :</strong> la sortie du test, puis <code>code retour : 0</code> (0 = aucune erreur). Le fichier <code>~/preuve-test.txt</code> garde la trace pour le rapport.</p>
<ul>
  <li><strong>« Permission denied »</strong> sur <code>./test.sh</code> : <code>bash test.sh</code> à la place, ou <code>chmod +x test.sh</code> (git verra une modification : le prompt affichera <code>*</code>).</li>
  <li><strong>« command not found »</strong> sur un outil : bob ne peut pas l'installer. Voir l'encadré ci-dessous.</li>
</ul>
${note('attention', 'Un logiciel manque ? alice l\'installe, depuis la session de bob', '<p>Trois commandes, <strong>une par une</strong> : <code>su - alice</code> (mot de passe <code>alice@but</code>), puis <code>sudo apt install -y le-paquet</code>, puis <code>exit</code> pour revenir à bob. Relance ensuite le test. Note ce cas dans le rapport : c\'est une difficulté rencontrée.</p>')}

<h3>B7. Vérifier avec un vrai projet Go</h3>

/* ---------- Mémo : la liste minimale des actions et commandes (aussi utilisée par le générateur du rapport) ---------- */
function bashrcTxt() {
  const m = $('#src-alice').textContent.match(/cat > "\$SHARED_RC" <<'EOF'\n([\s\S]*?)\nEOF\n/);
  return m ? m[1] : '';
}
const GO_CMDS = R`ARCH=$(dpkg --print-architecture)
VER=$(curl -fsSL 'https://go.dev/dl/?mode=json' | grep -m1 -o '"version": *"go[0-9.]*"' | grep -o 'go[0-9.]*')
curl -fLO "https://go.dev/dl/$VER.linux-$ARCH.tar.gz"
sha256sum "$VER.linux-$ARCH.tar.gz"
sudo rm -rf /usr/local/go && sudo tar -C /usr/local --no-same-owner -xzf "$VER.linux-$ARCH.tar.gz"
sudo chmod -R a+rX /usr/local/go
sudo ln -sf /usr/local/go/bin/go /usr/local/bin/go
sudo ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt`;
const CODE_CMDS = R`curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/microsoft.gpg
sudo tee /etc/apt/sources.list.d/vscode.sources >/dev/null <<EOF
Types: deb
URIs: https://packages.microsoft.com/repos/code
Suites: stable
Components: main
Architectures: $(dpkg --print-architecture)
Signed-By: /usr/share/keyrings/microsoft.gpg
EOF
sudo apt update && sudo apt install -y code`;

  ] }
];
function memoText(distro, goSrc) {
  const out = [];
  let n = 0;
  MEMO(distro, goSrc).forEach(g => {
    out.push(`${++n}. [${WHO[g.who]}] ${g.t}`);
    g.steps.forEach(s => {
      if (s.x) out.push('   ' + s.x);
      if (s.c) out.push(avecFin(s.c, s.f).split('\n').map(l => '       ' + l).join('\n'));

function mountTimer(host) {
  const total = PHASES.reduce((a, p) => a + p.s, 0);
  let elapsed = 0, run = false, iv = null, t0 = 0, base = 0;
  const mmss = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  host.innerHTML = `<div class="tm-clock" aria-live="off">15:00</div><div class="tm-phase"></div><div class="tm-bar"><i></i></div>
  <div class="gen-bar"><button type="button" class="btn" data-tm="go">Démarrer</button><button type="button" class="btn ghost" data-tm="reset">Remettre à zéro</button></div>
  <ol class="tm-list">${PHASES.map((p, i) => `<li data-i="${i}"><span class="tm-m"></span><span>${esc(p.t)}</span></li>`).join('')}</ol><p class="muted-s tm-tip"></p>`;
  const draw = () => {
    const left = Math.max(0, total - elapsed);
    const clock = $('.tm-clock', host); clock.textContent = mmss(left); clock.classList.toggle('low', left <= 300 && elapsed > 0);
    let acc = 0, cur = PHASES.length - 1, curEnd = total;
    for (let i = 0; i < PHASES.length; i++) { acc += PHASES[i].s; if (elapsed < acc) { cur = i; curEnd = acc; break; } }
    const finished = elapsed >= total;
    $('.tm-phase', host).textContent = finished ? 'Temps écoulé' : (elapsed === 0 && !run ? 'Prêt' : `${PHASES[cur].t} · encore ${mmss(curEnd - elapsed)}`);
    $('.tm-tip', host).textContent = finished ? '' : PHASES[cur].tip;
    $('.tm-bar i', host).style.width = Math.min(100, 100 * elapsed / total) + '%';
    let start = 0;
    $$('.tm-list li', host).forEach((li, i) => {
      const p = PHASES[i]; $('.tm-m', li).textContent = mmss(start) + ' → ' + mmss(start + p.s);
      li.classList.toggle('cur', !finished && i === cur && (run || elapsed > 0)); li.classList.toggle('done', elapsed >= start + p.s); start += p.s;
    });
    $('[data-tm=go]', host).textContent = run ? 'Pause' : (elapsed > 0 && !finished ? 'Reprendre' : 'Démarrer');
  };
  const tick = () => { elapsed = Math.min(total, base + Math.floor((Date.now() - t0) / 1000)); if (elapsed >= total) { stop(); } draw(); };
  const stop = () => { run = false; clearInterval(iv); iv = null; };
  host.addEventListener('click', e => {
    const b = e.target.closest('[data-tm]'); if (!b) return;
    if (b.dataset.tm === 'go') {
      if (run) { stop(); } else { if (elapsed >= total) elapsed = 0; base = elapsed; t0 = Date.now(); run = true; iv = setInterval(tick, 250); }
    } else { stop(); elapsed = 0; base = 0; }
    draw();
  });
  host._cleanup = stop;
  draw();
}
function mountAide(host) {
  const cur = HELP[window.__aideSel] ? window.__aideSel : 'permissions';
  host.innerHTML = `<label class="aide-l" for="aide-sel">Où est-ce que tu bloques ?</label><select id="aide-sel" class="tool-in">${HELP_ORDER.map(([id, l]) => `<option value="${id}"${id === cur ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select><div id="aide-out" class="help-panel"></div>`;
  const draw = () => { window.__aideSel = $('#aide-sel', host).value; $('#aide-out', host).innerHTML = helpPanel(window.__aideSel); };
  $('#aide-sel', host).addEventListener('change', draw); draw();
}
function mountDep(host) {
  const q = $('#dep-q', host), rows = $$('#dep-t tbody tr', host), n = $('#dep-n', host);
  const f = () => {
    const words = q.value.toLowerCase().split(/\s+/).filter(Boolean); let k = 0;
    rows.forEach(r => { const ok = words.every(w => r.dataset.t.includes(w)); r.hidden = !ok; if (ok) k++; });
    n.textContent = words.length ? `${k} résultat${k > 1 ? 's' : ''} sur ${rows.length}` : `${rows.length} problèmes décrits`;
  };
  q.addEventListener('input', f); f();
}
function mountWidgets(root) {
  $$('[data-widget]', root).forEach(h => {
    const k = h.dataset.widget;
    if (k === 'timeline') mountTimeline(h); else if (k === 'countdown') mountCountdown(h);
    else if (k === 'calc') mountCalc(h); else if (k === 'gen') mountGen(h); else if (k === 'timer') mountTimer(h); else if (k === 'aide') mountAide(h);
  });
  if ($('#dep-q', root)) mountDep(root);
}

/* ---------- Progression, distribution, navigation ---------- */
window.updateProgress = function () {
  const p = progress(), pct = Math.round(100 * p.done / p.total);
  const bar = $('#prog-bar'), txt = $('#prog-txt');
  if (bar) { bar.style.width = pct + '%'; bar.parentElement.setAttribute('aria-valuenow', String(pct)); }
  if (txt) txt.textContent = `${p.done}/${p.total} cases`;
  $$('.nav a').forEach(a => { const s = SEC[a.dataset.id]; a.classList.toggle('is-done', !!s && secDone(s)); });
  $$('.skill[data-l]').forEach(s => s.classList.toggle('is-done', secDone(SEC[s.dataset.l])));
  const sum = $('#home-sum'); if (sum) sum.innerHTML = homeSummary();
  $$('.ck-box').forEach(b => { const s = SEC[b.dataset.sec]; if (!s) return; const n = s.check.filter(([id]) => Store.data.chk[id]).length; $('.ck-n', b).textContent = n + '/' + s.check.length; b.classList.toggle('is-done', n === s.check.length); });
  try { localStorage.setItem('hub:systeme/sae-103', JSON.stringify({ done: p.done, total: p.total, lessons: p.lessons, nl: p.nl, unit: 'cases cochées' })); } catch (e) { /* stockage indisponible */ }
};
function applyDistro() {
  const d = Store.data.distro;
  document.body.dataset.distro = d;
  $$('.dist-seg button, .pick button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.setDistro === d)));
}
function setDistro(d) {
  Store.data.distro = d === 'xubuntu' ? 'xubuntu' : 'debian'; Store.save();
  const id = currentId();
  if (id === 'memo' || id === 'rapport') route(true); else applyDistro();
}
const currentId = () => { const id = (location.hash || '').replace('#', ''); return ALL_IDS.includes(id) ? id : 'accueil'; };
function route(keepScroll) {
  const id = currentId(), s = SEC[id], m = $('#main');
  $$('[data-widget=timer]', m).forEach(h => h._cleanup && h._cleanup());
  const y = window.scrollY;
  m.innerHTML = id === 'accueil' ? pageAccueil() : pageSection(s);
  $$('.nav a').forEach(a => a.setAttribute('aria-current', a.dataset.id === id ? 'page' : 'false'));
  document.title = id === 'accueil' ? 'SAE 1.03 · Installation de poste' : s.title + ' · SAE 1.03';
  applyDistro(); mountWidgets(m); window.updateProgress(); closeDrawer();
  if (keepScroll === true) window.scrollTo(0, y); else { window.scrollTo(0, 0); m.focus({ preventScroll: true }); }
}
function closeDrawer() { document.body.classList.remove('drawer-open'); const b = $('#menu-btn'); if (b) b.setAttribute('aria-expanded', 'false'); }
function setTheme(t) { try { localStorage.setItem('cours-theme', t || ''); } catch (e) { /* stockage indisponible */ } if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }

function init() {
  $('#app').innerHTML = `
<a class="skip" href="#main">Aller au contenu</a>
<header class="top">
  <button type="button" id="menu-btn" class="icon-btn" aria-label="Menu" aria-expanded="false" aria-controls="side">☰</button>
  <a class="back" href="index.html" title="Retour à la matière" aria-label="Retour à la matière">⌂</a><a class="brand" href="#accueil"><span class="brand-mark">SAE</span>1.03 <small>installation de poste</small></a>
  <div class="meter" role="progressbar" aria-label="Progression" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="prog-bar"></i></div>
  <span id="prog-txt" class="prog-txt"></span>
  <div class="tools"><a class="btn mini help-top" href="#aide" title="Aide : je suis bloqué">🆘<span class="help-top-t"> Aide</span></a><span class="dist-lbl">Distribution</span><div class="seg dist-seg" role="group" aria-label="Distribution"><button type="button" data-set-distro="debian" aria-pressed="true">Debian</button><button type="button" data-set-distro="xubuntu" aria-pressed="false">Xubuntu</button></div><button type="button" id="theme-btn" class="icon-btn" aria-label="Changer le thème" title="Thème clair / sombre">◐</button></div>
</header>
<div class="shell"><nav id="side" class="side nav" aria-label="Sommaire">${navHTML()}</nav><div class="scrim" data-app="scrim"></div><main id="main" tabindex="-1"></main></div>`;
  document.addEventListener('click', e => {
    const dist = e.target.closest('[data-set-distro]');
    if (dist) { setDistro(dist.dataset.setDistro); return; }
    const a = e.target.closest('[data-act]');
    if (a) { act(a); return; }
    if (e.target.closest('[data-app="scrim"]')) closeDrawer();
  });
  document.addEventListener('change', e => {
    const id = e.target.dataset && e.target.dataset.ck;
    if (id) { Store.data.chk[id] = e.target.checked; if (!e.target.checked) delete Store.data.chk[id]; Store.save(); window.updateProgress(); }
  });
  $('#menu-btn').addEventListener('click', () => { const o = document.body.classList.toggle('drawer-open'); $('#menu-btn').setAttribute('aria-expanded', String(o)); });
  $('#theme-btn').addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    setTheme(dark ? 'light' : 'dark');
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
  window.addEventListener('hashchange', () => route());
  route();
}
async function act(b) {
  const k = b.dataset.act;
  if (k === 'copy') {
    const fig = b.closest('figure'), t = fig.dataset.copy !== undefined ? fig.dataset.copy : $('pre', fig).textContent;
    flash(b, (await copyText(t)) ? 'Copié ✓' : 'Copie impossible');
  } else if (k === 'copy-src') {
    flash(b, (await copyText($('#' + b.dataset.src).textContent.replace(/^\n+/, ''))) ? 'Copié ✓' : 'Copie impossible');
  } else if (k === 'dl-src') {
    download(b.dataset.name, $('#' + b.dataset.src).textContent.replace(/^\n+/, ''), 'text/x-shellscript'); flash(b, 'Téléchargé ✓');
  } else if (k === 'dl-arch') {
    download('architecture-logicielle.svg', archSVG(true), 'image/svg+xml'); flash(b, 'Téléchargé ✓');
  } else if (k === 'copy-gen') {
    flash(b, (await copyText($('.gen-out').value)) ? 'Copié ✓' : 'Copie impossible');
  } else if (k === 'dl-gen') {
    download('dossier-etude-sae103.md', $('.gen-out').value, 'text/markdown'); flash(b, 'Téléchargé ✓');
  } else if (k === 'reset-gen') {
    Store.data.gen = {}; Store.save(); mountGen($('[data-widget=gen]'));
  } else if (k === 'help') {
    const bar = b.closest('.help-bar'), panel = bar.nextElementSibling, open = panel.hidden;
    if (open && !panel.innerHTML) panel.innerHTML = helpPanel(b.dataset.id);
    panel.hidden = !open; b.setAttribute('aria-expanded', String(open));
    if (open) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else if (k === 'help-open') {
    const hb = $('.help-bar [data-act=help]'); if (hb) { const panel = $('.help-panel'); if (panel.hidden) hb.click(); else panel.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  } else if (k === 'help-goto') {
    window.__aideSel = b.dataset.id;
    if (currentId() === 'aide') route(); else location.hash = '#aide';
  } else if (k === 'copy-memo' || k === 'dl-memo') {
    const t = 'SAE 1.03 - Liste minimale des actions et commandes (' + DIST_NAME[Store.data.distro] + ')\n\n' + memoText(Store.data.distro, 'tarball');
    if (k === 'copy-memo') flash(b, (await copyText(t)) ? 'Copié ✓' : 'Copie impossible'); else { download('commandes-minimales-sae103.txt', t); flash(b, 'Téléchargé ✓'); }
  }
}
init();
</script>
</body>
